# Which questions the gate is scored on, and which the work may look at.
#
# REDRAWN for 0.23.0 on 2026-09-19, with seed 20260919, and the record says why.
#
# The thirty drawn for 0.22.0 stopped being held out on 2026-09-19: eight
# questions had a correct answer in the corpus that no span covered, and the
# spans were completed after the set had been scored and the misses read. Each
# edit is defensible; the timing is not, so those thirty cannot measure anything
# again. This split draws thirty fresh ones from the same 107.
#
# It is weaker evidence than 0.22.0's was, and that is stated rather than
# implied: the work has now seen all 107 questions. What it still rules out is
# fitting *this release's* ranking changes to the set it is scored on, because
# the draw happens before the first of them and the seed is recorded here.
# The figure that carries the most weight is therefore the binary-for-binary
# comparison against 0.22.0 on this same split, where both sides saw the same
# questions.
#
# Stratified by (shape, tool) with largest-remainder allocation and a seeded
# shuffle inside each stratum, so the sealed set is not accidentally all of one
# shape -- the contract names that as a risk, and this is the mitigation.
#
# Four identifier questions are held out of the sealed set deliberately, because
# the contract names them: `id-dependency-kinds`, `id-edges-out`, `id-max-nodes`
# and `id-rrf-k`. They are the ones that missed at k=8 on 2026-09-18 and are
# still in the set; the fifth the 0.22.0 record named, `SEMLITH_IMAGE_FLOOR`, has
# no question under that id here. The acceptance criterion that each must rank
# first is written against the development set, and a question that is both the
# named example and the sealed measurement would be neither.
#
# The harness refuses to score the sealed set unless `SEMLITH_RETRIEVAL_SEALED`
# is set, and prints which set it is scoring on its first line.
#
# Shape and tool, either side of the split:
#
#   concept    search     development 32   sealed 12
#   identifier neighbors  development  3   sealed  2
#   identifier read       development  6   sealed  2
#   identifier search     development 16   sealed  6
#   identifier symbol     development  6   sealed  2
#   multi-hop  neighbors  development  2   sealed  1
#   multi-hop  path       development 10   sealed  4
#   multi-hop  search     development  1   sealed  0
#   multi-hop  symbol     development  1   sealed  1

