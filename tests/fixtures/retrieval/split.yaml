# Which questions the gate is scored on, and which the work may look at.
#
# REDRAWN for 0.25.0 on 2026-09-20, with seed 20260920, from the audited 107.
#
# Why again. 0.25.0 opened with a judgment audit of every question that missed
# at k=8 and every near-miss whose first hit was unspanned: eleven of
# twenty-four were answered correctly by a chunk no span covered, and thirteen
# spans were added. That changes the ground truth, so the thirty drawn for
# 0.23.0 measure a different question set from the one they were drawn against
# and cannot carry this release's gate.
#
# What this draw is, said plainly rather than implied:
#
#   * It is drawn from the audited set, with the seed above, and it is frozen
#     before the remaining ranking work and scored once at completion.
#   * The audit ran before it, so eight of these thirty were audited and five
#     gained a span. Both binaries in the comparison are scored against the
#     same spans, so the pair is like for like; what it is not is a set whose
#     ground truth predates the release.
#   * Two ranking changes -- the code-chunk context and the rescoring stage --
#     were measured on the development 77 before this draw, and neither was
#     decided by anything in this file. The property this split still buys is
#     the one that matters: nothing in the release was fitted to the questions
#     it is scored on.
#
# Stratified by (shape, tool) with largest-remainder allocation and a seeded
# shuffle inside each stratum, the same method 0.23.0's draw used, so the
# sealed set is not accidentally all of one shape.
#
# Four identifier questions are held out of the sealed set deliberately, as in
# 0.23.0: `id-dependency-kinds`, `id-edges-out`, `id-max-nodes` and `id-rrf-k`.
# The acceptance criterion that each must rank first is written against the
# development set, and a question that is both the named example and the
# sealed measurement would be neither.
#
# The harness refuses to score the sealed set unless `SEMLITH_RETRIEVAL_SEALED`
# is set, and prints which set it is scoring on its first line.
#
# The draw lives in the harness, in `draw`, and `the_sealed_split_is_the_one_
# the_seed_draws` fails if this file is not what that function produces from
# the seed. One implementation, so a hand-edited list cannot become the gate.
#
# Shape and tool, either side of the split:
#
#   concept    search     development  31   sealed  13
#   identifier neighbors  development   3   sealed   2
#   identifier read       development   6   sealed   2
#   identifier search     development  13   sealed   5
#   identifier symbol     development   6   sealed   2
#   multi-hop  neighbors  development   2   sealed   1
#   multi-hop  path       development  10   sealed   4
#   multi-hop  search     development   1   sealed   0
#   multi-hop  symbol     development   1   sealed   1

