# Which questions the gate is scored on, and which the work may look at.
#
# A number tuned against is not a measurement. The 107 questions in
# `questions.yaml` are split 77 development / 30 sealed here, once, before the
# first ranking change of 0.22.0. Development work sees the development set's
# numbers and nothing else; the sealed thirty are scored once, at completion, by
# the binary the release ships, and they are the figures the release record
# states.
#
# The split is stratified by (shape, tool) with largest-remainder allocation and
# a seeded shuffle inside each stratum, so the sealed set is not accidentally
# all of one shape — the contract names that as a risk, and this is the
# mitigation. Reproduce it by re-running the generator with the seed below.
#
# Five identifier questions are held out of the sealed set deliberately, because
# the contract names them: `DEPENDENCY_KINDS`, `SEMLITH_IMAGE_FLOOR`, `RRF_K`,
# `MAX_NODES` and `edges_out` are the five that missed at k=8 on 2026-09-18, and
# the acceptance criterion that each must rank first is written against the
# development set. A question that is both the named example and the sealed
# measurement would be neither.
#
# The harness refuses to score the sealed set unless `SEMLITH_RETRIEVAL_SEALED`
# is set, and prints which set it is scoring on its first line.
#
# Shape and tool, either side of the split:
#
#   concept    search     development 31   sealed 13
#   identifier neighbors  development  4   sealed  1
#   identifier read       development  5   sealed  3
#   identifier search     development 17   sealed  5
#   identifier symbol     development  6   sealed  2
#   multi-hop  neighbors  development  2   sealed  1
#   multi-hop  path       development 10   sealed  4
#   multi-hop  search     development  1   sealed  0
#   multi-hop  symbol     development  1   sealed  1

