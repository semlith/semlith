# The fixed question set for the retrieval harness (`tests/retrieval.rs`).
#
# This file is the measuring stick, so it is committed before the work it
# measures. Every question here was written from the two study documents in
# `live-project-files/semlith/docs/vector-graph-retrieval/` and from reading the
# repository, not from reading a resolver that answers them. Adding a question
# because the resolver now gets it right, or loosening a span because the
# resolver misses it, makes every number this file produces meaningless. If a
# question turns out to be wrong about the code, fix the question and say so in
# its `note`; do not fix it by widening the span until something passes.
#
#
# ## The sealed thirty stopped being held out on 2026-09-19
#
# Read this before quoting any number measured against this file after that
# date. Eight questions had a correct answer in the corpus that no span covered
# — `AGENTS.md` states outright what `concept-clip-text-encoder`,
# `concept-two-indexers-at-once`, `concept-airgap`, `concept-find-running-daemon`,
# `concept-which-languages-have-edges`, `shape-pair-prefer-question` and
# `concept-client-stanzas-source` ask for, and `docs/security.md` answers
# `concept-owner-only-modes`. A tool returning those lines gave a correct answer
# and was scored a miss.
#
# The spans were completed, and they were completed *after* the sealed thirty
# had been scored and the misses read. Each edit is defensible on its own; the
# timing is not. From this point the sealed thirty are no longer a held-out set,
# and a figure measured against them is a figure measured against questions the
# work has seen. The owner made that call with the cost stated.
#
# What that means for anyone reading a number from this file: the 0.22.0 sealed
# figures taken before this change (hit@1 17, hit@3 20, hit@8 22 of 30, and
# 19/22/23 after the defect fixes) are the last ones taken against an unseen
# set. Anything after is not, until a fresh split is drawn from questions the
# work has not been tuned against — which these 107 no longer are.
#
#
# ## The baseline the line numbers came from
#
# Spans are line ranges in `corpus/`, the pinned snapshot beside this file: the
# 0.21.0 tree at commit `4e8df39`, less `tests/drive` and less this directory.
# `corpus.yaml` records it and the harness asserts its file count and byte total
# on every run.
#
# Until 0.22.0 the spans were line ranges in `199463c` — the `develop` merge
# that is semlith 0.14.0 — while the harness indexed whatever working tree it
# was compiled in. Both halves of that were deliberate and together they were
# wrong: 47 of the 92 spans no longer contained the symbol they named, and every
# one of those scored only through the `symbol` clause of the matching rule, or
# not at all. Re-pinning them to the snapshot was mechanical — walk each
# `symbol` to its definition in the snapshot and take the range — and it moved
# 43 span occurrences. Four needed a judgement and each is noted on its
# question: `routes::record` is gone and the ledger is the one writer now, so
# those spans name `ledger::search`, `reply` and `graph`; `extract_graph` was
# renamed `write_graph`; the proto fixture's `rpc Hold` sits one line lower; and
# the "only ledger gate in the crate" span, which pointed at what is now a file
# sort comparator, names `ledger::enabled`.
#
# Line numbers still drift, and re-pinning is a deliberate act that belongs with
# a snapshot bump. The `symbol` on every span is the durable anchor, and the
# matching rule below is written so that a moved function still scores.
#
#
# ## What the set is made of
#
# 107 questions. The 57 written for 0.14.0 and re-pinned as above, and 50 added
# for 0.22.0's gate, which the contract requires to be written from reading the
# corpus rather than from reading a resolver that answers them.
#
# The 50 were drafted to these proportions, and they hold:
#
#   shape   identifier 18, concept 22, multi-hop 10
#   tool    search 30, read 6, path 6, symbol 4, neighbors 4
#
# and to spread the corpus: the 57 put 39 of their 92 spans in `store.rs`,
# `lib.rs` and `graph.rs`, and the 50 put none there, reaching instead into
# `filter.rs`, `home.rs`, `embed.rs`, `index.rs`, `formats.rs`, `add.rs`,
# `http.rs`, `mcp.rs`, `chunk.rs`, `proxy.rs`, `watch.rs`, `clients.rs`,
# `clientfile.rs`, `ledger.rs`, `image.rs`, `lock.rs`, `daemon.rs`, `doctor.rs`,
# the `docs/` pages and `AGENTS.md`.
#
# Four of the 50 were corrected before they were merged, and each carries the
# correction in its note. All four had the same defect: a question whose correct
# answers were only partly spanned, so a tool returning an unspanned correct
# answer would have scored as a miss. The rule the header already states —
# a question found wrong is fixed, never widened until something passes — cuts
# both ways, and completing a ground truth that was incomplete is the fix, not
# the widening.
#
#
# ## Schema
#
# Top level:
#
#   version    schema version of this file. Bump it if a field changes meaning.
#   baseline   the commit the spans were read from, for re-deriving them later.
#   corpus     what the harness indexes before running anything.
#   defaults   values a question may omit.
#   questions  the set itself.
#
# Every question:
#
#   id       stable, unique, never reused. Results are keyed on it, so renaming
#            an id silently breaks any comparison against an earlier run.
#   shape    what the asker already knows, not which tool answers:
#              identifier  the asker knows the term (`edges_out`, `MAX_NODES`).
#                          This is where a grep is 100-300 bytes and semlith
#                          must not cost 20-60x that.
#              concept     the asker knows the idea and not the name. This is
#                          where vector search earns its place, and where the
#                          report measured grep returning 17-59 lines of noise.
#              multi-hop   a question about the graph's structure — "does A
#                          reach B", "what happens when two symbols share a
#                          name". Only the graph answers these, and today it
#                          answers some of them wrongly.
#   tool     the surface exercised: search | symbol | neighbors | path.
#   query    for `search`: the text an agent would send.
#   name     for `symbol` and `neighbors`: the symbol asked about.
#   kinds    for `neighbors`: edge kinds to restrict to. Omitted means all.
#   want     for `neighbors`: `callers` or `callees` — which half is scored.
#   from/to  for `path`: the two endpoints.
#   depth    for `path`: hop budget. Defaults to `defaults.depth`.
#   connected  for `path`: the true answer. `false` means the two really are not
#            connected by any chain of real calls, and a tool that returns a
#            chain anyway has produced a wrong yes.
#   hops     for `path` with `connected: true`: the length of the real chain.
#   k        for `search`: how many hits to ask for. Defaults to `defaults.k`.
#   spans    the ground truth — every span that genuinely answers the question.
#   grep     optional. The command an agent who already knew the term would
#            type, run from the repository root. The report's central finding is
#            a bytes-per-answer ratio, and it cannot be computed without the
#            other side of it. A question with no sensible grep omits this.
#   note     optional prose. Present wherever the ground truth needed a
#            judgement call, saying what was checked and why this span and not
#            another.
#
# Every span:
#
#   path        repository-relative.
#   symbol      the definition the span covers. This is the anchor of record: if
#               the line numbers no longer match, re-derive them from this name.
#               A span over a doc file or a schema comment has no symbol; it
#               carries `symbol: ~` and relies on its line range.
#   start_line  inclusive, 1-based.
#   end_line    inclusive.
#
#
# ## The rule for choosing a span
#
# A span covers a whole definition — the function, the `impl` block, the `const`
# with its doc comment — with a little slack, never one exact line. A span that
# names one line is a span that breaks when somebody adds an argument above it,
# and a broken span does not fail loudly: it silently subtracts a hit from every
# metric this file feeds.
#
# Where the answer is genuinely spread across two places (the constant and the
# loop that uses it; the code and the doc that explains it), both are listed.
# Any one of a question's spans counts as a hit — they are alternatives, not a
# conjunction.
#
# Spans were preferred in stable, load-bearing files — `store.rs`, `lib.rs`,
# `chunk.rs`, `filter.rs` — over code that churns. `graph.rs` is the exception:
# some questions are about the traversal and there is nowhere else for them to
# live. Those spans are the most likely in the set to need re-deriving.
#
#
# ## What the harness is expected to do
#
# Index `corpus.roots` into a temporary store, then for each question call its
# tool and score:
#
#   hit@1 / hit@3 / hit@8
#       A returned hit satisfies a span when it is from the same `path` AND
#       either its line range overlaps [start_line, end_line], or the symbol
#       enclosing it is `symbol`. The symbol clause is what makes a moved
#       function still score. A question is a hit@k if any of its spans is
#       satisfied by any of the first k hits.
#
#   bytes per answer
#       Length of the rendered tool reply. Report the median and the worst case,
#       not the mean — the report's finding is that every search reply is about
#       7 KB whatever the question, and a mean hides that.
#
#   graph-list marginal hits
#       Of the hits that carry the `graph` badge and no other, how many satisfy
#       a span. `lib.rs`'s own comment on `graph_expansion` says a ranked walk
#       waits for a recall measurement; this is that measurement. The report
#       counted 12 graph-only hits in 88 across the seed questions and found the
#       ones it inspected to be wrong, so the number to beat is close to zero.
#
#   wrong yes
#       Over `tool: path` questions with `connected: false`: the count of
#       questions where a chain was returned. This must be zero. It is the one
#       metric with a hard gate, because a confident wrong "no chain exists,
#       here it is anyway" is worse than the tool not existing.
#
#   chain match
#       Over `tool: path` questions with `connected: true`: whether a chain was
#       found at all, and whether its length equals `hops`.
#
# A harness that does not implement `tool: symbol` or `tool: neighbors` yet
# should skip those questions and say how many it skipped, rather than scoring
# them as misses.

version: 1

baseline:
  commit: 4e8df391ebf2fd79671aed1658a05ce63b3dfc06
  release: 0.21.0
  read_on: 2026-09-18

corpus:
  # The pinned snapshot beside this file. Not a list of roots in the working
  # tree any more: the harness indexes `corpus/` and nothing else, so the same
  # binary gives the same number on any commit and on any machine.
  snapshot: corpus

defaults:
  k: 8
  depth: 6

questions:

  # ------------------------------------------------------------------
  # identifier — the asker already knows the term.
  #
  # These are the questions grep answers in one line and 100-300 bytes. The
  # point of measuring them is not recall, which should be trivially perfect;
  # it is cost. A 7 KB reply to `edges_out` is the reason an agent with grep in
  # hand does not reach for the store.
  # ------------------------------------------------------------------

  - id: id-edges-out
    shape: identifier
    tool: search
    query: edges_out
    grep: grep -rn 'fn edges_out' src
    spans:
      - path: src/store.rs
        symbol: edges_out
        start_line: 1166
        end_line: 1231
    note: >-
      Seed Q12. `edges_out` has exactly one definition in the crate, which is
      what makes it a clean identifier case: there is no name collision to
      excuse a wrong answer. FTS5 tokenises it as `edges` + `out` under
      unicode61, and both halves are rare enough that the keyword list lands it.

  - id: id-chain-hash
    shape: identifier
    tool: search
    query: chain_hash
    grep: grep -rn 'fn chain_hash' src
    spans:
      - path: src/store.rs
        symbol: chain_hash
        start_line: 1635
        end_line: 1679
    note: >-
      The report's §2.6 note 3 records that `chain_hash` never appeared at all
      when the query was the prose description (see `concept-ledger-chain`),
      because docs and tests outranked it. Asking by name is the control for
      that: if the exact identifier also misses, the problem is not
      prose-versus-code weighting.

  - id: id-max-nodes
    shape: identifier
    tool: search
    query: MAX_NODES
    grep: grep -rn 'MAX_NODES' src
    spans:
      - path: src/graph.rs
        symbol: MAX_NODES
        start_line: 1088
        end_line: 1095
    note: >-
      Span starts at the doc comment, which is where the answer actually is —
      the constant is `2000` and the reason is the four lines above it. In
      `graph.rs`, so expect this one to need re-deriving.

  - id: id-rrf-k
    shape: identifier
    tool: search
    query: RRF_K
    grep: grep -rn 'RRF_K' src
    spans:
      - path: src/lib.rs
        symbol: RRF_K
        start_line: 95
        end_line: 99
    note: >-
      The constant and its doc comment. The loop that uses it is inside
      `search_ranked`, a 170-line function; listing that whole span here would
      make almost any hit in the fusion code count, which is too generous for an
      identifier question. `concept-rrf-fusion` carries the wider span.

  - id: id-parse-timeout
    shape: identifier
    tool: search
    query: PARSE_TIMEOUT
    grep: grep -rn 'PARSE_TIMEOUT' src
    spans:
      - path: src/graph.rs
        symbol: PARSE_TIMEOUT
        start_line: 35
        end_line: 36
      - path: src/graph.rs
        symbol: extract
        start_line: 236
        end_line: 373
    note: >-
      Two spans because the constant and its use are far apart and either
      answers the question. The constant sits oddly in the middle of the `use`
      block at the top of the file, which is where it is, not a typo here.

  - id: id-overlap-lines
    shape: identifier
    tool: search
    query: OVERLAP_LINES
    grep: grep -rn 'OVERLAP_LINES' src
    spans:
      - path: src/chunk.rs
        symbol: OVERLAP_LINES
        start_line: 14
        end_line: 16
      - path: src/chunk.rs
        symbol: chunk_text
        start_line: 117
        end_line: 166
    note: >-
      `chunk.rs` is small and has barely moved in three releases, so this is one
      of the more durable spans in the set.

  - id: id-token-header
    shape: identifier
    tool: search
    query: TOKEN_HEADER
    grep: grep -rn 'TOKEN_HEADER' src
    spans:
      - path: src/http.rs
        symbol: TOKEN_HEADER
        start_line: 77
        end_line: 83
    note: >-
      Deliberately separate from `concept-token-compared`, which is the same
      subject asked as prose and which the report measured as a miss. The pair
      is the cleanest identifier-versus-concept comparison in the set.

  - id: id-dependency-kinds
    shape: identifier
    tool: search
    query: DEPENDENCY_KINDS
    grep: grep -rn 'DEPENDENCY_KINDS' src
    spans:
      - path: src/graph.rs
        symbol: DEPENDENCY_KINDS
        start_line: 1097
        end_line: 1111
    note: >-
      Doc comment included: it is the part that says why `defines` and
      `contains` are excluded, which is the answer anyone asking this wants.

  - id: id-image-floor-env
    shape: identifier
    tool: search
    query: SEMLITH_IMAGE_FLOOR
    grep: grep -rn 'SEMLITH_IMAGE_FLOOR' src
    spans:
      - path: src/lib.rs
        symbol: IMAGE_FLOOR
        start_line: 254
        end_line: 265
    note: >-
      One span covering `IMAGE_FLOOR`, `IMAGE_FLOOR_ENV` and `image_floor()`,
      which are consecutive and only make sense together. An environment
      variable name is a good identifier case because it is a single rare token
      with no plausible synonym, so a miss here is a keyword-half problem.

  - id: id-keyword-search
    shape: identifier
    tool: search
    query: keyword_search
    grep: grep -rn 'fn keyword_search' src
    spans:
      - path: src/store.rs
        symbol: keyword_search
        start_line: 386
        end_line: 437
    note: >-
      Span starts at the doc comment rather than `pub fn`, so the answer to
      "what is this and why" is inside it.

  - id: id-writing-guard
    shape: identifier
    tool: search
    query: Writing
    grep: grep -rn 'struct Writing' src
    spans:
      - path: src/store.rs
        symbol: Writing
        start_line: 226
        end_line: 243
    note: >-
      A deliberately hard identifier case: `Writing` is a common English word,
      so the keyword half has no rare token to lean on and the vector half will
      see the word in prose all over the corpus. It is the shape the report
      predicts will fail — `format` and `join` are the same class — and it is
      here to be measured rather than because it is expected to pass. The span
      covers the struct and its `impl`; `impl Drop` immediately follows at
      244-251 and is the other half of the mechanism.

  - id: id-symbol-edges-out
    shape: identifier
    tool: symbol
    name: edges_out
    grep: grep -rn 'fn edges_out' src
    spans:
      - path: src/store.rs
        symbol: edges_out
        start_line: 1166
        end_line: 1231
    note: >-
      Seed Q13. The report measured this at 106 bytes against grep's 107 — the
      one row where semlith already matches grep on cost while being
      AST-exact rather than a text match. It is the cost baseline the `locate`
      format is aiming at, so it is worth keeping measured.

  - id: id-symbol-chain-hash
    shape: identifier
    tool: symbol
    name: chain_hash
    grep: grep -rn 'fn chain_hash' src
    spans:
      - path: src/store.rs
        symbol: chain_hash
        start_line: 1635
        end_line: 1679
    note: >-
      A private function, unlike `edges_out`. Included to check that `symbol`
      answers for a name with no `pub`, since nothing in the extraction path
      depends on visibility and a regression there would be quiet.

  - id: id-neighbors-record-retrieval
    shape: identifier
    tool: neighbors
    name: record_retrieval
    kinds: [calls]
    want: callers
    grep: grep -rn 'record_retrieval' src tests
    spans:
      - path: src/ledger.rs
        symbol: search
        start_line: 129
        end_line: 200
      - path: src/ledger.rs
        symbol: reply
        start_line: 208
        end_line: 248
      - path: src/ledger.rs
        symbol: graph
        start_line: 286
        end_line: 328
      - path: tests/ledger.rs
        symbol: one_recorded_retrieval_is_one_row_the_cli_prints
        start_line: 30
        end_line: 62
      - path: tests/ledger.rs
        symbol: editing_a_row_breaks_the_chain_and_the_break_is_found
        start_line: 64
        end_line: 105
    note: >-
      Seed Q10, and the question the report singles out as the graph's best
      showing: `edges_in` is keyed on the target name and every source is an id
      with a file behind it, so callers come back exact. Verified by grep — the
      three callers listed here are every call site of `record_retrieval` in the
      crate, one production and two test. The production one is `routes::record`
      at line 462, inside the span above.

  - id: id-neighbors-edges-out
    shape: identifier
    tool: neighbors
    name: edges_out
    kinds: [calls]
    want: callers
    grep: grep -rn 'store::edges_out(' src
    spans:
      - path: src/graph.rs
        symbol: neighbours
        start_line: 1545
        end_line: 1570
      - path: src/graph.rs
        symbol: shortest_path
        start_line: 1742
        end_line: 1873
      - path: src/lib.rs
        symbol: graph_expansion
        start_line: 1952
        end_line: 2084
      - path: src/fleet.rs
        symbol: neighbours_in
        start_line: 437
        end_line: 461
    note: >-
      Four production callers, each verified by reading the call site. There are
      further call sites inside `graph.rs`'s own unit tests and inside
      `store.rs`'s; they are correct callers and a tool that lists them is not
      wrong, so the harness should score a hit on any of the four above and not
      penalise extras.

  - id: id-neighbors-chain-hash
    shape: identifier
    tool: neighbors
    name: chain_hash
    kinds: [calls]
    want: callers
    grep: grep -rn 'chain_hash(' src
    spans:
      - path: src/store.rs
        symbol: record_retrieval
        start_line: 1550
        end_line: 1601
    note: >-
      One production caller, and it is the only one. The other reference is in
      `store.rs`'s own test at 1166, which recomputes the hash to prove the
      chain verifies. A small, completely enumerable caller set is the useful
      control against `id-neighbors-edges-out`, where the set is larger.

  # ------------------------------------------------------------------
  # concept — the asker knows the idea and not the name.
  #
  # This is the half the vector index exists for, and the half where the report
  # measured grep returning 17-59 lines of noise from a guessed term. It is also
  # where prose outranks code: the architecture docs, the CHANGELOG and the
  # README describe these mechanisms in the same words the query uses, so
  # several of these questions return the essay about the code instead of the
  # code. The spans below are the implementation. Where a doc genuinely answers
  # too it is listed as a second span, but the code is listed first on purpose.
  # ------------------------------------------------------------------

  - id: concept-token-compared
    shape: concept
    tool: search
    query: where is the session token compared against the request header
    grep: grep -rn 'Semlith-Token' src
    spans:
      - path: src/http.rs
        symbol: TOKEN_HEADER
        start_line: 77
        end_line: 83
      - path: src/http.rs
        symbol: ~
        start_line: 754
        end_line: 778
    note: >-
      Seed Q1, and a measured miss: the report records the top 8 as portal
      JavaScript and routes, with `http.rs` not appearing until `lang=rust` was
      added, and then only at rank 4. The second span is the comparison itself —
      the `by_header` / `by_agent` block inside the request-admission path. It
      has no enclosing named symbol that is stable enough to anchor on, so it
      carries `symbol: ~` and a generous range; the load-bearing lines are the
      `header(TOKEN_HEADER_KEY)` check and the refusal under it.

  - id: concept-rrf-fusion
    shape: concept
    tool: search
    query: reciprocal rank fusion of vector and keyword results
    grep: grep -rn 'RRF_K' src
    spans:
      - path: src/lib.rs
        symbol: RRF_K
        start_line: 95
        end_line: 99
      - path: src/lib.rs
        symbol: search_ranked
        start_line: 2437
        end_line: 2454
    note: >-
      Seed Q2, measured at rank 4 with the top three being docs and a wrapper,
      and the fusion loop itself only 9th at k=20. The second span is the whole
      of `search_ranked` rather than the loop's exact lines, because the loop
      moves whenever a list is added to the fusion — an image list was added in
      0.13.0 and a graph list in 0.12.0 — while the function has kept its name
      and its job.

  - id: concept-edge-dst-is-a-name
    audit: unspanned-correct
    audit_added: 1
    shape: concept
    tool: search
    query: why is the edge destination a symbol name rather than an id
    grep: grep -rn 'dst' src/store.rs
    spans:
      - path: src/store.rs
        symbol: ~
        start_line: 83
        end_line: 104
      - path: docs/architecture.md
        symbol: ~
        start_line: 442
        end_line: 458
      - path: docs/portal.md
        symbol: ~
        start_line: 1103
        end_line: 1113
    note: >-
      Seed Q3. The answer is a schema comment, not code — the sixteen lines
      above `CREATE TABLE edges` are the whole argument, and there is no symbol
      to anchor on, hence `symbol: ~`. The doc span is listed second and is
      genuinely a correct answer here rather than the prose-outranks-code
      failure: this is a design-rationale question, and `docs/architecture.md`
      is where design rationale belongs.

  - id: concept-parse-timeout
    shape: concept
    tool: search
    query: tree-sitter parse timeout for pathological files
    grep: grep -rn 'PARSE_TIMEOUT' src
    spans:
      - path: src/graph.rs
        symbol: PARSE_TIMEOUT
        start_line: 35
        end_line: 36
      - path: src/graph.rs
        symbol: extract
        start_line: 236
        end_line: 373
    note: >-
      Seed Q4, measured as a hit. The deadline is set at line 257, inside
      `extract`; the whole function is the span because the deadline moves with
      any change to the parse setup around it.

  - id: concept-chunk-overlap
    shape: concept
    tool: search
    query: chunk size and overlap lines when splitting a file into chunks
    grep: grep -rn 'overlap' src/chunk.rs
    spans:
      - path: src/chunk.rs
        symbol: MAX_CHARS
        start_line: 6
        end_line: 20
      - path: src/chunk.rs
        symbol: chunk_text
        start_line: 117
        end_line: 166
    note: >-
      Seed Q5, measured as a hit. The first span covers `MAX_CHARS`,
      `OVERLAP_LINES` and `MAX_FILE_BYTES`, which are three consecutive
      constants that answer the question together.

  - id: concept-ledger-chain
    audit: unsure
    audit_added: 0
    shape: concept
    tool: search
    query: ledger rows are hash chained so an edited row is detected
    grep: grep -rn 'chain_hash' src
    spans:
      - path: src/store.rs
        symbol: record_retrieval
        start_line: 1550
        end_line: 1601
      - path: src/store.rs
        symbol: chain_hash
        start_line: 1635
        end_line: 1679
    note: >-
      Seed Q6, and a measured miss — §2.6 note 3 records that docs, tests and
      `record_retrieval` outranked `chain_hash` at store.rs:1096, which never
      appeared at all. Note that `record_retrieval` is itself listed as a span
