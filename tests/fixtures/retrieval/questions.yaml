  - id: concept-where-a-retrieval-is-written
    audit: wrong
    audit_added: 0
    shape: concept
    tool: search
    query: where does a search get written down so the savings can be counted later
    grep: grep -rn 'record_retrieval\|state.ledger' src
    spans:
      - path: src/ledger.rs
        symbol: search
        start_line: 129
        end_line: 200
      - path: src/ledger.rs
        symbol: reply
        start_line: 208
        end_line: 248
      - path: src/ledger.rs
        symbol: graph
        start_line: 286
        end_line: 328
      - path: src/store.rs
        symbol: record_retrieval
        start_line: 1550
        end_line: 1601
    note: >-
      Two spans, and they are the whole of it. `routes.rs:416` holds the only
      `if state.ledger` gate in the crate and `routes.rs:417` is the only
      production call to `routes::record`, with the client string hardcoded to
      `"portal"`. That single fact is what makes the four `not connected` path
      questions below true, so this question and those share their evidence.

  # ------------------------------------------------------------------
  # multi-hop — questions only the graph answers.
  #
  # The `connected: false` questions are the wrong-yes gate. They come from
  # `docs/graph-path-inferred-edges.md`, where each was reproduced returning a
  # short, plausible, entirely wrong chain, every hop labelled `(inferred)`.
  #
  # As written against the 199463c baseline there were four of them, and the
  # truth in each case was that no MCP tool call reached the retrieval ledger:
  # `routes.rs:416` held the only `if state.ledger` gate in the crate,
  # `routes::record` was the only production caller of `store::record_retrieval`
  # with its client hardcoded to "portal", and neither `mcp::call_tool` nor
  # `routes::mcp` touched the ledger at all.
  #
  # 0.15.0 changed that, deliberately: it is the release that made every surface
  # record. `routes::record` is gone, its job moved to `src/ledger.rs`, and
  # `mcp::call_tool` now calls it. Two of the four questions therefore became
  # genuinely connected — `path-call-tool-to-ledger` at three hops and
  # `path-answer-to-ledger` at five — and both were re-derived from a clean
  # index of the tree, with every hop `resolved` or `extracted` and no seam.
  # Their notes carry the chain and the reasoning.
  #
  # `path-search-in-to-ledger` and `path-is-image-to-ledger` stay at
  # `connected: false` and are now the whole of the gate. `search_in` reaches
  # the search machinery and never the ledger, which is what makes it the
  # control: if a change ever makes the finder answer "yes" there, that is a
  # wrong yes rather than a third flip, and the difference is checkable by
  # reading the three hops it would have to invent.
  #
  # The `connected: true` questions keep the metric two-sided. Each was verified
  # by reading every call site in its chain.
  # ------------------------------------------------------------------

  - id: path-call-tool-to-ledger
    shape: multi-hop
    tool: path
    from: call_tool
    to: record_retrieval
    depth: 6
    # Was `false`, and was true at the 199463c baseline. 0.15.0 made the two
    # genuinely connected: see the note.
    connected: true
    hops: 3
    grep: grep -rn 'record_retrieval\|fn call_tool\|ledger' src/mcp.rs src/routes.rs
    spans:
      - path: src/mcp.rs
        symbol: call_tool
        start_line: 616
        end_line: 1187
      - path: src/ledger.rs
        symbol: enabled
        start_line: 32
        end_line: 42
    note: >-
      Seed Q11, and the origin of the whole finding. The reported false chain
      was `call_tool -> index -> first_store -> record -> record_retrieval`,
      four hops, every one inferred. It is the clearest case in the document:
      `first_store` at routes.rs:1277 calls `home::record`, the registry write,
      and the traversal arrives at the name `record` and leaves it through an
      edge belonging to `routes::record` — two unrelated functions welded into
      one hop because `record` has two definitions. `index` on that chain has
      seven. The first span is the search arm of `call_tool`, which runs
      `search_in` then `render` and records nothing; the second is the only
      ledger gate in the crate. The report measured this as 168 bytes to reach a
      confident wrong yes, against roughly 5.2 KB of grep plus two reads to
      reach a correct no.

      Changed in 0.15.0, and the change is in the code rather than in this
      file. The release made `call_tool` record every retrieval, so the chain
      `call_tool -> record -> graph -> record_retrieval` now genuinely exists:
      `mcp::call_tool` calls `mcp::record`, which calls `ledger::graph`, which
      calls `store::record_retrieval`. Measured on a clean index of the tree at
      the time of the release: three hops, one extracted and two resolved, no
      seam and no ambiguous name.

      This is the one kind of edit this file permits — the ground truth was
      right about 0.14.0 and the code stopped matching it — and it is the kind
      most easily abused, so the check that distinguishes it is recorded here.
      The false chain this question was written for went through `record` with
      two definitions and `index` with seven, and was welded at a seam. The
      chain now is not that chain: it goes through a different `record`, in
      `mcp.rs`, that the caller is in the same file as, and every hop resolves
      to exactly one definition. `path-search-in-to-ledger` is the control and
      is deliberately left at `connected: false` — `search_in` still does not
      reach the ledger, and if a future change makes the tool answer "yes"
      there, that is a wrong yes and not another flip.

  - id: path-answer-to-ledger
    shape: multi-hop
    tool: path
    from: answer
    to: record_retrieval
    depth: 6
    # Flipped for the same reason as `path-call-tool-to-ledger`, one hop
