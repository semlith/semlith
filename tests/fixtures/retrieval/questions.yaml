  # ------------------------------------------------------------------
  # multi-hop — questions only the graph answers.
  #
  # Every `connected: true` below was traced by reading each call site in the
  # source, and the chain is written into the note so it can be re-checked
  # without re-deriving it. Both `connected: false` questions have a `from` that
  # calls nothing defined in this crate at all, which was established by reading
  # the whole body rather than by failing to find a chain with a tool.
  # ------------------------------------------------------------------

  - id: path-scan-text-to-entropy
    shape: multi-hop
    tool: path
    from: scan_text
    to: entropy
    depth: 6
    connected: true
    hops: 1
    grep: grep -n 'entropy(' src/filter.rs
    spans:
      - path: src/filter.rs
        symbol: scan_text
        start_line: 1040
        end_line: 1073
    note: >-
      One hop, read at the call site: `scan_text` at 1047 calls `entropy` at
      1061, inside the `&&` chain that decides whether a generic assignment is a
      credential. Both names have exactly one definition in the crate —
      `entropy` at 1104 and `scan_text` at 1047 — so neither endpoint is
      ambiguous and the chain cannot be welded at a seam. Only the `from` span
      is listed; `entropy`'s definition is in the same file and the file is
      already at its span budget for this draft.

  - id: path-denied-to-glob-match
    shape: multi-hop
    tool: path
    from: denied
    to: glob_match
    depth: 6
    connected: true
    hops: 2
    grep: grep -n 'denied_against\|glob_match(' src/filter.rs
    spans:
      - path: src/filter.rs
        symbol: denied
        start_line: 490
        end_line: 499
    note: >-
      Two hops, both read: `denied` at 496 calls `denied_against` at 498, and
      `denied_against` calls `glob_match` at 530 inside the `DENIED_NAMES` loop.
      Each of the three names has one definition in `src/`. The indirection is
      the whole point of the question — `denied` never mentions `glob_match`, so
      a grep for one from the other returns nothing and the two hops are the
      only way to connect them.

