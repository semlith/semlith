      `shape-pair-ppr-question`; both ask for `graph::expand`. Written first as
      the query `personalised_pagerank`, which was a mistake and is recorded
      here rather than quietly corrected: no such identifier exists in the
      crate, so the question asked for a term the corpus does not contain and
      could only ever be a miss. `DAMPING` is what a programmer who knows this
      code would actually type. The file's own rule is to fix a question that is
      wrong about the code and say so, not to widen a span until something
      passes.

