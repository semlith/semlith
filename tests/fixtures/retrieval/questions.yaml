      defined here. But `find` *is* a name this crate defines, at
      `src/proxy.rs:48`, and `proxy::find` reaches a chain of its own through
      `Upstream::alive` and `request`. A traversal over collapsed names
      therefore has somewhere to go from a leaf that calls nothing, which is
      exactly the failure mode `docs/graph-path-inferred-edges.md` describes.
      The true answer is no: read at 367-376, `negotiate` calls nothing in this
      crate, so no chain to `edges_out` or to anything else exists.

