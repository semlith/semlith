    audit_added: 0
    shape: multi-hop
    tool: search
    query: what happens when two different functions in different files have the same name
    grep: grep -rn 'dst' src/store.rs src/graph.rs
    spans:
      - path: src/store.rs
        symbol: ~
        start_line: 83
        end_line: 104
      - path: src/graph.rs
        symbol: shortest_path
        start_line: 1742
        end_line: 1873
      - path: src/graph.rs
        symbol: ~
        start_line: 21
        end_line: 28
    note: >-
      Asked as a search rather than a graph call, because it is the question an
      agent asks just before it decides whether to trust a path result, and
      nothing in the tool surface answers it. The three spans are the schema
      comment explaining that `dst` is a name resolved at query time, the
      breadth-first traversal that walks those collapsed names, and the module
      doc that states the invariant the composition violates in spirit: an
      inferred edge is marked and stays marked everywhere it surfaces, and
      nothing may present one as the other. In this repository 136 names have
      more than one definition, covering 405 symbols, and 9727 of 9926 call
      edges are inferred — so this is not a corner case, it is the normal case.

  # ------------------------------------------------------------------
  # 0.16.0 — the questions this release's features exist to answer.
  #
  # These are the one place in this file whose spans are NOT line ranges in
  # 199463c, because the code they ask about did not exist in 0.14.0. Their
  # spans are read from the 0.16.0 working tree and the `symbol` anchor is what
  # keeps them scoring after the lines move, exactly as the matching rule at the
  # top of this file describes. Said here rather than left for a reader to
  # notice.
  #
  # The identifier/question pairs are the point of the shape work: both halves
  # of a pair ask for the same code, one the way a programmer types and one the
  # way a person asks, and both have to land it. A pair where only one half
  # scores is the measurement saying the weighting went too far.
  # ------------------------------------------------------------------

  - id: shape-pair-ppr-identifier
