  - id: path-is-binary-to-scan-text
    shape: multi-hop
    tool: path
    from: is_binary
    to: scan_text
    depth: 6
    connected: false
    grep: grep -rn 'fn is_binary' src
    spans:
      - path: src/chunk.rs
        symbol: is_binary
        start_line: 119
        end_line: 122
    note: >-
      A deliberate trap rather than an arbitrary pair. Both ends are rules about
      refusing a file's contents and they run within a few lines of each other
      in the index loop, so the two read as though one must call the other —
      they do not. `is_binary` is three lines and its whole body is
      `bytes.iter().take(8192).any(...)`: `iter`, `take` and `any` are inherent
      iterator methods and none of the three is defined in this crate, so
      `is_binary` has no outgoing call to anything here. Checked by reading the
      body at 120-122, not by failing to find a chain.

  - id: path-negotiate-to-edges-out
    shape: multi-hop
    tool: path
    from: negotiate
    to: edges_out
