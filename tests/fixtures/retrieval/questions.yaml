  # --- 0.17.0: the forty languages the graph gained -------------------------
  #
  # Per-language proof is not here, and deliberately so. Every one of the
  # forty-six has a fixture under `tests/fixtures/graph/` with a declared table
  # of the symbols and edges it must yield, asserted in `src/graph.rs` without a
  # model — that is a stronger statement than a retrieval score, and it fails
  # for a language that extracts nothing. Adding ninety-two questions here whose
  # subjects are forty-six files that all define `helper` and `acquire` would
  # measure the ambiguity collapse, not the coverage, and would cost the harness
  # its running time to do it.
  #
  # What is asked here is what only this harness can answer: whether a symbol in
  # a language that had no graph before is findable, and whether the edge a
  # markup language contributes is walkable, at the same k and the same byte
  # budget as everything else.

