        symbol: answer
        start_line: 93
        end_line: 98
      - path: src/ledger.rs
        symbol: enabled
        start_line: 32
        end_line: 42
    note: >-
      The reported false chain was five hops:
      `answer -> handler -> route -> search -> record -> record_retrieval`.
      Note that `answer` itself has two definitions in this crate, `http::answer`
      and `mcp::answer`, so the question's own endpoint is ambiguous — which is
      part of what makes it a good test, and why the span names `mcp::answer`
      explicitly. Either way the true answer is the same: neither reaches the
      ledger.

