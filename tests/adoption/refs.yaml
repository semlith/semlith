# Reference keys for judge.py, one per prompt in bench.py.
#
# Each key was written by reading the code, and the facts under it are what it
# rests on: `at` is path:line, `has` is text that line must contain. An `at`
# with no line is a file that must exist. `repo` names a sibling repository
# (default: this one). verify.py checks every fact against the tree it runs on
# and reports lines that moved, so re-run it on the release tree before judging
# and update the key text for anything it reports.
#
# Verified against 52645bd (0.30.0 release tree) on 2026-09-25, and semlith-cloud /
# infra as checked out beside it that day.

repos:
  core: .
  semlith-cloud: ../semlith-cloud
  infra: ../infra

