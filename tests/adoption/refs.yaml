  bug-startup:
    key: >-
      That exact line is the 0.29.0 daemon's; this tree no longer prints it. The daemon queues the startup
      catch-up as an admitted run (admission.submit(..., RunKind::CatchUp), src/daemon.rs:3254) and runs its
      watcher with catch_up: false (daemon.rs:3263), so the watcher's catch_up report was IndexReport::default
      (watch.rs:210-216) and "0 indexed, 0 unchanged" described work that had not happened yet. Not a data
      bug, a misleading line: 0.30.0 prints "(catch-up deferred: N files queued)" instead (daemon.rs:3288-3291,
      comment at 3284-3286), and "catch-up done: X indexed, Y unchanged, Z removed" when that run finishes
      (daemon.rs:3601). `semlith watch` (src/main.rs:1504, Progress::Ready from watch.rs:219) still prints
      "indexed at startup" from its own walk, and says deferred instead when the pass yielded with
      catch_up.remaining > 0 (main.rs:1491-1494). Best answers identify the queued/deferred catch-up.
    facts:
      - {at: src/daemon.rs:3254, has: 'RunKind::CatchUp'}
