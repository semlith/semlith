  x-cloud-mcp:
    key: >-
      semlith-cloud serves the core's MCP answers over HTTP rather than reimplementing them, so everything
      downstream of `semlith::mcp::answer` depends on the reply's shape. src/mcp/mod.rs:83 hands each JSON-RPC
      message to semlith::mcp::answer unchanged (module doc at mod.rs:3). src/mcp/meta.rs:106 cited_roots
      serialises /result/content and scans it for absolute `<stores>/<org>/src/<owner>/<name>/` prefixes, so
      it depends on the core rendering absolute paths into the text. src/mcp/meta.rs:58 attach writes
      freshness into result._meta beside the core's own server info (needs `result` to be an object).
      src/roots.rs:116 rewrite_text / :127 rewrite_value strip host prefixes from every string in the reply,
      which assumes paths appear as plain substrings. src/mcp/meta.rs:144 confine_to_root adds a `path`
      argument and :157 takes_path_filter names the tools that accept it (semlith_search, semlith_pattern,
      semlith_files). src/mcp/mod.rs:113 sizes the ledger row from result.content. src/mcp/transport.rs:17
      holds a semlith::mcp::Session per HTTP session and relies on answer returning None for a notification
      (transport.rs:5). src/ledger.rs:35 explains chunk_ids are empty because answer returns rendered text.
      Tests: tests/flow.rs:357 asserts the served tool list equals semlith::mcp::tool_names(), and
      tests/flow.rs:~395-414 asserts the hosted reply is the direct answer byte for byte after rewrite_text,
      reading /result/content/0/text (text_of, flow.rs:101). Cargo.toml:23 pins semlith = "0.25", so a core
      format change reaches the cloud only on a dependency bump. The impact check (src/impact/compute.rs)
      reads the store through semlith::store and semlith::graph and does NOT depend on MCP text. Best answers
      name answer passthrough, cited_roots, rewrite_value, attach/_meta and the flow.rs byte-equality test.
    facts:
