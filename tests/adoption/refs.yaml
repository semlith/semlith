  bug-startup:
    key: >-
      Printed by the daemon at src/daemon.rs:3071-3074 (Progress::Ready, from watch.rs:219) and a similar line
      in src/main.rs:1343 (`semlith watch`). catch_up is the IndexReport of the startup incremental pass
      (watch.rs:210-216). 0 indexed + 0 unchanged for 367 files means the catch-up pass did not walk the
      files: either held.catch_up was false (IndexReport::default) or the pass yielded immediately because
      something was waiting (step_aside -> Flow::Yield), leaving catch_up.remaining > 0 and `behind` = true so
      the walk continues in the loop later. So not a data bug, but the log line is misleading because it
      omits `remaining`/that catch-up was deferred. Answer is best if it identifies the yield/remaining
      explanation.
    facts:
      - {at: src/daemon.rs:3073, has: 'indexed at startup'}
      - {at: src/watch.rs:219, has: 'Progress::Ready'}
      - {at: src/main.rs:1343, has: 'indexed at startup'}
      - {at: src/watch.rs:210, has: 'held.catch_up'}

