  locate-const:
    key: >-
      RRF_K = 60.0 at src/lib.rs:142 (const RRF_K: f32). 60 is the value from the original reciprocal rank
      fusion / TREC work (Cormack et al.); it flattens the curve so a result ranked third is not dismissed,
      and fuses by rank because vector cosine and BM25 are on different scales. A good answer may also
      mention the query-shape weighting / other constants nearby.
    facts:
      - {at: src/lib.rs:142, has: 'const RRF_K: f32 = 60.0'}

  how-stale:
    key: >-
      src/lib.rs mark_freshness (~src/lib.rs:3887): a hit is stale when the file's current size differs from
      the indexed byte count OR its mtime is newer than indexed_at (missing/unreadable file = stale; no store
      row = fresh). Stale hits get score *= 1 - STALE_PENALTY where STALE_PENALTY = 0.10 (src/lib.rs:387,
      applied ~3683), i.e. demoted 10% and re-sorted, not dropped; they are labelled stale in output. Spans
      have the same check (mark_span_freshness ~3827).
    facts:
      - {at: src/lib.rs:3887, has: 'fn mark_freshness'}
      - {at: src/lib.rs:3917, has: 'indexed_at'}
      - {at: src/lib.rs:387, has: 'const STALE_PENALTY: f32 = 0.10'}
      - {at: src/lib.rs:3683, has: '1.0 - STALE_PENALTY'}
