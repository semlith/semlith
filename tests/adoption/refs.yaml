  x-hit-field:
    key: >-
      Core, compile errors: `Hit` (src/lib.rs:582) has public fields, no Default and no #[non_exhaustive], so
      every struct literal stops compiling (E0063) until it sets the new field: src/lib.rs:3526 (image hit),
      src/lib.rs:3560 (chunk hit), and the test helpers src/fleet.rs:1230 and src/mcp.rs:1951. Nothing in
      tests/*.rs builds one (tests/fixtures copies do not count). Core, output that changes without breaking:
      Hit derives Serialize, so `semlith search --json` (src/main.rs:1420) gains a key unless the field is
      skip_serializing_if; the MCP text renderers (mcp.rs render 1850, locate_row 1703) and the hand-built
      /api/search JSON (routes.rs ~913) do not show it until changed (portal parity); compatibility.md:163
      allows additive fields, and compatibility.md:51 says the library API (including Hit) changes with the
      minor version, so a new pub field is a breaking change for any external crate that builds Hit literals.
      semlith-cloud: nothing breaks. It pins semlith = "0.25" (Cargo.toml:23), so nothing changes until the
      dependency is bumped, and it never names or constructs `Hit` (its DocumentHit, src/impact/model.rs:122,
      is its own type). After a bump the only effect is MCP reply text it passes through: the tests/flow.rs
      byte-equality check (~410) compares against the same crate's direct answer, and cited_roots /
      rewrite_value only care about path substrings. Best answers list the four core literals, say the cloud
      does not break and why (no Hit use, version pin), and mention --json.
