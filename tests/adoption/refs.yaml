  concept-secrets:
    key: >-
      Two layers. By name: src/filter.rs DENIED_DIRS (:478, ~/.ssh, ~/.aws, ...) and DENIED_NAMES (:498;
      `.env*` at :503, plus key/pem/credential names), applied by Semlith::refuses (src/lib.rs:914) on the
      walk. By content, on every file's text before it is chunked or embedded (index_set_writing,
      lib.rs:2790): the prefix table filter::SHAPES (filter.rs:972; AKIA|ASIA at :998, private key blocks,
      JWTs, ...) plus the no-prefix assignment rules ASSIGNMENT (:1124) and, from 0.30.0, ENV_ASSIGNMENT
      (:1132) for unquoted .env/export values, both gated on MIN_ENTROPY 3.2 (:1139). src/keyscan.rs judges
      each match: a declared test dummy (dummy_rule keyscan.rs:391: (a) published doc example, (b) EXAMPLE/FAKE
      marker or repeated character, (c) private-key header with no body :246) or live-looking; one live match
      refuses the whole file (keyscan::refuses :124, decide :175) with 'holds what looks like ... — semlith
      does not index it' (filter.rs:1157). Each match carries a 0-100 confidence (keyscan.rs:53) for a person,
      never a gate. Refusals persist masked in the `refusals` table (store.rs:167); a person can accept one
      file (Semlith::accept lib.rs:1907, `acceptances` table store.rs:183, salted fingerprints, redacted or
      as-is; a new match refuses it again). Semlith::plan (lib.rs:1741) runs this scan phase before
      embedding. Documented in docs/security.md:145. A good answer finds filter.rs and keyscan.rs.
