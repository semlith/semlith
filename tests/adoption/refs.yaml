  overview-src:
    key: >-
      src/ is one crate; AGENTS.md:110-147 is the module table. Entry points: main.rs (clap parsing and human
      output) and lib.rs (the Semlith type: open, index, search, persist, the scan phase `plan`; Hit). Engine:
      store.rs (every SQL statement), index.rs (vector side, single vs sharded), chunk.rs (file bytes to
      chunks), formats.rs (non-plain-text readers), embed.rs (model loading), accel.rs / gpu.rs / cuda.rs
      (embedding lanes), rerank.rs (optional cross-encoder rescoring), image.rs (CLIP images). Retrieval on
      top: fleet.rs (several stores, merged ranking), filter.rs (path/ext/lang filters, the deny-list and the
      credential shapes), keyscan.rs (verdict on each secret-shaped match: dummy or live, confidence,
      redaction, accept/refuse), graph.rs (tree-sitter extraction and traversals), pattern.rs (tree-sitter
      queries), brief.rs (composite brief), tree.rs (the `files --tree` directory view). Surfaces: mcp.rs
      (stdio JSON-RPC MCP server), proxy.rs (semlith mcp forwarding to a daemon), daemon.rs (semlith start),
      routes.rs (daemon HTTP routes), http.rs (HTTP/1.1, token, CSP), portal/ (the web UI: app.js,
      index.html, style.css, fonts, icons, mod.rs). Keeping current: watch.rs, lock.rs, priority.rs,
      schedule.rs. Agent integration: setup.rs (semlith setup), clients.rs (parses docs/clients.md),
      clientfile.rs (client config files), agentfiles.rs (skill, hook, rule block and the semlith-explorer
      agent), hook.rs (the PreToolUse steering hook, soft/gate/hard, reads Bash too), doctor.rs. Home and
      operations: home.rs (store home, registry.json), service.rs (login service), upgrade.rs, ledger.rs,
      report.rs, replay.rs, add.rs (URL fetch), system.rs, clock.rs. A good answer groups files by
      responsibility, covers more than the AGENTS.md table (setup/hook/doctor/service are not in it), and is
      correct about what each holds; exhaustiveness beyond that earns little.
