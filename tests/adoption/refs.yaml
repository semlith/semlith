  x-infra-deploy:
    key: >-
      The infra repository holds no deployment code, only documents (README.md and docs/); the deployment
      they describe is Coolify on one Contabo VPS. infra/docs/deploy.md:28: the `semlith-cloud` Coolify
      resource builds the `semlith/semlith-cloud` repository from its Dockerfile on `main`, mounts a volume at
      `/stores`, and serves cloud.semlith.com; Traefik in Coolify terminates TLS with Let's Encrypt (:32).
      A change reaches production by merging `develop` into `main`; Coolify auto-deploys on push (deploy.md:87),
      rollback is redeploying the previous image from Coolify (:88). docs/architecture.md:74-75: Coolify builds
      the Docker image on the box on push; cargo test and the compose integration run locally before merge
      (no CI). Environment variables are set on the Coolify resource, never committed (deploy.md:36), listed
      in docs/cloud-service.md:220-231 (DATABASE_URL, SESSION_SECRET, ZITADEL_*, GITHUB_APP_*, STORES_DIR,
      MODELS_DIR, INDEX_CONCURRENCY...). Alongside it: Postgres 16 one-click and Zitadel (deploy.md:26-27).
      The image itself is semlith-cloud/Dockerfile (rust:1-trixie builder :10, debian:trixie-slim runtime :40,
      VOLUME /stores :62, EXPOSE 8080 :66, ENTRYPOINT semlith-cloud :68); semlith-cloud/docker-compose.yml is
      the local dev stack (postgres, zitadel, mailpit), not production. Best answers say infra is docs, name
      Coolify + the Dockerfile + push-to-main, and do not present the dev compose file as the deployment.
    facts:
      - {repo: infra, at: docs/deploy.md:28, has: '| semlith-cloud |'}
      - {repo: infra, at: docs/deploy.md:32, has: 'Traefik'}
      - {repo: infra, at: docs/deploy.md:36, has: 'Set in Coolify'}
      - {repo: infra, at: docs/deploy.md:87, has: 'Coolify auto-deploys on push'}
      - {repo: infra, at: docs/deploy.md:88, has: 'Rollback'}
      - {repo: infra, at: docs/architecture.md:75, has: 'Coolify builds the Docker image'}
      - {repo: infra, at: docs/cloud-service.md:222, has: 'DATABASE_URL'}
      - {repo: infra, at: docs/cloud-service.md:230, has: 'STORES_DIR'}
      - {repo: semlith-cloud, at: Dockerfile:10, has: 'FROM rust:1-trixie'}
      - {repo: semlith-cloud, at: Dockerfile:40, has: 'FROM debian:trixie-slim'}
      - {repo: semlith-cloud, at: Dockerfile:62, has: 'VOLUME'}
      - {repo: semlith-cloud, at: Dockerfile:66, has: 'EXPOSE 8080'}
      - {repo: semlith-cloud, at: Dockerfile:68, has: 'ENTRYPOINT'}
      - {repo: semlith-cloud, at: docker-compose.yml:70, has: 'mailpit'}

  x-hit-field:
    key: >-
      Core, compile errors: `Hit` (src/lib.rs:667) has public fields, no Default and no #[non_exhaustive], so
      every struct literal stops compiling (E0063) until it sets the new field: src/lib.rs:4235 (image hit),
      src/lib.rs:4271 (chunk hit), and the test literals src/lib.rs:5548, src/fleet.rs:1322 and
      src/mcp.rs:2222. Nothing in tests/*.rs builds one (tests/fixtures copies do not count). Core, output that
      changes without breaking: Hit derives Serialize (lib.rs:666), so `semlith search --json`
      (src/main.rs:1581) gains a key unless the field is skip_serializing_if; the MCP text renderers (mcp.rs
      render 2121, locate_row 1945) and the hand-built /api/search JSON (routes.rs ~939) do not show it until
      changed (portal parity); compatibility.md:163 allows additive fields, and compatibility.md:51 says the
      library API (including Hit) changes with the minor version, so a new pub field is a breaking change for
      any external crate that builds Hit literals. semlith-cloud: nothing breaks. It pins semlith = "0.25"
      (Cargo.toml:23), so nothing changes until the dependency is bumped, and it never names or constructs
      `Hit` (its DocumentHit, src/impact/model.rs:122, is its own type). After a bump the only effect is MCP
      reply text it passes through: the tests/flow.rs byte-equality check (~410) compares against the same
      crate's direct answer, and cited_roots / rewrite_value only care about path substrings. Best answers
      list the core literals (two product, three test), say the cloud does not break and why (no Hit use,
      version pin), and mention --json.
    facts:
      - {at: src/lib.rs:667, has: 'pub struct Hit'}
      - {at: src/lib.rs:666, has: '#[derive(Debug, Clone, Serialize)]'}
      - {at: src/lib.rs:4235, has: 'Hit {'}
      - {at: src/lib.rs:4271, has: 'Hit {'}
      - {at: src/lib.rs:5548, has: 'Hit {'}
      - {at: src/fleet.rs:1322, has: 'Hit {'}
      - {at: src/mcp.rs:2222, has: 'crate::Hit {'}
      - {at: src/main.rs:1581, has: 'to_string_pretty(&hits)'}
      - {at: docs/compatibility.md:51, has: '`Hit`'}
      - {at: docs/compatibility.md:163, has: 'Additive fields'}
      - {count: 'Hit \{\s*$', not: 'struct |->', under: src, ext: .rs, is: 5}
      - {count: 'Hit \{\s*$', not: 'struct |->', under: tests, ext: .rs, skip: fixtures, is: 0}
      - {repo: semlith-cloud, at: Cargo.toml:23, has: 'semlith = "0.25"'}
      - {repo: semlith-cloud, at: src/impact/model.rs:122, has: 'pub struct DocumentHit'}
      - {repo: semlith-cloud, count: '\bHit\b', under: src, ext: .rs, is: 0}
