[package]
name = "semlith"
version = "0.15.0"
edition = "2024"
rust-version = "1.90"
description = "A fast local vector store for AI agents — index files once, keep it current as you save, and answer questions across all of it in milliseconds without leaving the machine."
repository = "https://github.com/semlith/semlith"
homepage = "https://github.com/semlith/semlith"
license = "Apache-2.0"
readme = "README.md"
keywords = ["vector-search", "embeddings", "rag", "mcp", "semantic-search"]
categories = ["command-line-utilities", "database", "text-processing"]
# CI config and local credentials are not part of the crate.
exclude = [".env", ".github"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.5"
clap = { version = "4.6.4", features = ["derive"] }
cliclack = "0.5.6"
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"] }
libc = "0.2.189"
fastembed = { version = "6.0.3", default-features = false, features = ["hf-hub", "image-models"] }
# ONNX Runtime, named here so it can be linked two ways. `ort` is fastembed's
# dependency and is pinned to the exact version fastembed pins.
ort = { version = "=2.0.0-rc.13", default-features = false, optional = true }
# Already in the tree under fastembed's image feature; named here to read an
# image's pixel size out of its header without decoding the whole thing.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Already in the tree under fastembed; named here because the agent key must
# come from the OS random source rather than from a hash of the clock.
getrandom = "0.3.4"
# Already in the tree under fastembed, which loads this exact tokenizer to
# embed with; named here so the ledger can count tokens with the same one
# rather than estimating at four characters each. No features of its own, so
# what is built is what fastembed was already building.
tokenizers = { version = "0.23", default-features = false }
ignore = "0.4.31"
pdf-extract = "0.12.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
turbovec = "1.0.0"
notify = "8.2.0"
# The structure half of the store. One parser plus a grammar per language that
# carries edges; each grammar's own `TAGS_QUERY` supplies the definitions, and
# `graph.rs` adds a short query per language for what that query leaves out —
# none of the six ship import captures, and TypeScript and C ship no call
# captures either.
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
# Already in the tree under hf-hub; named here so `upgrade` can use them
# directly. Neither adds a crate to the build.
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
# Reading only: `deflate-flate2` is the decompressor and nothing else. The
# default feature set adds every compressor and cipher the format allows, none
# of which semlith needs to read a document.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
# Already in the tree under zip; named here so `upgrade` can decompress the
# release archive in this process rather than through whatever `tar` is on
# PATH. `rust_backend` keeps it from linking a system zlib.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[features]
# How ONNX Runtime is linked, and the one thing that differs between the binary
# on crates.io and the Linux binaries on the release page.
#
# `static-ort` (the default) links the prebuilt library `ort` downloads from
# `cdn.pyke.io`. One file, nothing to install, and the floor it carries is
# whatever that library was built against — currently glibc 2.38, which is why
# the prebuilt Linux binary would not start on Debian 12, Ubuntu 22.04 LTS,
# RHEL 9 or Amazon Linux 2023 (issue #57).
#
# `dynamic-ort` links nothing and loads `libonnxruntime.so` from beside the
# binary at start. The Linux release jobs build with it and pack Microsoft's
# own ONNX Runtime release into the tarball, whose floor is glibc 2.27. It is
# not the default because a `cargo install semlith` built this way would have
# no runtime at all and no tarball to have got one from.
default = ["static-ort"]
static-ort = ["fastembed/ort-download-binaries-rustls-tls"]
dynamic-ort = ["fastembed/ort-load-dynamic", "dep:ort"]

[dev-dependencies]
tempfile = "3.27.0"
