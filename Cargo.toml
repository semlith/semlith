[package]
name = "semlith"
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
description = "A fast local vector store for AI agents — index files once, keep it current as you save, and answer questions across all of it in milliseconds without leaving the machine."
repository = "https://github.com/semlith/semlith"
homepage = "https://github.com/semlith/semlith"
license = "Apache-2.0"
readme = "README.md"
keywords = ["vector-search", "embeddings", "rag", "mcp", "semantic-search"]
categories = ["command-line-utilities", "database", "text-processing"]
# Workspace/planning state and local credentials are not part of the crate.
exclude = [".ultraship", ".env", ".github"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.5"
clap = { version = "4.6.4", features = ["derive"] }
hf-hub = { version = "0.5.0", default-features = false, features = ["native-tls", "ureq"] }
libc = "0.2.189"
fastembed = { version = "5.17.3", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }
ignore = "0.4.31"
pdf-extract = "0.12.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
turbovec = "0.9.0"
notify = "8.2.0"

[dev-dependencies]
tempfile = "3.27.0"
