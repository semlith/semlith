name: native-smoke

# Native runs on the three operating systems semlith ships for, on every pull
# request into develop and on demand.
#
# Nothing here uses the repository toolchain. The binary comes from the same
# installer a user runs, so what breaks here breaks for them -- which is the
# gap ci.yml leaves: `cargo test` proves the code compiles and its unit tests
# pass, never that the shipped artifact works on the machine it lands on.
#
# Three modes, picked at dispatch:
#   smoke  always: install the release, drive every command, upload the log.
#   ssh    open a tmate shell on each runner after the smoke, for poking by
#          hand. The session is tied to the dispatching user's SSH keys.
#   hunt   let Claude Code loose on the installed binary with a bug-finding
#          brief, and upload its report. Needs the ANTHROPIC_API_KEY secret.

on:
  # Every pull request into develop, which is where all work lands. A pull
  # request from develop into main carries the same commits, already checked
  # here, so running again there would cost three more runners to re-answer a
  # question this job has already answered.
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to install (empty = latest)
        default: ""
      os:
        description: Which runners
        type: choice
        default: all
        options: [all, ubuntu-latest, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
      ssh:
        description: Open an SSH shell on each runner after the smoke
        type: boolean
        default: false
      hunt:
        description: Run the Claude Code bug hunt after the smoke
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ inputs.os || 'all' }}" = all ]; then
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["${{ inputs.os }}"]' >> "$GITHUB_OUTPUT"
          fi

  smoke:
    needs: plan
    runs-on: ${{ matrix.os }}
    # Six hours is the hosted-runner ceiling; the SSH session lives inside it.
    timeout-minutes: ${{ inputs.ssh && 360 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    env:
      SEMLITH_VERSION: ${{ inputs.version }}
      SEMLITH_YES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the release the way a user does
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh install.sh
          echo "$HOME/.semlith/bin" >> "$GITHUB_PATH"

      - name: Install the release the way a user does
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1
          Add-Content $env:GITHUB_PATH (Join-Path $HOME '.semlith\bin')

      # On a pull request, the checks are about the code under review, so the
      # installed release is replaced by this branch's own build. The installer
      # still ran: PATH, the store home and the model download are its work, and
      # what changes is only which binary sits in `~/.semlith/bin`.
      #
      # Without this the harness re-measured the last published release on every
      # pull request, which is a run that cannot fail for anything in the diff --
      # and `known-failures.txt` says a fix cannot land without its row coming
      # out in the same breath, which only means anything if the fix is what ran.
      # A dispatch with a version still installs and tests that release.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: github.event_name == 'pull_request'

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: github.event_name == 'pull_request'

      - name: Build this branch and put it where the installer put its binary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cargo build --release --locked
          if [ "$RUNNER_OS" = Windows ]; then
            built=target/release/semlith.exe
            # install.ps1 wrote into PowerShell's $HOME, which is USERPROFILE.
            # cygpath turns that into the form this shell can copy to.
            target="$(cygpath -u "$USERPROFILE")/.semlith/bin/semlith.exe"
          else
            built=target/release/semlith
            target="$HOME/.semlith/bin/semlith"
          fi
          cp "$built" "$target"
          "$target" --version

      # First, and under PowerShell on every operating system. Git Bash sets
      # HOME and Windows does not, so a check that only ever runs under bash
      # cannot see what a person launching the daemon from PowerShell hits.
      # Run before the CLI smoke so the store home is still empty and the
      # portal's first-run path is the one exercised.
      - name: Portal check
        id: portal
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh -File .github/portal-check.ps1 2>&1 | Tee-Object -FilePath "portal-${{ matrix.os }}.log"
          exit $LASTEXITCODE

      - name: Smoke
        id: smoke
        continue-on-error: true
        shell: bash
        run: bash .github/smoke.sh 2>&1 | tee "smoke-${{ matrix.os }}.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: logs-${{ matrix.os }}
          path: |
            portal-${{ matrix.os }}.log
            smoke-${{ matrix.os }}.log

      # Both checks ran and both logs are uploaded; now say whether the job
      # passed. Without this the `continue-on-error` above would make a run
      # with real failures look green.
      - name: Gate
        shell: bash
        run: |
          fail=0
          [ "${{ steps.portal.outcome }}" = success ] || { echo "portal check failed"; fail=1; }
          [ "${{ steps.smoke.outcome }}" = success ] || { echo "smoke failed"; fail=1; }
          exit $fail

      - name: Bug hunt
        if: inputs.hunt && always()
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "$(cat .github/hunt-prompt.md)" \
            --allowedTools "Bash,Read,Write,Glob,Grep" \
            --max-turns 80 \
            > "hunt-${{ matrix.os }}.md"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.hunt && always()
        with:
          name: hunt-${{ matrix.os }}
          path: hunt-${{ matrix.os }}.md

      # Last, so a failed smoke still hands over a shell with the failure in
      # place. Ends when you `touch continue` (or `sudo touch /continue`),
      # or ten minutes after the last client disconnects.
      - name: SSH shell
        if: inputs.ssh && always()
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        with:
          limit-access-to-actor: true
