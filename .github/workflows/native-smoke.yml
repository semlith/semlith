name: native-smoke

# Native runs on the three operating systems semlith ships for, on every pull
# request into develop and on demand.
#
# Nothing here uses the repository toolchain. The binary comes from the same
# installer a user runs, so what breaks here breaks for them -- which is the
# gap ci.yml leaves: `cargo test` proves the code compiles and its unit tests
# pass, never that the shipped artifact works on the machine it lands on.
#
# Three modes, picked at dispatch:
#   smoke  always: install the release, drive every command, upload the log.
#   ssh    open a tmate shell on each runner after the smoke, for poking by
#          hand. The session is tied to the dispatching user's SSH keys.
#   hunt   let Claude Code loose on the installed binary with a bug-finding
#          brief, and upload its report. Needs the ANTHROPIC_API_KEY secret.

on:
  # Every pull request into develop, which is where all work lands. A pull
  # request from develop into main carries the same commits, already checked
  # here, so running again there would cost three more runners to re-answer a
  # question this job has already answered.
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to install (empty = latest)
        default: ""
      os:
        description: Which runners
        type: choice
        default: all
        options: [all, ubuntu-latest, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
      ssh:
        description: Open an SSH shell on each runner after the smoke
        type: boolean
        default: false
      hunt:
        description: Run the Claude Code bug hunt after the smoke
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ inputs.os || 'all' }}" = all ]; then
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["${{ inputs.os }}"]' >> "$GITHUB_OUTPUT"
          fi

  smoke:
    needs: plan
    runs-on: ${{ matrix.os }}
    # Six hours is the hosted-runner ceiling; the SSH session lives inside it.
    timeout-minutes: ${{ inputs.ssh && 360 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    env:
      SEMLITH_VERSION: ${{ inputs.version }}
      SEMLITH_YES: "1"
      # The install step runs the real installer, and from 0.21.0 that installs
      # the daemon as a login service and starts it. That is the feature working
      # — and it takes port 7365 before `cli/daemon/*` can bind it, so every
      # daemon check fails on a port the harness took from itself. The harness
      # installs without one and tests the service in its own block, where
      # installing a login service is the explicit subject rather than a side
      # effect of getting semlith onto the runner.
      SEMLITH_NO_SERVICE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # On a pull request the checks are about the code under review, so this
      # branch is what gets installed. Without it the harness re-measured the
      # last published release on every pull request -- a run that cannot fail
      # for anything in the diff, while `known-failures.txt` says a fix cannot
      # land without its row coming out in the same breath, which only means
      # something if the fix is what ran.
      #
      # It happens before the installer rather than after it, because the
      # installer hands off to `semlith setup`, which downloads the model *with
      # the binary it just installed*. A released binary running first is a
      # released binary writing wherever its bugs write.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: github.event_name == 'pull_request'

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: github.event_name == 'pull_request'

      - name: Install this branch the way the installer installs a release
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cargo build --release --locked
          if [ "$RUNNER_OS" = Windows ]; then
            built=target/release/semlith.exe
            # `semlith setup` writes into PowerShell's $HOME, which is
            # USERPROFILE; cygpath turns that into the form this shell copies to.
            home=$(cygpath -u "$USERPROFILE")
            name=semlith.exe
          else
            built=target/release/semlith
            home=$HOME
            name=semlith
          fi
          mkdir -p "$home/.semlith/bin"
          cp "$built" "$home/.semlith/bin/$name"
          # PATH in the Windows form, because the next step is PowerShell and a
          # `/c/users/...` entry means nothing to it -- `semlith is not on PATH`
          # is how that reads from the portal check.
          if [ "$RUNNER_OS" = Windows ]; then
            cygpath -w "$home/.semlith/bin" >> "$GITHUB_PATH"
          else
            echo "$home/.semlith/bin" >> "$GITHUB_PATH"
          fi
          "$home/.semlith/bin/$name" --version
          # The rest of what the installer does -- PATH, the model, the client
          # registration -- run by the binary under test. Explicitly without the
          # login service: `SEMLITH_NO_SERVICE` above covers it, and saying so
          # here as well means this line does not depend on a variable set
          # sixty lines away to avoid taking the port the daemon checks need.
          "$home/.semlith/bin/$name" setup --yes --no-service

      - name: Install the release the way a user does
        if: github.event_name != 'pull_request' && runner.os != 'Windows'
        shell: bash
        run: |
          sh install.sh
          # Twice. A runner is a new machine, so installing once only ever
          # tests a first install -- and the installer's hard case is the
          # second one, where the binary it is replacing is already there.
          sh install.sh
          echo "$HOME/.semlith/bin" >> "$GITHUB_PATH"

      - name: Install the release the way a user does
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1
          # Twice, and on Windows this is the one that matters: a single
          # Move-Item cannot replace an executable that is already there, so
          # every re-install failed with "Cannot create a file when that file
          # already exists" while every clean install passed.
          .\install.ps1
          Add-Content $env:GITHUB_PATH (Join-Path $HOME '.semlith\bin')

      # First, and under PowerShell on every operating system. Git Bash sets
      # HOME and Windows does not, so a check that only ever runs under bash
      # cannot see what a person launching the daemon from PowerShell hits.
      # Run before the CLI smoke so the store home is still empty and the
      # portal's first-run path is the one exercised.
      - name: Portal check
        id: portal
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh -File .github/portal-check.ps1 2>&1 | Tee-Object -FilePath "portal-${{ matrix.os }}.log"
          exit $LASTEXITCODE

      - name: Smoke
        id: smoke
        continue-on-error: true
        shell: bash
        run: bash .github/smoke.sh 2>&1 | tee "smoke-${{ matrix.os }}.log"

      # The browser drive: every reproduction the 2026-09-17 manual drive
      # recorded, replayed against a real portal in a real Chrome. The two
      # checks above reach the routes; this is the only thing that reaches the
      # page, which is where forty-seven of those sixty-two defects lived.
      #
      # Here rather than in `ci.yml` because this is the job that already has
      # a released binary, a Chrome and three operating systems. A runner image
      # ships Chrome on all three.
      - name: Browser drive
        id: drive
        continue-on-error: true
        shell: bash
        run: |
          # `python3` on a Windows runner is a stub that opens the Microsoft
          # Store, so the name is resolved rather than assumed.
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python

          # Into a virtual environment, not into the runner's Python. A macOS
          # image's system Python is externally managed (PEP 668) and refuses
          # `pip install` outright, which killed this step before the daemon
          # was ever started — and the failure read as "no portal URL".
          "$PY" -m venv drive-venv
          VPY=drive-venv/bin/python
          [ -x "$VPY" ] || VPY=drive-venv/Scripts/python
          "$VPY" -m pip install --quiet --disable-pip-version-check websocket-client
          PY="$VPY"

          # Its own store home and its own port, so this cannot collide with
          # whatever the two steps above left behind — a daemon still holding a
          # store's write lock is a daemon this one cannot start beside, and
          # the failure reads as "no portal URL" rather than as what it is.
          # Starting from an empty home is also the honest test: the drive
          # builds every corpus it asserts on.
          export SEMLITH_HOME="$PWD/drive-home"
          export SEMLITH_PORTAL_URL=http://127.0.0.1:7466
          mkdir -p "$SEMLITH_HOME"
          semlith start --port 7466 > drive-daemon.log 2>&1 &
          for _ in $(seq 1 90); do
            grep -q 'token=' drive-daemon.log && break
            sleep 1
          done
          grep -q 'token=' drive-daemon.log || {
            echo "the daemon never printed a portal URL:"; cat drive-daemon.log; exit 1;
          }
          SEMLITH_TOKEN="$(grep -o 'token=[0-9a-f]*' drive-daemon.log | head -1 | cut -d= -f2)" \
          SEMLITH_BIN="$(command -v semlith)" \
            "$PY" tests/drive/drive.py --out "drive-${{ matrix.os }}" \
              2>&1 | tee "drive-${{ matrix.os }}.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: logs-${{ matrix.os }}
          path: |
            portal-${{ matrix.os }}.log
            smoke-${{ matrix.os }}.log
            drive-${{ matrix.os }}.log
            drive-${{ matrix.os }}/
            drive-daemon.log

      # Both checks ran and both logs are uploaded; now say whether the job
      # passed. Without this the `continue-on-error` above would make a run
      # with real failures look green.
      - name: Gate
        shell: bash
        run: |
          fail=0
          [ "${{ steps.portal.outcome }}" = success ] || { echo "portal check failed"; fail=1; }
          [ "${{ steps.smoke.outcome }}" = success ] || { echo "smoke failed"; fail=1; }
          [ "${{ steps.drive.outcome }}" = success ] || { echo "browser drive failed"; fail=1; }
          exit $fail

      - name: Bug hunt
        if: inputs.hunt && always()
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "$(cat .github/hunt-prompt.md)" \
            --allowedTools "Bash,Read,Write,Glob,Grep" \
            --max-turns 80 \
            > "hunt-${{ matrix.os }}.md"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.hunt && always()
        with:
          name: hunt-${{ matrix.os }}
          path: hunt-${{ matrix.os }}.md

      # Last, so a failed smoke still hands over a shell with the failure in
      # place. Ends when you `touch continue` (or `sudo touch /continue`),
      # or ten minutes after the last client disconnects.
      - name: SSH shell
        if: inputs.ssh && always()
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        with:
          limit-access-to-actor: true
