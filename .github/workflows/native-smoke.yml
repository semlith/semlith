name: native-smoke

# Native runs on the three operating systems semlith ships for, on every pull
# request into develop and on demand.
#
# Nothing here uses the repository toolchain. The binary comes from the same
# installer a user runs, so what breaks here breaks for them -- which is the
# gap ci.yml leaves: `cargo test` proves the code compiles and its unit tests
# pass, never that the shipped artifact works on the machine it lands on.
#
# Three modes, picked at dispatch:
#   smoke  always: install the release, drive every command, upload the log.
#   ssh    open a tmate shell on each runner after the smoke, for poking by
#          hand. The session is tied to the dispatching user's SSH keys.
#   hunt   let Claude Code loose on the installed binary with a bug-finding
#          brief, and upload its report. Needs the ANTHROPIC_API_KEY secret.

on:
  # Release pull requests into develop, which is where a release lands. A pull
  # request from develop into main carries the same commits, already checked
  # here, so running again there would cost three more runners to re-answer a
  # question this job has already answered.
  #
  # The head branch is what narrows it: `feat/<version>` is a release, and a
  # dependabot bump or a one-file fix is not. Three runners and eight minutes
  # per bump bought nothing -- the installer and the shipped artifact do not
  # change because a transitive crate did. The filter is on the `plan` job
  # rather than here because `pull_request` can only filter the base branch.
  pull_request:
    branches: [develop]
    # `ready_for_review` so a draft, which skips this workflow, gets it the
    # moment it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to install (empty = latest)
        default: ""
      os:
        description: Which runners
        type: choice
        default: all
        options: [all, ubuntu-latest, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
      ssh:
        description: Open an SSH shell on each runner after the smoke
        type: boolean
        default: false
      hunt:
        description: Run the Claude Code bug hunt after the smoke
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same pull request makes the older run redundant. A
# dispatch is grouped apart, so a push never cancels an SSH session.
concurrency:
  group: native-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    # A release pull request, or a hand-dispatched run. Everything else skips
    # the whole workflow, because every job below needs this one's output.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'feat/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      os: ${{ steps.pick.outputs.os }}
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # A push that changed only prose cannot change what the shipped binary
      # does, and a draft is not yet the commit under review; see
      # .github/changes.sh. A dispatch always runs.
      - id: diff
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: native-smoke.yml
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: bash .github/changes.sh

      - id: pick
        shell: bash
        run: |
          if [ "${{ inputs.os || 'all' }}" = all ]; then
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["${{ inputs.os }}"]' >> "$GITHUB_OUTPUT"
          fi

  # On a pull request the checks are about the code under review, so this
  # branch is what gets installed. Without it the harness re-measured the last
  # published release on every pull request -- a run that cannot fail for
  # anything in the diff, while `known-failures.txt` says a fix cannot land
  # without its row coming out in the same breath, which only means something
  # if the fix is what ran.
  #
  # Built once per operating system and handed to the three check jobs below,
  # which run side by side on their own runners: one runner running all three
  # in a row took forty minutes on macOS.
  build:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.heavy == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - run: cargo build --release --locked

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semlith-${{ matrix.os }}
          path: target/release/semlith${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: 1

  # Under PowerShell on every operating system. Git Bash sets HOME and Windows
  # does not, so a check that only ever runs under bash cannot see what a
  # person launching the daemon from PowerShell hits. On its own runner, so
  # the store home is empty and the portal's first-run path is the one
  # exercised.
  portal:
    needs: [plan, build]
    if: >-
      always() && needs.plan.result == 'success' &&
      (github.event_name != 'pull_request' || (needs.plan.outputs.heavy == 'true' && needs.build.result == 'success'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    env:
      SEMLITH_VERSION: ${{ inputs.version }}
      SEMLITH_YES: "1"
      # The real installer installs the daemon as a login service and starts
      # it, which takes port 7365 before the daemon checks can bind it. The
      # harness installs without one and tests the service in its own block.
      SEMLITH_NO_SERVICE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/install-semlith
        with:
          os: ${{ matrix.os }}

      - name: Portal check
        shell: pwsh
        run: |
          pwsh -File .github/portal-check.ps1 2>&1 | Tee-Object -FilePath "portal-${{ matrix.os }}.log"
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: portal-${{ matrix.os }}
          path: portal-${{ matrix.os }}.log

  smoke:
    needs: [plan, build]
    if: >-
      always() && needs.plan.result == 'success' &&
      (github.event_name != 'pull_request' || (needs.plan.outputs.heavy == 'true' && needs.build.result == 'success'))
    runs-on: ${{ matrix.os }}
    # Six hours is the hosted-runner ceiling; the SSH session lives inside it.
    timeout-minutes: ${{ inputs.ssh && 360 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    env:
      SEMLITH_VERSION: ${{ inputs.version }}
      SEMLITH_YES: "1"
      SEMLITH_NO_SERVICE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/install-semlith
        with:
          os: ${{ matrix.os }}

      - name: Smoke
        id: smoke
        shell: bash
        run: |
          set -o pipefail
          bash .github/smoke.sh 2>&1 | tee "smoke-${{ matrix.os }}.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-${{ matrix.os }}.log

      - name: Bug hunt
        if: inputs.hunt && always()
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "$(cat .github/hunt-prompt.md)" \
            --allowedTools "Bash,Read,Write,Glob,Grep" \
            --max-turns 80 \
            > "hunt-${{ matrix.os }}.md"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.hunt && always()
        with:
          name: hunt-${{ matrix.os }}
          path: hunt-${{ matrix.os }}.md

      # Last, so a failed smoke still hands over a shell with the failure in
      # place. Ends when you `touch continue` (or `sudo touch /continue`), or
      # ten minutes after the last client disconnects.
      - name: SSH shell
        if: inputs.ssh && always()
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        with:
          limit-access-to-actor: true

  # The browser drive: every reproduction the 2026-09-17 manual drive
  # recorded, replayed against a real portal in a real Chrome. The two jobs
  # above reach the routes; this is the only thing that reaches the page,
  # which is where forty-seven of those sixty-two defects lived. A runner
  # image ships Chrome on all three operating systems.
  drive:
    needs: [plan, build]
    if: >-
      always() && needs.plan.result == 'success' &&
      (github.event_name != 'pull_request' || (needs.plan.outputs.heavy == 'true' && needs.build.result == 'success'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    env:
      SEMLITH_VERSION: ${{ inputs.version }}
      SEMLITH_YES: "1"
      SEMLITH_NO_SERVICE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/install-semlith
        with:
          os: ${{ matrix.os }}

      - name: Browser drive
        shell: bash
        run: |
          set -o pipefail
          # `python3` on a Windows runner is a stub that opens the Microsoft
          # Store, so the name is resolved rather than assumed.
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python

          # Into a virtual environment, not into the runner's Python. A macOS
          # image's system Python is externally managed (PEP 668) and refuses
          # `pip install` outright.
          "$PY" -m venv drive-venv
          VPY=drive-venv/bin/python
          [ -x "$VPY" ] || VPY=drive-venv/Scripts/python
          "$VPY" -m pip install --quiet --disable-pip-version-check websocket-client
          PY="$VPY"

          # Its own store home and its own port. Starting from an empty home is
          # the honest test: the drive builds every corpus it asserts on.
          export SEMLITH_HOME="$PWD/drive-home"
          export SEMLITH_PORTAL_URL=http://127.0.0.1:7466
          mkdir -p "$SEMLITH_HOME"
          semlith start --port 7466 > drive-daemon.log 2>&1 &
          for _ in $(seq 1 90); do
            grep -q 'token=' drive-daemon.log && break
            sleep 1
          done
          grep -q 'token=' drive-daemon.log || {
            echo "the daemon never printed a portal URL:"; cat drive-daemon.log; exit 1;
          }
          SEMLITH_TOKEN="$(grep -o 'token=[0-9a-f]*' drive-daemon.log | head -1 | cut -d= -f2)" \
          SEMLITH_BIN="$(command -v semlith)" \
            "$PY" tests/drive/drive.py --out "drive-${{ matrix.os }}" \
              2>&1 | tee "drive-${{ matrix.os }}.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: drive-${{ matrix.os }}
          path: |
            drive-${{ matrix.os }}.log
            drive-${{ matrix.os }}/
            drive-daemon.log
