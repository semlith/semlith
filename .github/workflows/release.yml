name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag is the only thing that says which version this release is, and
  # nothing else checks it against the crate. Without this a v0.2.0 tag on a
  # tree still declaring 0.1.0 would publish binaries labelled with a version
  # they were not built from.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tag matches Cargo.toml
        run: |
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $cargo_version"
          echo "tag:        $tag_version"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::tag $tag_version does not match Cargo.toml $cargo_version"
            exit 1
          fi

  build:
    needs: verify
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: a binary built on 24.04 carries a glibc 2.39
          # floor and will not start on Debian 12, Ubuntu 22.04 LTS, RHEL 9 or
          # Amazon Linux 2023 — every one of them current. 22.04 is glibc 2.35
          # and is supported until 2027. See issue #57, which this closes: the
          # prebuilt binary failed identically on three releases and nothing in
          # CI ran it on an older distribution to notice.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # No Intel macOS build: ONNX Runtime stopped publishing osx-x86_64
          # binaries, so `ort` cannot link on x86_64-apple-darwin.
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      # A binary that needs OpenSSL or OpenBLAS installed is not a binary you
      # can paste a one-liner for. Print every library the build ended up
      # needing, then fail on the three that mean a system package.
      - name: Shared libraries
        if: runner.os == 'Linux'
        run: |
          binary="target/${{ matrix.target }}/release/semlith"
          echo "NEEDED entries for $binary:"
          readelf -d "$binary" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | tee needed.txt
          if grep -Eq 'libssl|libcrypto|libopenblas' needed.txt; then
            echo "::error::the Linux binary still links a system library that has to be installed"
            exit 1
          fi

      # The guard above says which libraries are needed and nothing about which
      # *versions* of their symbols, which is exactly how the glibc floor rose
      # to 2.39 across three releases without failing a single build. This
      # asserts the floor itself.
      - name: glibc floor
        if: runner.os == 'Linux'
        run: |
          binary="target/${{ matrix.target }}/release/semlith"
          floor=$(objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -V -u | tail -1)
          cxx=$(objdump -T "$binary" | grep -o 'GLIBCXX_[0-9.]*' | sort -V -u | tail -1)
          echo "$binary requires up to $floor and $cxx"
          want="GLIBC_2.35"
          highest=$(printf '%s\n%s\n' "$floor" "$want" | sed 's/GLIBC_//' | sort -V | tail -1)
          if [ "GLIBC_$highest" != "$want" ]; then
            echo "::error::the binary requires $floor; the floor is $want (Debian 12, Ubuntu 22.04, RHEL 9)"
            exit 1
          fi

      # turbovec requires a 64-bit target; every entry above is one.
      - name: Package
        shell: bash
        run: |
          name="semlith-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/semlith.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/semlith" "dist/$name/"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Release titles drop the tag's leading "v": "Semlith 0.1.0".
      - name: Version
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The release body is this version's CHANGELOG section verbatim, so the
      # notes say what changed instead of linking to it.
      - name: Notes
        run: |
          awk -v v="${{ steps.version.outputs.number }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[[^]]*\]:/ { print }
          ' CHANGELOG.md > notes.md
          # The install text is lifted out of the README between its markers, so
          # the release notes and the page the install URL sends people to
          # cannot drift apart.
          {
            printf '\n### Install\n\n'
            awk '/<!-- install-oneliners:start -->/{on=1;next} /<!-- install-oneliners:end -->/{exit} on' README.md
            cat <<'EOF'

          Or download the archive for your platform below, unpack it, and put
          `semlith` on your `PATH`. Intel macOS has no prebuilt binary: ONNX
          Runtime no longer publishes x86_64 macOS builds.

          Verify a download against `SHA256SUMS` before running it.
          EOF
          } >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Semlith ${{ steps.version.outputs.number }}
          files: dist/*
          body_path: notes.md
