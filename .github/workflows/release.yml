name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag is the only thing that says which version this release is, and
  # nothing else checks it against the crate. Without this a v0.2.0 tag on a
  # tree still declaring 0.1.0 would publish binaries labelled with a version
  # they were not built from.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tag matches Cargo.toml
        run: |
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $cargo_version"
          echo "tag:        $tag_version"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::tag $tag_version does not match Cargo.toml $cargo_version"
            exit 1
          fi

  build:
    needs: verify
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # No Intel macOS build: ONNX Runtime stopped publishing osx-x86_64
          # binaries, so `ort` cannot link on x86_64-apple-darwin.
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # turbovec links against a system BLAS: OpenBLAS on Linux, Accelerate on
      # macOS. Accelerate ships with the OS; OpenBLAS has to be installed.
      - name: Install OpenBLAS
        if: runner.os == 'Linux'
        timeout-minutes: 5
        # The Azure apt mirror goes unreachable and the archive.ubuntu.com
        # fallback then stalls mid-transfer with no output, so bound every
        # fetch and retry rather than waiting on a dead socket. The lock
        # timeout covers the runner's unattended-upgrades holding dpkg.
        run: |
          opts='-o Acquire::Retries=3
                -o Acquire::http::Timeout=20
                -o Acquire::https::Timeout=20
                -o DPkg::Lock::Timeout=120'
          for attempt in 1 2 3; do
            sudo apt-get $opts update \
              && sudo apt-get $opts install -y libopenblas-dev \
              && exit 0
            echo "apt attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      # turbovec requires a 64-bit target; every entry above is one.
      - name: Package
        shell: bash
        run: |
          name="semlith-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/semlith.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/semlith" "dist/$name/"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Release titles drop the tag's leading "v": "Semlith 0.1.0".
      - name: Version
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The release body is this version's CHANGELOG section verbatim, so the
      # notes say what changed instead of linking to it.
      - name: Notes
        run: |
          awk -v v="${{ steps.version.outputs.number }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[[^]]*\]:/ { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Install

          Download the archive for your platform, unpack it, and put `semlith` on
          your `PATH`. Linux builds need OpenBLAS at runtime
          (`apt-get install libopenblas-dev` or your distribution's equivalent).
          Intel macOS has no prebuilt binary: ONNX Runtime no longer publishes
          x86_64 macOS builds.

          Verify a download against `SHA256SUMS` before running it.
          EOF
          cat notes.md

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: Semlith ${{ steps.version.outputs.number }}
          files: dist/*
          body_path: notes.md
