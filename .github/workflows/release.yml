name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # true runs only the `publish` job below, against the tag dispatched on.
      publish:
        description: Publish the dispatched tag to crates.io (and nothing else)
        type: boolean
        default: false

# Nothing, by default. Every job below gets exactly what it needs, which for
# all but one of them is nothing at all: a workflow-level `contents: write` is
# a token with push rights handed to the build jobs, which download a
# dependency tree and run a compiler over it.
permissions: {}

jobs:
  # A tag is the only thing that says which version this release is, and
  # nothing else checks it against the crate. Without this a v0.2.0 tag on a
  # tree still declaring 0.1.0 would publish binaries labelled with a version
  # they were not built from.
  # Skipped on a publish dispatch, and with it `build` and `release`, which
  # need it: publishing a crate must not rebuild or re-release the tag.
  # Only a tag: a dispatch on a branch named like a version would otherwise
  # build, sign and attest something no tag names (SEC-007, 2026-10-23 audit).
  verify:
    if: ${{ !inputs.publish && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # A tag is cut from main, and main takes only reviewed pull requests from
      # develop. Without this, anyone who could push a branch and a tag had a
      # signed Latest release (SEC-001); creating v* tags is also limited to org
      # admins by the tag-creation ruleset.
      - name: Tag is on main
        run: bash .github/verify-tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" origin/main
      - name: Tag matches Cargo.toml
        run: |
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $cargo_version"
          echo "tag:        $tag_version"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::tag $tag_version does not match Cargo.toml $cargo_version"
            exit 1
          fi

  build:
    needs: verify
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux targets build with `dynamic-ort` and ship Microsoft's own
          # ONNX Runtime beside the binary, which is how issue #57 is closed.
          #
          # The floor was never the runner's to choose: 0.13.0 tried 22.04 and
          # the link failed, because the prebuilt ONNX Runtime `ort` downloads
          # references `__isoc23_strtol` and
          # `std::__cxx11::basic_string<wchar_t>::_M_replace_cold` — glibc 2.38
          # and a newer libstdc++. A linker cannot satisfy a reference to a
          # symbol version the target libc does not have, so no older runner and
          # no older container could have helped. What could, and does, is not
          # linking that library at all: `dynamic-ort` links nothing and loads
          # `libonnxruntime.so` from beside the binary, and Microsoft's release
          # of the same library needs only glibc 2.27.
          #
          # And the runner has to be the old one. Not linking ONNX Runtime is
          # what makes 22.04 *possible* — that is why 0.13.0's attempt failed to
          # link — but it is the runner that decides the floor: a Rust binary
          # references whatever symbol versions the glibc it was built against
          # provides, so one built on 24.04 needs 2.39 whatever else it links.
          # The first run of this job with `dynamic-ort` proved exactly that:
          # GLIBCXX fell from 3.4.32 to 3.4.22, which is Microsoft's library,
          # and GLIBC stayed at 2.39, which was the binary. 22.04 is glibc 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            runtime: onnxruntime-linux-x64-1.24.4
            runtime_sha: 3a211fbea252c1e66290658f1b735b772056149f28321e71c308942cdb54b747
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            runtime: onnxruntime-linux-aarch64-1.24.4
            runtime_sha: 866109a9248d057671a039b9d725be4bd86888e3754140e6701ec621be9d4d7e
          - os: macos-latest
            target: aarch64-apple-darwin
          # No Intel macOS build: ONNX Runtime stopped publishing osx-x86_64
          # binaries, so `ort` cannot link on x86_64-apple-darwin.
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      # No build cache, and --locked: what ships is built from Cargo.lock as
      # reviewed, never from a cache another run could have written (SEC-007).

      # The one thing that differs between these binaries and the one on
      # crates.io. Linux links nothing and loads the library packed beside it;
      # macOS and Windows link what `ort` downloads, as they always have — the
      # floor is not a problem on either.
      - name: Build
        run: |
          if [ -n "${{ matrix.runtime }}" ]; then
            cargo build --release --locked --target ${{ matrix.target }} \
              --no-default-features --features dynamic-ort
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
        shell: bash

      # Microsoft's own release of ONNX Runtime, verified against the checksum
      # GitHub publishes with it. This is the library the binary loads at start,
      # so it is fetched by digest rather than by name.
      - name: ONNX Runtime
        if: matrix.runtime != ''
        run: |
          url="https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/${{ matrix.runtime }}.tgz"
          curl -fsSL -o runtime.tgz "$url"
          echo "${{ matrix.runtime_sha }}  runtime.tgz" | sha256sum -c -
          tar xzf runtime.tgz
          mkdir -p runtime
          cp "${{ matrix.runtime }}/lib/libonnxruntime.so"* runtime/
          # The loader opens `libonnxruntime.so`; the release carries it as
          # `libonnxruntime.so.1.24.4` with that name as a symlink, and a
          # symlink does not survive a tarball the way a file does.
          if [ ! -f runtime/libonnxruntime.so ] || [ -L runtime/libonnxruntime.so ]; then
            rm -f runtime/libonnxruntime.so
            cp "${{ matrix.runtime }}/lib/libonnxruntime.so.1.24.4" runtime/libonnxruntime.so
          fi
          ls -l runtime/

      # A binary that needs OpenSSL or OpenBLAS installed is not a binary you
      # can paste a one-liner for. Print every library the build ended up
      # needing, then fail on the three that mean a system package.
      - name: Shared libraries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/semlith"
          echo "NEEDED entries for $binary:"
          readelf -d "$binary" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | tee needed.txt
          # No output is a readelf that failed, not a binary that needs nothing.
          if [ ! -s needed.txt ]; then
            echo "::error::readelf listed no NEEDED entries for $binary"
            exit 1
          fi
          if grep -Eq 'libssl|libcrypto|libopenblas' needed.txt; then
            echo "::error::the Linux binary still links a system library that has to be installed"
            exit 1
          fi

      # The guard above says which libraries are needed and nothing about which
      # *versions* of their symbols, which is how the glibc floor rose across
      # three releases without failing a single build. This prints the floor
      # into the build log and writes it into the release notes, so it is a
      # number somebody can read rather than a surprise on someone's server.
      # It does not fail the build: the floor is the vendored ONNX Runtime's,
      # and failing here would only stop us shipping the binary that is the
      # best we can currently build. See issue #57.
      # Asserted over the pair that ships, not over the binary alone: what a
      # user runs is `semlith` plus the library beside it, and the floor is
      # whichever of the two needs more. It failed to be a number anybody
      # checked for three releases, which is how it rose to 2.39 without
      # failing a build — so this one exits non-zero.
      - name: glibc floor
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/semlith"
          floor=$(objdump -T "$binary" runtime/libonnxruntime.so \
            | grep -o 'GLIBC_[0-9.]*' | sort -V -u | tail -1)
          cxx=$(objdump -T "$binary" runtime/libonnxruntime.so \
            | grep -o 'GLIBCXX_[0-9.]*' | sort -V -u | tail -1)
          # An empty floor sorts below 2.35 and would pass the check below.
          if [ -z "$floor" ] || [ -z "$cxx" ]; then
            echo "::error::objdump found no GLIBC or GLIBCXX symbol versions; the floor cannot be checked"
            exit 1
          fi
          echo "the packaged pair requires up to $floor and $cxx"
          echo "::notice::${{ matrix.target }} requires $floor and $cxx"
          echo "GLIBC_FLOOR=$floor" >> "$GITHUB_ENV"
          # Debian 12 is glibc 2.36 and Ubuntu 22.04 LTS is 2.35, which is the
          # floor issue #57 is about. Anything above it is a release that does
          # not start on a mainstream current distribution.
          highest=$(printf '%s\n' "$floor" "GLIBC_2.35" | sort -V | tail -1)
          if [ "$highest" != "GLIBC_2.35" ]; then
            echo "::error::the packaged Linux binary requires $floor; the ceiling is GLIBC_2.35 (see issue #57)"
            exit 1
          fi

      # turbovec requires a 64-bit target; every entry above is one.
      - name: Package
        shell: bash
        run: |
          name="semlith-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/semlith.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/semlith" "dist/$name/"
          fi
          # Beside the binary, because that is where it is loaded from.
          if [ -d runtime ]; then
            cp runtime/libonnxruntime.so "dist/$name/"
          fi
          # THIRD-PARTY-NOTICES is an obligation of the grammar licences the
          # binary links, so it travels with the binary rather than only with
          # the source.
          cp README.md LICENSE CHANGELOG.md THIRD-PARTY-NOTICES "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  # Three jobs where there was one, so each holds only what it needs
  # (SEC-001, SEC-007): `sign` has the signing key, through the `release`
  # environment that only v* tags can deploy to, and no write token; `attest`
  # has the OIDC token and nothing else; `release` can write the Release and
  # runs the one third-party action, with neither the key nor the OIDC token.
  sign:
    needs: [verify, build]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      # The installers ride along as assets of the release they shipped with, so
      # "download it, read it, run it" has a fixed, attested copy to download
      # rather than whatever `main` holds today.
      - name: Installers
        run: cp install.sh install.ps1 dist/

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # The checksums prove only that the files were uploaded together; anyone
      # who can replace release assets can replace SHA256SUMS too. The
      # signature ties them to the project key, which lives in this secret and
      # nowhere a GitHub token reaches. `semlith upgrade` verifies
      # SHA256SUMS.sig against the key compiled into it and both installers
      # with `ssh-keygen -Y verify`, all failing closed, so a release without
      # signatures could not be installed or upgraded to: no secret, no release.
      # The secret is an unencrypted OpenSSH ed25519 private key (a passphrase
      # would wait for a terminal that is not there).
      - name: Sign
        env:
          SEMLITH_SIGNING_KEY: ${{ secrets.SEMLITH_SIGNING_KEY }}
        run: |
          if [ -z "$SEMLITH_SIGNING_KEY" ]; then
            echo "::error::the SEMLITH_SIGNING_KEY secret is not set; an unsigned release cannot be installed or upgraded to"
            exit 1
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$SEMLITH_SIGNING_KEY" > "$key"
          cd dist
          for file in SHA256SUMS *.tar.gz *.zip; do
            ssh-keygen -Y sign -f "$key" -n file "$file"
          done
          # Verified against the keys the installers ship, so a secret holding
          # the wrong key fails this job rather than every user's install.
          grep -o "ssh-ed25519 [A-Za-z0-9+/=]*" ../install.sh \
            | sed 's/^/semlith-release /' > "$RUNNER_TEMP/allowed_signers"
          for file in SHA256SUMS *.tar.gz *.zip; do
            ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I semlith-release \
              -n file -s "$file.sig" < "$file"
          done
          ls -l ./*.sig

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed
          path: dist/*
          if-no-files-found: error

  # Every file the release publishes: the archives, SHA256SUMS, their
  # signatures and both installers. `gh attestation verify <file> --repo
  # semlith/semlith --signer-workflow semlith/semlith/.github/workflows/release.yml`
  # checks any of them, and the installers do exactly that for the archive.
  # `id-token` is the OIDC token the signature is issued against;
  # `attestations` stores it.
  attest:
    needs: sign
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  # The one job that writes: it creates the Release and uploads the assets.
  release:
    needs: attest
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed
          path: dist

      # Release titles drop the tag's leading "v": "Semlith 0.1.0".
      - name: Version
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The release body is this version's CHANGELOG section verbatim, so the
      # notes say what changed instead of linking to it.
      # The version comes from the tag name, so it reaches the shell as an
      # environment variable, never pasted into the script text.
      - name: Notes
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[[^]]*\]:/ { print }
          ' CHANGELOG.md > notes.md
          # The install text is lifted out of the README between its markers, so
          # the release notes and the page the install URL sends people to
          # cannot drift apart.
          {
            printf '\n### Install\n\n'
            awk '/<!-- install-oneliners:start -->/{on=1;next} /<!-- install-oneliners:end -->/{exit} on' README.md
            cat <<'EOF'

          Or download the archive for your platform below, unpack it, and put
          `semlith` on your `PATH`. Intel macOS has no prebuilt binary: ONNX
          Runtime no longer publishes x86_64 macOS builds.

          Verify a download against `SHA256SUMS` before running it, `SHA256SUMS`
          against its signature (release key
          `SHA256:a5oJmrakIwDHEWTDWqWe51Ttt6m2tQ0dsGzIqyxDuxs`) with
          `echo "semlith-release ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICMTHiHMzeSHzzc+8UDZHUzJcvb6XGUBb+TJdFes91xm" > allowed_signers`
          and `ssh-keygen -Y verify -f allowed_signers -I semlith-release -n file -s SHA256SUMS.sig < SHA256SUMS`,
          and its provenance with `gh attestation verify <file> --repo semlith/semlith --signer-workflow semlith/semlith/.github/workflows/release.yml`.
          EOF
          } >> notes.md
          cat notes.md

      # Latest only for the highest version released, so a patch cut for an
      # older line, or a re-run of an old tag, never moves the `latest` link
      # that both installers resolve (SEC-007).
      - name: Latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          highest=$( { gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 200 \
            --json tagName --jq '.[].tagName'; echo "$GITHUB_REF_NAME"; } | sort -V | tail -1)
          if [ "$highest" = "$GITHUB_REF_NAME" ] && [ "${GITHUB_REF_NAME#*-}" = "$GITHUB_REF_NAME" ]; then
            echo "make=true" >> "$GITHUB_OUTPUT"
          else
            echo "make=false" >> "$GITHUB_OUTPUT"
          fi
          echo "highest released: $highest"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Semlith ${{ steps.version.outputs.number }}
          files: dist/*
          body_path: notes.md
          # A tag with a suffix (v0.37.0-rc.1) is a release candidate.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ steps.latest.outputs.make }}

  # crates.io by Trusted Publishing: no long-lived API token anywhere, only a
  # short-lived one crates.io issues against this workflow's OIDC identity, in
  # the `crates-io` environment. Never on a tag push. The release owner runs it
  # by hand once the clean-install workflow has passed on the published release:
  # `gh workflow run release.yml --ref v<version> -f publish=true`.
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
