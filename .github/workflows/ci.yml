name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to the same ref makes the older run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # turbovec links against a system BLAS: OpenBLAS on Linux, Accelerate on
      # macOS. Accelerate ships with the OS; OpenBLAS has to be installed.
      - name: Install OpenBLAS
        if: runner.os == 'Linux'
        # DPkg::Lock::Timeout stops apt waiting forever when the runner's
        # unattended-upgrades still holds the dpkg lock; fail fast instead.
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y libopenblas-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --all-targets -- -D warnings

      # The default test set is offline. The round-trip test downloads an
      # embedding model, so it is opt-in via `-- --ignored`.
      - run: cargo test

      - run: cargo build --release
