name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to the same ref makes the older run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows binaries have shipped since 0.1.0 and nothing on a pull
        # request ever compiled them: the tag build was the first and only
        # place Windows code was touched, and it only compiled, never tested.
        # 0.10.0 ships a Windows installer, so Windows joins the matrix.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --all-targets -- -D warnings

      # The default test set is offline. The round-trip test downloads an
      # embedding model, so it is opt-in via `-- --ignored`.
      - run: cargo test

      - run: cargo build --release

  # The minimum Rust version the crate declares, built. `rust-version` in
  # Cargo.toml is a promise to anybody on an older toolchain, and nothing ever
  # checked it: every leg above is stable, so the declared floor could have
  # stopped compiling releases ago and the first person to find out would have
  # been somebody whose `cargo install` failed.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: The version Cargo.toml declares
        id: floor
        run: |
          version=$(grep -m1 '^rust-version = ' Cargo.toml | cut -d'"' -f2)
          echo "Cargo.toml declares rust-version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.floor.outputs.version }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: msrv

      # Built, not tested: the promise is that the crate compiles on the
      # declared floor. Running the suite there as well would double the
      # slowest leg to re-prove what stable already proved.
      - run: cargo build --all-targets --locked

  # The install scripts are the front door and nothing else compiles them, so
  # the linters are the only thing standing between a typo and a broken paste.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: shellcheck
        run: shellcheck install.sh

      # The scripts are pasted into a shell by people who have not read them, so
      # they stay short enough to read. Raised from 170 in 0.14.0, when
      # install.sh took on placing the ONNX Runtime that ships beside the
      # binary — a real second responsibility rather than a few more lines.
      - name: Line budget
        run: |
          for f in install.sh install.ps1; do
            lines=$(wc -l < "$f")
            echo "$f: $lines lines"
            if [ "$lines" -ge 185 ]; then
              echo "::error::$f is $lines lines; the budget is under 185"
              exit 1
            fi
          done

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $found = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error
          $found | Format-Table -AutoSize
          if ($found) { throw "PSScriptAnalyzer reported $($found.Count) finding(s)" }

  # 0.28.0 item 1.17: every GPU claim checked somewhere real. The macOS arm64
  # runner exposes a Metal device, so the WebGPU lane is run there for
  # correctness -- the known-answer check, cosine against the committed fp32
  # fixture -- on every pull request. Linux and Windows runners have no
  # hardware GPU, so there the same command must say so and fall back, and
  # must never abort: Linux with Mesa's lavapipe forced as the only Vulkan
  # device, Windows with only the Basic Render Driver (WARP) it already has.
  gpu:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - run: cargo build --release

      - name: A software Vulkan device, and nothing else
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 vulkan-tools
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"

      - name: doctor --gpu
        shell: bash
        run: |
          set -o pipefail
          target/release/semlith doctor --gpu --json | tee gpu.json
          gpu=$(jq -c '.[] | select(.lane == "gpu")' gpu.json)
          echo "gpu lane: $gpu"
          if [ "$RUNNER_OS" = macOS ]; then
            # Real Metal: the lane must run and match the fixture.
            echo "$gpu" | jq -e '.passed == true and .cosine >= 0.999' > /dev/null
          else
            # No hardware GPU: named as unavailable, nothing downloaded.
            echo "$gpu" | jq -e '.reason | startswith("unavailable")' > /dev/null
            cache="${SEMLITH_MODEL_CACHE:-$HOME/.cache/semlith/models}"
            if [ -d "$cache/accel" ] && find "$cache/accel" -type f | grep -q .; then
              echo "::error::a machine with no hardware GPU downloaded GPU components"
              find "$cache/accel" -type f
              exit 1
            fi
          fi

  # Item 1.14 without a card: the pinned CUDA pack downloads, every digest
  # verifies, the lane loads it, and says there is no NVIDIA device. Linux
  # only in this release; the Windows leg checks the refusal says why.
  cuda:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: The pack, fetched and loaded on a machine with no card
        if: runner.os == 'Linux'
        run: |
          df -h .
          cargo test --release --no-default-features --features dynamic-ort --test cuda -- --ignored --nocapture

      - name: Turning CUDA on is refused with the reason
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release
          if target/release/semlith accel on cuda 2> out.txt; then
            echo "::error::CUDA was turned on on Windows"; exit 1
          fi
          cat out.txt
          grep -q "Linux-only" out.txt

  # The --release suites: measured claims and the retrieval harness. Hours on
  # the reference laptop, so a release pull request's CI is their gate, and
  # the record says so. Only on release branches. macOS arm64, because that is
  # the platform the thresholds were set on and `measure.rs` reads peak memory
  # with BSD `time -l`.
  release-suites:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'feat/')
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: shards
        run: cargo test --release --test shards -- --ignored --nocapture --test-threads=1

      - name: measure
        run: cargo test --release --test measure -- --ignored --nocapture --test-threads=1

      - name: retrieval
        run: cargo test --release --test retrieval -- --ignored --nocapture --test-threads=1

  # Item 1.16: a store embedded by the CPU and a GPU together holds int8 and
  # fp16 vectors of one model, which agree at cosine 0.987. Before hybrid ships
  # as the default the sealed split is scored four ways, median of three, on
  # the CPU alone so each leg is reproducible: all int8, all fp16, a
  # deterministic 50/50 mix, and the mix searched with fp16 queries. Mixing is
  # allowed if the mix is within one question of all-int8 at every k.
  mixed-vectors:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'feat/')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: int8
            embed: int8
            query: int8
          - leg: fp16
            embed: fp16
            query: fp16
          - leg: mix
            embed: mix
            query: int8
          - leg: mix-fp16-queries
            embed: mix
            query: fp16
    env:
      SEMLITH_RETRIEVAL_SEALED: "1"
      SEMLITH_RETRIEVAL_RUNS: "3"
      SEMLITH_EMBED_VARIANT: ${{ matrix.embed }}
      SEMLITH_QUERY_VARIANT: ${{ matrix.query }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: sealed split, ${{ matrix.leg }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --test retrieval -- --ignored --nocapture --test-threads=1 \
            the_retrieval_metrics_are_measured 2>&1 | tee harness.log
          {
            echo "### ${{ matrix.leg }}"
            echo '```'
            grep -A6 "sealed, median of the runs" harness.log || true
            grep "run [0-9]/" harness.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
