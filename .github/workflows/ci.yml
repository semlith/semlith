name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to the same ref makes the older run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # turbovec links against a system BLAS: OpenBLAS on Linux, Accelerate on
      # macOS. Accelerate ships with the OS; OpenBLAS has to be installed.
      - name: Install OpenBLAS
        if: runner.os == 'Linux'
        timeout-minutes: 5
        # The Azure apt mirror goes unreachable and the archive.ubuntu.com
        # fallback then stalls mid-transfer with no output, so bound every
        # fetch and retry rather than waiting on a dead socket. The lock
        # timeout covers the runner's unattended-upgrades holding dpkg.
        run: |
          opts='-o Acquire::Retries=3
                -o Acquire::http::Timeout=20
                -o Acquire::https::Timeout=20
                -o DPkg::Lock::Timeout=120'
          for attempt in 1 2 3; do
            sudo apt-get $opts update \
              && sudo apt-get $opts install -y libopenblas-dev \
              && exit 0
            echo "apt attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --all-targets -- -D warnings

      # The default test set is offline. The round-trip test downloads an
      # embedding model, so it is opt-in via `-- --ignored`.
      - run: cargo test

      - run: cargo build --release
