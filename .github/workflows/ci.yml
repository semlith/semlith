name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to the same ref makes the older run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --all-targets -- -D warnings

      # The default test set is offline. The round-trip test downloads an
      # embedding model, so it is opt-in via `-- --ignored`.
      - run: cargo test

      - run: cargo build --release

  # The install scripts are the front door and nothing else compiles them, so
  # the linters are the only thing standing between a typo and a broken paste.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: shellcheck
        run: shellcheck install.sh

      - name: Line budget
        run: |
          for f in install.sh install.ps1; do
            lines=$(wc -l < "$f")
            echo "$f: $lines lines"
            if [ "$lines" -ge 120 ]; then
              echo "::error::$f is $lines lines; the budget is under 120"
              exit 1
            fi
          done

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $found = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error
          $found | Format-Table -AutoSize
          if ($found) { throw "PSScriptAnalyzer reported $($found.Count) finding(s)" }
