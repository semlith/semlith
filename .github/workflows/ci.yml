name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # turbovec links against a system BLAS: OpenBLAS on Linux, Accelerate on
      # macOS. Accelerate ships with the OS; OpenBLAS has to be installed.
      - name: Install OpenBLAS
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --all-targets -- -D warnings

      # The default test set is offline. The round-trip test downloads an
      # embedding model, so it is opt-in via `-- --ignored`.
      - run: cargo test

      - run: cargo build --release
