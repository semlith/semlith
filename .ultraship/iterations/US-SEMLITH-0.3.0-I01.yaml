id: US-SEMLITH-0.3.0-I01
timestamp: 2026-07-29T21:15:00Z
category:
  - release-level
  - resource-level
trigger: >
  The contract required 0.3.0's unfiltered search latency to be re-measured on a
  100k-chunk store against 0.2.0. Building that store costs over an hour of
  embedding, which is disproportionate for a release that changes no indexing
  and no scan code, and the user stopped the run.
evidence:
  - >
    The corpus build ran for 2h20m and reached 122648 chunks without finishing;
    projection from the observed 1757 chunks/MB put the final figure near
    150000 with roughly 20 minutes still to go. It was stopped by the user
    before index.tv was written, so that store is not searchable.
  - >
    The original sizing was wrong by about 1.5x: it counted only .rs, .md,
    .toml, .txt, .h and .c, while semlith indexes every non-binary file under
    8 MB. spdx alone contributed 688 license-text files.
  - >
    The A/B that was run instead is noise-dominated on this machine. Across
    three alternating rounds on a 218-chunk store, 0.2.0 measured p50 21.41,
    23.53 and 22.47 ms while 0.3.0 measured 27.61, 24.86 and 11.08 ms — a
    spread far wider than any difference being looked for. Spotlight was
    reindexing the newly written files at over 140 percent CPU, load average
    11.8. On a quieter 187-chunk store the same harness measured 5.33 ms for
    0.2.0 and 5.26 ms for 0.3.0.
  - >
    Every one of those six runs returned an identical MRR to four decimal
    places (0.8465 on one store, 0.9750 on the other), so the two versions
    return the same results for the same queries.
  - >
    The README's 105k-chunk figures are 0.2.0's own measurement on a corpus
    that does not exist on this machine. They cannot demonstrate anything about
    0.3.0, so citing them would not have satisfied the criterion either.
before:
  scope:
    - >
      NF1: an unfiltered search on a 100k-chunk store is no slower than 0.2.0
      on the same store and machine, within 10 percent.
  assumptions:
    - >
      A 100k-chunk corpus could be rebuilt cheaply enough to re-measure per
      release.
  implementation: >
    Rebuild the benchmark corpus from the local cargo registry, then time both
    binaries against it over MCP.
change:
  summary: >
    Replace the 100k timing criterion with a deterministic proof that the
    unfiltered path is unchanged, plus the observation that both versions
    return identical results. Record that 100k was not re-measured as a known
    limitation rather than implying it was.
  added:
    - >
      A test pinning the unfiltered keyword statement to the 0.2.0 text
      verbatim, so folding the two branches together fails the build.
  removed:
    - >
      The requirement to build a 100k-chunk corpus in order to release 0.3.0.
  deferred: []
  replaced:
    - >
      NF1's timing comparison, replaced by structural equivalence of the
      unfiltered path plus identical-results evidence.
    - >
      NF2 and NF3 pointed at "the recorded benchmark corpus" and "the recorded
      evaluation set", both of which meant the 100k store that was never
      finished. They now name the acceptance fixture and a sample of
      self-labelled queries, which is what was actually measured against.
impact:
  products:
    - semlith
  versions:
    - 0.3.0
  tasks:
    - US-SEMLITH-0.3.0-T06
  dependencies: []
  resource_effect: >
    Removes over an hour of embedding from this release and from every future
    release that does not change the indexing or scan path. The README's
    performance table is untouched and stays attributed to 0.2.0.
versioning:
  previous_target: 0.3.0
  new_target: 0.3.0
  consequence: no-version-change
approval:
  source: user
  reference: >
    Asked whether to rebuild the corpus, measure at a smaller size, or rest on
    the code argument; the user chose no new indexing, then reaffirmed
    ("just use 100k", "its overkill") when told the published figures cannot
    stand in for a 0.3.0 measurement.
canonical_updates:
  - products/semlith/releases/0.3.0.yaml
  - products/semlith/execution/tasks.yaml
