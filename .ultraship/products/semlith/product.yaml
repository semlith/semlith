id: semlith
name: semlith
classification: independent-product

vision: >
  A coding agent answers questions about a codebase from the handful of
  excerpts that matter, without the code ever leaving the machine.

users:
  - A developer running a coding agent (Claude Code, Cursor) against their own
    repositories and notes on their own workstation.

problems:
  - An agent reads whole files to find a few relevant lines, burning context.
  - grep finds exact strings but not meaning; dense search finds meaning but
    misses exact identifiers.
  - Hosted vector databases mean API keys, network calls, and shipping private
    code to a third party.
  - A first index of a large repository is a long, silent, unpredictable wait.
  - Indexing peaks around 1.7 GB, uncomfortable on an 8 GB machine.
  - Two concurrent index runs fight over index.tv with no protection.

outcomes:
  - An agent gets ranked excerpts with file:line locators instead of whole files.
  - Nothing is sent anywhere; no API key exists to leak.
  - Exact identifiers and plain-English questions both land on the right chunk.
  - Indexing time and memory are predictable before the run starts.
  - Installation is one cargo install from crates.io.

requirements:
  - Chunk files (text, code, PDF) and embed them locally via ONNX Runtime.
  - Store vectors in a quantized turbovec index beside a SQLite database.
  - Re-index incrementally, touching only files whose contents changed.
  - Serve search over a CLI and over MCP (semlith_search, semlith_stats).
  - Default new stores to granite-embedding-small-english-r2 int8.
  - Fuse SQLite FTS5 keyword ranking with vector ranking on every search, with
    no flag to enable it.
  - Hold an advisory lock per store; a second writer exits non-zero naming the
    holder and never corrupts the store.
  - Keep peak indexing memory flat as corpus size grows.
  - Size the ONNX Runtime intra-op thread pool to the machine's performance
    cores, with a SEMLITH_EMBED_THREADS override.
  - Run CI on pushes to main and develop, and on every pull request.
  - Fail a release build when the git tag disagrees with the Cargo.toml version.
  - Ship each release to crates.io by a deliberate manual step.

constraints:
  - Local only. No network at query time, no API keys.
  - Single machine, single user, one writer per store.
  - fastembed/ONNX Runtime offers only Cls and Mean pooling; last-token-pooled
    models are impossible.
  - ONNX Runtime synchronises threads per operator, so on heterogeneous CPUs a
    thread on an efficiency core paces the whole batch. Outer batch parallelism
    measured 2-4.6x slower than serial and is rejected.
  - The default model's weights must be permissively licensed; the project is
    Apache-2.0.
  - crates.io forbids git and path dependencies, and publishes are permanent.
  - 64-bit only. Intel macOS unsupported (no x86_64 macOS ONNX Runtime builds).
  - Rust 1.85+, edition 2024.

public_contract: >
  The semlith CLI, the MCP stdio server and its two tools, and the on-disk
  store layout (.semlith/store.db + index.tv). Since 0.1.0 is on crates.io the
  src/lib.rs Rust API is also public, though unstable before 1.0.

deployment_context: >
  A developer workstation. Installed by the user via cargo install or a
  prebuilt binary, operated by the user, no server component.

success_measures:
  - cargo install semlith succeeds from crates.io on a clean machine.
  - Searching an exact identifier returns its defining chunk in the top 3.
  - "Two concurrent index runs: the second exits non-zero with a lock error and
    the store remains valid afterwards."
  - Peak RSS during indexing stays flat across 1k, 10k and 100k chunk corpora.
  - Indexing reaches at least 16 chunks/s on the M1 benchmark corpus, up from
    13.9 at the ONNX Runtime default.
  - Default model beats bge-small on the benchmark's code retrieval set.

non_goals:
  - Multi-user or server deployment.
  - Cloud or API-based embeddings.
  - Concurrent writers to a single store.
  - Outer parallelism across embedding batches.
  - Publishing to crates.io from CI.
  - Cross-encoder reranking.
  - GPU acceleration.
  - Automatic migration of existing stores to a new model.
  - A dedicated reindex command.
  - Intel macOS support.
  - A separate code-specialist embedding model.

assumptions:
  - granite int8's 1.23-point code MRR deficit against fp32 is acceptable. The
    paired bootstrap that would confirm the gap is real was stopped before
    completing, by decision.
  - fastembed's external_initializers API loads granite's .onnx_data correctly.
    The API exists at init.rs:94 but semlith has never exercised it. This is the
    largest unverified risk in the release.
  - Benchmark evidence came from an 82 percent Rust corpus; the code-retrieval
    gain may not transfer equally to other languages.
  - The performance-core thread heuristic is measured on one machine, a 4P+4E
    Apple M1.

mvp_boundary: >
  A developer installs semlith with cargo install, indexes one repository in a
  single run with bounded memory, and then finds both an exact identifier and a
  plain-English question in that same store.
