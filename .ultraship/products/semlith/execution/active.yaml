product: semlith
version: 0.6.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - >
      No time, budget or capacity constraint has been recorded for this release,
      so the assessment is grounded in the contract's own recorded constraints
      rather than in a user estimate. Nothing here is measured.
    - >
      The recorded constraint "stdout is the protocol" is already honoured by the
      existing server: diagnostics go to stderr and `Fleet.quiet` is set before
      the first message. The protocol work adds methods to a loop that already
      obeys the rule rather than changing how it writes.
    - >
      The recorded constraint "one writer per store" has an implementation
      already — `StoreLock`, acquired inside `index_paths` and released on drop.
      The write tools take the lock the same way every existing writer does, so
      the risk is in where the lock is taken from, not in inventing locking.
    - >
      Every agent-facing claim in the last four releases was proven by driving a
      real `semlith mcp` child process over stdio from a test. That harness
      exists in tests/fleet.rs and tests/watch.rs and is what the protocol
      criteria need; no new kind of test infrastructure is required.
    - >
      The store change is one additive meta key beside three that already exist,
      which is the smallest kind of format change there is.
  major_cost_drivers:
    - >
      Two protocol eras decided per message rather than per connection. The
      legacy path starts with `initialize`; the modern path has no handshake and
      carries its version in `_meta`. This is new design, not new plumbing.
    - >
      Bounding an index run by wall clock and resuming it cleanly. Stopping
      mid-loop must leave SQLite and index.tv agreeing, which is the exact
      failure the store lock exists to prevent.
    - >
      Conformance evidence for revisions no installed client can exercise. The
      recorded constraint that this is a local, single-machine product means
      there is no client fleet to test against; hand-written stdio sessions read
      from the specification are the whole of the evidence.
    - >
      Nine client configuration stanzas whose correctness cannot be observed
      from inside CI, only parsed and executed.
  recommended_scope_change: null
