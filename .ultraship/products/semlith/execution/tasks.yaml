product: semlith
version: 0.6.0
tasks:
  - id: US-SEMLITH-0.6.0-T01
    summary: >
      Negotiate the protocol version against a real list of revisions the server
      implements, instead of echoing back whatever the client asked for.
    why_required: >
      The server currently tells every client it speaks that client's revision.
      Every other claim in this release is worth nothing while the first message
      of every session is a lie.
    status: todo
    depends_on: []
    acceptance_criteria:
      - >
        One recorded stdio session per advertised legacy revision — `2025-11-25`,
        `2025-06-18`, `2024-11-05` — against a real `semlith mcp` child process:
        `initialize` is answered with that same version, `tools/list` returns the
        five tools, and a `semlith_search` call returns excerpts.
      - >
        `initialize` naming a revision the server does not implement — a bare
        `1900-01-01` and a plausible future date — is answered with the server's
        newest supported revision, not with the string it was sent.
    files:
      - src/mcp.rs
      - tests/mcp.rs
    evidence: []

  - id: US-SEMLITH-0.6.0-T02
    summary: >
      Serve the 2026-07-28 stateless era alongside the handshake:
      `server/discover`, per-request `_meta` protocol version and client
      capabilities, `resultType` and server identity on every result,
      `ttlMs`/`cacheScope` on `tools/list`, and -32022 for a revision the server
      does not implement.
    why_required: >
      2026-07-28 makes `server/discover` mandatory and removes `initialize`. A
      server that answers only the handshake is invisible to any client built on
      that revision, and clients that probe with `server/discover` first are the
      ones shipping next.
    status: todo
    depends_on:
      - US-SEMLITH-0.6.0-T01
    acceptance_criteria:
      - >
        `server/discover`, sent as the first message with no `initialize` before
        it, returns a `DiscoverResult` carrying `resultType: "complete"`,
        `supportedVersions` including `2026-07-28`, `capabilities.tools`,
        `_meta["io.modelcontextprotocol/serverInfo"]`, `ttlMs` and `cacheScope`.
      - >
        A `tools/call` carrying `_meta["io.modelcontextprotocol/protocolVersion"]`
        of `2026-07-28`, with no handshake at any point in the session, returns a
        result with `resultType: "complete"` and server identity in `_meta`; the
        matching `tools/list` also carries `ttlMs` and `cacheScope`, and lists the
        tools in the same order every time.
      - >
        A request whose `_meta` protocol version is unsupported returns JSON-RPC
        error -32022 whose `data.supported` lists exactly the revisions the server
        advertises and whose `data.requested` echoes what was asked.
    files:
      - src/mcp.rs
      - tests/mcp.rs
    evidence: []

  - id: US-SEMLITH-0.6.0-T03
    summary: >
      Add `semlith_files`: the indexed file list as a tool, narrowed by the same
      path/ext/lang/store arguments as search, capped, and saying how many paths
      it left out.
    why_required: >
      An agent that cannot ask which files are indexed reads an empty search
      result as "the corpus does not discuss this", which is the failure this
      product exists to avoid.
    status: todo
    depends_on:
      - US-SEMLITH-0.6.0-T01
    acceptance_criteria:
      - >
        `semlith_files` returns indexed paths for a real store, narrows correctly
        on `path`, `ext`, `lang` and `store`, and when the store holds more files
        than the cap it returns the cap and says how many it left out.
    files:
      - src/mcp.rs
      - src/store.rs
      - tests/mcp.rs
    evidence: []

  - id: US-SEMLITH-0.6.0-T04
    summary: >
      Let the fleet hand out one writable store: a `store` argument that is
      optional with one store open and required with several, refusing an
      ambiguous write in-band with the names that are open. Add `semlith_forget`
      on top of it.
    why_required: >
      One writer per store is a product constraint. Both write tools need the
      same store selection and the same refusal, and forget is the small one that
      proves the plumbing before index depends on it.
    status: todo
    depends_on:
      - US-SEMLITH-0.6.0-T01
    acceptance_criteria:
      - >
        `semlith_forget` removes a file's chunks from the named store, reports the
        count, and a subsequent `semlith_search` no longer returns that file.
      - >
        With two stores open, `semlith_index` and `semlith_forget` called with no
        `store` argument return an in-band error naming both stores, and neither
        store is written; naming one writes that one and leaves the other
        untouched.
    files:
      - src/fleet.rs
      - src/mcp.rs
      - tests/mcp.rs
    evidence: []

  - id: US-SEMLITH-0.6.0-T05
    summary: >
      Add `semlith_index`: index a path into an already-open store, taking the
      write lock for the call, refusing in-band when a watcher holds it, and
      bounded by a wall-clock budget that reports what remains and resumes on the
      next call.
    why_required: >
      Without it an MCP-only agent cannot make a corpus current, and without the
      budget a first index blows through the 60-second tool timeout clients
      default to and looks like a hung server.
    status: todo
    depends_on:
      - US-SEMLITH-0.6.0-T04
    acceptance_criteria:
      - >
        Through one long-lived `semlith mcp` process: a file created after the
        server started is indexed by a `semlith_index` call and returned by a
        subsequent `semlith_search` in the same session, with no restart.
      - >
        `semlith_index` against a store whose write lock is held by a running
        `semlith watch` returns an in-band tool error naming the holder; the
        store is intact afterwards and the watcher is unaffected.
      - >
        A `semlith_index` call whose work exceeds its budget returns a partial
        report naming how many files remain, and a second identical call
        continues from there rather than re-embedding what the first call already
        did.
    files:
      - src/lib.rs
      - src/fleet.rs
      - src/mcp.rs
      - tests/mcp.rs
    evidence: []

  - id: US-SEMLITH-0.6.0-T06
    summary: >
      Write `format_version` into the store's meta table, read a store without
      the key as format 1, and refuse a store from a newer format naming both
      numbers.
    why_required: >
      A release that writes down the store as a stable surface has to make the
      format legible first. Without the marker the first real format change
      silently misreads old stores instead of refusing them.
    status: todo
    depends_on: []
    acceptance_criteria:
      - >
        A store created by 0.6.0 carries `format_version`; a store written by
        0.5.0, which has no such key, is opened and searched as format 1 with no
        migration and nothing rewritten; and a store whose `format_version` is
        higher than the binary knows is refused with an error naming both the
        store's number and the binary's.
      - >
        No store format break in either direction: the 0.5.0 binary searches and
        indexes a store written by 0.6.0, and 0.6.0 searches a store written by
        0.5.0 without re-embedding anything — `format_version` is an additive meta
        key, which is exactly why it is safe to add now.
    files:
      - src/store.rs
      - src/lib.rs
      - tests/roundtrip.rs
    evidence: []

  - id: US-SEMLITH-0.6.0-T07
    summary: >
      Document a setup stanza for every MCP client in common use, and make the
      documentation executable: a test that extracts each stanza, parses it, and
      runs its command line against a real server.
    why_required: >
      A stanza that is wrong is a user's first impression of the product, and no
      client in the list can be installed in CI. Parsing and executing what the
      documentation actually prints is the only check available.
    status: todo
    depends_on:
      - US-SEMLITH-0.6.0-T05
    acceptance_criteria:
      - >
        Every client configuration stanza in the documentation is extracted from
        the documentation, parsed as JSON or TOML, and its `command` plus `args`
        executed — producing a process that answers `initialize` and `tools/list`.
        A stanza that has drifted from the binary fails this check.
      - >
        README carries a per-client MCP setup section covering the clients named
        in scope, each with the file it goes in and a stanza that names a store.
    files:
      - README.md
      - tests/clients.rs
    evidence: []

  - id: US-SEMLITH-0.6.0-T08
    summary: >
      Write `docs/compatibility.md`: what SemVer covers, what it does not, and
      what 0.x actually promises. Link it from the README.
    why_required: >
      The roadmap outcome for this version is that a developer can depend on
      semlith. A dependency they cannot read the terms of is not one they can
      take.
    status: todo
    depends_on: []
    acceptance_criteria:
      - >
        `docs/compatibility.md` exists, is linked from the README, and states both
        what SemVer covers and what it does not.
    files:
      - docs/compatibility.md
      - README.md
    evidence: []

  - id: US-SEMLITH-0.6.0-T09
    summary: >
      Prove the release cost nothing it did not intend: the old tools byte for
      byte unchanged, no lock held at rest, the existing suite unmodified, and
      the `tools/list` response measured before and after.
    why_required: >
      Three new tools and a second protocol era are exactly the shape of change
      that quietly breaks a connected agent or spends its context. Each of those
      is a measurement, not an opinion.
    status: todo
    depends_on:
      - US-SEMLITH-0.6.0-T05
    acceptance_criteria:
      - >
        `semlith_search` and `semlith_stats` answer the legacy path byte for byte
        as they do in 0.5.0 for the same input, so an agent already connected sees
        no change it did not ask for.
      - >
        The MCP server holds no store lock at rest. A lock is taken only for the
        duration of an `index` or `forget` call, and a search issued while no
        write is in flight takes none — a store being watched stays searchable.
      - >
        The size of the `tools/list` response is reported before and after the
        release, in bytes and as a token estimate, because it is loaded into every
        agent's context in every session and this product exists to spend less of
        that, not more.
      - >
        The existing suite passes unmodified: everything 0.5.0 shipped for
        multi-store search, watching, and the roundtrip still passes with no test
        edited to accommodate this release.
    files:
      - tests/measure.rs
      - tests/mcp.rs
    evidence: []

  - id: US-SEMLITH-0.6.0-T10
    summary: >
      Ship it: version bump, CHANGELOG 0.6.0 section, and a packaging check that
      the tarball carries no secrets and no workspace state.
    why_required: >
      The release workflow reads the CHANGELOG for its notes and verifies the tag
      against Cargo.toml, so neither is optional, and the publish is permanent.
    status: todo
    depends_on:
      - US-SEMLITH-0.6.0-T07
      - US-SEMLITH-0.6.0-T08
      - US-SEMLITH-0.6.0-T09
    acceptance_criteria:
      - CHANGELOG has a 0.6.0 section, which is what the release workflow reads
        for its notes.
      - >
        `cargo publish --dry-run` passes and the packaged tarball contains no
        `.env` and no `.ultraship` directory.
    files:
      - Cargo.toml
      - CHANGELOG.md
    evidence: []
