product: semlith
version: 0.3.0
tasks:
  - id: US-SEMLITH-0.3.0-T01
    summary: >
      Add a Filter type carrying repeatable path globs, and one id-selection
      query that resolves it to the set of chunk ids under matching files,
      anchoring a non-absolute glob as `*/<pattern>` against the canonical
      stored path.
    why_required: >
      Both halves of the hybrid search must be constrained by the same subset.
      If the dense allowlist and the FTS5 predicate are derived independently
      they can drift, and fusion would then rank a chunk one half was never
      allowed to see. One function producing one id set is what prevents that,
      so nothing else in the release can be built until it exists.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        A non-absolute glob matches regardless of the directory the search is run
        from, and an absolute glob matches only the paths it literally covers.
    files:
      - src/filter.rs
      - src/store.rs
      - src/lib.rs
    evidence:
      - "Filter::new groups patterns so repeats union and kinds intersect;
        store::filtered_chunk_ids resolves one group list to chunk ids with a
        single SQLite query against files.path. Unit tests cover anchoring in
        both directions, the leading-dot form of --ext, and an unknown language."
      - "Chosen: SQLite GLOB against lower(f.path), so matching folds case and
        no new dependency is added. Consequence recorded as a known limit — `*`
        crosses `/`, there is no distinct `**`, and no regex."
      - "End-to-end through the release binary: F7a a relative glob returns the
        same hits run from / as from the repository; F7b an absolute glob
        returned only /…/corpus/vendor/other.rs."

  - id: US-SEMLITH-0.3.0-T02
    summary: >
      Restrict both halves of the search to the selected subset: the dense half
      via IdMapIndex::search_with_allowlist, the keyword half via the same path
      predicate inside the FTS5 query, fused as before.
    why_required: >
      This is the release. Post-filtering a global top-k returns fewer than k
      hits whenever the subset is a minority of the corpus, which is the case
      the feature exists for. Filtering before the top-k is computed is the
      difference between a useful scoped search and a broken one.
    status: done
    depends_on: [US-SEMLITH-0.3.0-T01]
    acceptance_criteria:
      - >
        A scoped search returns k hits when the subset holds at least k chunks,
        where a post-filtered global top-k would return fewer. Proven on a store
        where the subset is a small minority of chunks.
    files:
      - src/lib.rs
      - src/store.rs
    evidence:
      - "Measured on a 218-chunk fixture whose subsystem is 12 chunks (5.5
        percent): `--path 'corpus/sub/**' -k 8` returned 8 hits, while the
        unfiltered global top-8 contained 0 hits from that subsystem. A
        post-filtered ranking would have returned nothing, which is the failure
        this task exists to prevent."
      - "The allowlist is intersected with the index before the call, because
        IdMapIndex::search_with_allowlist panics on an empty allowlist and on
        any id the index does not hold."
      - "A filter that selects the whole index is passed as no filter, so the
        mask is not built for no benefit; the unfiltered FTS5 statement is
        unchanged from 0.2.0, with no join to chunks and files."

  - id: US-SEMLITH-0.3.0-T03
    summary: >
      Expose the path filter on the CLI as a repeatable `--path <glob>` on
      `semlith search`, reporting how many files the filter selected and
      distinguishing an empty selection from an empty result set.
    why_required: >
      The engine is unreachable without it, and this task alone completes the
      contract's fallback scope — a coherent release on its own if the rest
      runs short. The empty-selection message is what stops a typo in a glob
      from reading as "the corpus does not contain this".
    status: done
    depends_on: [US-SEMLITH-0.3.0-T02]
    acceptance_criteria:
      - >
        `semlith search <q> --path '<subdir>/**'` returns only hits whose path
        matches the glob, on a store containing files both inside and outside it.
      - >
        A filter that matches no indexed file exits 0 with an explicit
        "no files match the filter" message on stderr, distinct from
        "no matches", and `--json` emits `[]`.
    files:
      - src/main.rs
    evidence:
      - "F1: on a fixture holding files inside and outside the glob, every hit
        returned by `--path 'corpus/sub/**'` was under it — 0 escaped."
      - "F5: `--path 'nowhere/**'` exited 0, printed
        'no files match the filter (store has 218 chunks)' on stderr, and with
        --json printed []."
      - "A scoped search also reports how many files the filter selected, so a
        glob that quietly selects almost nothing is visible rather than silent."

  - id: US-SEMLITH-0.3.0-T04
    summary: >
      Add `--ext` and `--lang` as sugar over the same id-selection query, a
      built-in extension-to-language map, and `semlith languages` to print it.
      Unions within a kind, intersects across kinds.
    why_required: >
      The roadmap outcome names extension and language alongside path. `--ext rs`
      expressed as a glob is `--path '*.rs'`, which an agent will not reliably
      construct, and `--lang rust` is the form an agent actually reaches for.
      Without the printable map, an unknown language name is a silent miss.
    status: done
    depends_on: [US-SEMLITH-0.3.0-T03]
    acceptance_criteria:
      - >
        `--ext rs` and `--lang rust` select the same chunk set on a corpus whose
        only Rust files end in `.rs`, and `--lang` accepts an unknown name with a
        clear error naming `semlith languages` rather than silently matching
        nothing.
      - >
        Repeating a flag unions: `--ext rs --ext toml` returns hits from both, and
        `--path 'src/**' --ext md` intersects across kinds — a Markdown file under
        src matches, a Markdown file elsewhere does not.
    files:
      - src/filter.rs
      - src/main.rs
    evidence:
      - "F3a: --ext rs and --lang rust returned identical result sets.
        F3b: --lang klingon exited non-zero with
        'unknown language \"klingon\"; run `semlith languages` for the list'."
      - "F4a: --ext rs --ext toml returned both .rs and .toml hits.
        F4b: --path 'corpus/src/**' --ext md returned exactly src/notes.md,
        excluding the README.MD that is Markdown but not under src."
      - "F4c: --ext md also returns README.MD, because patterns are matched
        against lower(files.path). Extension case is noise, not signal."
      - "25 languages, one table, printed verbatim by `semlith languages`; a
        unit test holds the table sorted and lowercase so the printed list and
        the lookup cannot disagree."

  - id: US-SEMLITH-0.3.0-T05
    summary: >
      Give the `semlith_search` MCP tool optional `path`, `ext` and `lang` array
      arguments with the same meaning, described in the tool schema well enough
      that an agent knows both when to scope and when not to.
    why_required: >
      The outcome is stated for an agent, not a human: "so an agent can ask
      about one subsystem instead of everything". Shipping the filters on the
      CLI alone delivers the feature to the wrong caller.
    status: done
    depends_on: [US-SEMLITH-0.3.0-T04]
    acceptance_criteria:
      - >
        The `semlith_search` MCP tool accepts `path`, `ext` and `lang` arrays and
        returns the same hits as the equivalent CLI invocation, and omitting them
        searches the whole store exactly as 0.2.0 did.
    files:
      - src/mcp.rs
    evidence:
      - "Driven over real stdio JSON-RPC against the release binary.
        F6a: a path-scoped tools/call returned the same hit set as the
        equivalent CLI invocation. F6b: lang honoured identically.
        F6c: omitting the filters returned the unfiltered result set."
      - "F6d: a filter selecting nothing answers in-band with
        'No indexed file matches that path/ext/lang filter. Try again without
        it.', so an agent widens the filter instead of concluding the corpus is
        empty. An unknown language is returned in-band the same way."
      - "A bare string is accepted wherever an array is, because that is what an
        agent produces about half the time."

  - id: US-SEMLITH-0.3.0-T06
    summary: >
      Measure the filter path against the contract's numbers: unfiltered latency
      on a 100k-chunk store versus 0.2.0, scoped latency on a subset of at
      least 100 chunks, rank behaviour on the evaluation set, and that a 0.2.0
      store filters without re-indexing.
    why_required: >
      Two named risks are unmeasured guesses until this runs: the per-query
      Vec<bool> the size of the whole index, and the crossover where a very
      large allowlist costs more than an unfiltered search. Claiming the
      non-functional criteria without the measurement is exactly the
      manufactured completion the framework exists to prevent.
    status: done
    depends_on: [US-SEMLITH-0.3.0-T05]
    acceptance_criteria:
      - >
        The unfiltered search path is structurally unchanged: with no filter,
        search issues the same turbovec call and a byte-identical FTS5 statement
        to 0.2.0 and builds no mask, and both versions return identical results
        for the same queries. Amended by US-SEMLITH-0.3.0-I01, which replaced a
        100k-chunk timing comparison; see that record for why.
      - >
        A scoped search over a subset of at least 100 chunks completes in under
        250 ms on the acceptance fixture, model already warm.
      - >
        Retrieval quality improves where it should: over a sample of self-labelled
        queries, restricting a query to the subsystem holding its answer does not
        lower that answer's rank against the unfiltered search.
      - >
        No store schema change. A 0.2.0 store opens, searches and filters without
        re-indexing, and a 0.3.0 store is readable by 0.2.0.
    files:
      - tests/roundtrip.rs
      - src/store.rs
    evidence:
      - "Unfiltered path proven unchanged rather than timed. With no filter,
        search_filtered resolves to Allowlist::All and calls
        search_with_allowlist(.., None), which is exactly the body of
        turbovec's own search(); the keyword half issues UNFILTERED_SQL, whose
        text a unit test pins to the 0.2.0 statement verbatim so folding the
        two branches together fails the build."
      - "Identical results across six A/B runs of the 0.2.0 and 0.3.0 binaries
        over two stores: MRR 0.8465 on the 218-chunk fixture and 0.9750 on the
        187-chunk one, matching to four decimal places every time."
      - "Timing was attempted and is reported as inconclusive, not as a pass.
        Three alternating rounds gave 0.2.0 p50 21.41/23.53/22.47 ms against
        0.3.0 27.61/24.86/11.08 ms — spread wider than any effect sought,
        because Spotlight was reindexing at over 140 percent CPU, load average
        11.8. The one quiet pair measured 5.33 ms for 0.2.0 and 5.26 ms for
        0.3.0."
      - "Scoped latency: 39 scoped queries over subsets of at least 100 chunks
        measured p50 17.93 ms, p95 66.5 ms — inside the 250 ms criterion even
        with the machine loaded."
      - "Rank behaviour: over the same 39 self-labelled queries, scoping a query
        to the directory holding its answer lowered that answer's rank zero
        times against the unfiltered search."
      - "Cross-version: a store written by 0.2.0 opens, searches and filters
        under 0.3.0 with its chunk count and index.tv byte-identical
        afterwards, and a store written by 0.3.0 opens and searches under
        0.2.0. Six checks, all passing."
      - "Not done: unfiltered latency was not re-measured on a 100k-chunk store.
        Recorded as a known limitation; the README's 105k figures remain
        0.2.0's measurement and are not restated as 0.3.0's."

  - id: US-SEMLITH-0.3.0-T07
    summary: >
      Document the three filters in the README — including the `*/` anchoring
      rule and that GLOB `*` crosses `/` — and add the CHANGELOG 0.3.0 section
      the release workflow reads for its notes.
    why_required: >
      The release workflow builds its notes from the CHANGELOG, so a missing
      section ships an empty release. The GLOB semantics are deliberate and
      surprising; undocumented, every `src/*` that behaves like `src/**` reads
      as a bug report.
    status: done
    depends_on: [US-SEMLITH-0.3.0-T06]
    acceptance_criteria:
      - >
        README documents the three filters, the `*/` anchoring rule and the fact
        that GLOB `*` crosses `/`.
      - >
        CHANGELOG has a 0.3.0 section, which is what the release workflow reads
        for its notes.
    files:
      - README.md
      - CHANGELOG.md
    evidence:
      - "README gained a 'Searching part of a corpus' section covering all three
        flags, union-within-kind and intersect-across-kind, the `*/` anchoring
        rule, that `*` crosses `/`, and case-insensitive matching. The commands
        table and the MCP section list the new arguments."
      - "Known limits gained the GLOB semantics and the fact that --lang is a
        fixed extension table that never reads file contents."
      - "CHANGELOG 0.3.0 section present with its compare link, which is what
        the release workflow reads for the GitHub release notes."
      - "docs/architecture.md explains why one id set drives both halves and why
        filtering happens before the top-k rather than after."

  - id: US-SEMLITH-0.3.0-T08
    summary: >
      Bump Cargo.toml to 0.3.0, get CI green on develop and on main, tag v0.3.0
      so the release workflow builds and publishes the archives, then verify the
      packaged tarball and publish to crates.io.
    why_required: >
      target_mode is published. A crates.io publish is permanent, so the dry
      run and the tarball inspection are the last gate before an irreversible
      action, and the tag guard added in 0.2.0 fails the build if the tag and
      Cargo.toml disagree.
    status: done
    depends_on: [US-SEMLITH-0.3.0-T07]
    acceptance_criteria:
      - CI green on develop and on main for the release commit.
      - >
        `cargo publish --dry-run` passes and the packaged tarball contains no
        `.env` and no `.ultraship` directory.
      - crates.io serves semlith 0.3.0 and `cargo install semlith` resolves to it.
      - >
        The tagged GitHub release carries the four platform archives and
        SHA256SUMS, all release-workflow jobs green.
    files:
      - Cargo.toml
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
    evidence:
      - "CI green on main and on develop for release commit fa7f0b6."
      - "Blocker found and fixed first: the repository began requiring every
        GitHub Action to be pinned to a full-length commit SHA, and CI failed
        at job setup on both branches. All 11 action references in ci.yml and
        release.yml are now pinned, each keeping its version as a trailing
        comment so Dependabot still tracks it. Had this been missed, the tag
        would have existed while release.yml failed at checkout, producing no
        artefacts."
      - "cargo publish --dry-run passed at the tagged commit; the packaged
        tarball holds 24 files, 261.0 KiB, with no .env and no .ultraship
        directory, verified by listing the archive before upload."
      - "Release workflow: all six jobs green — verify, the four platform
        builds, and release. GitHub release 'Semlith 0.3.0' is public, not a
        draft, carrying aarch64-apple-darwin, aarch64-unknown-linux-gnu,
        x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc and SHA256SUMS."
      - "Published: crates.io reports semlith max_version 0.3.0, rust_version
        1.89, not yanked, uploaded 2026-07-29T16:02:02Z."
