product: semlith
version: 0.5.0
tasks:
  - id: US-SEMLITH-0.5.0-T01
    summary: >
      Search several stores from one query: a repeatable `--store` on the read
      commands, a `SEMLITH_STORE` list, one query vector per distinct model
      computed outside the store and handed in, per-store rankings merged by the
      reciprocal-rank scores they already carry, and the store on every hit.
    why_required: >
      This is the release. Everything else either protects it from a way it
      looks right and is wrong, proves a number about it, or ships it.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        One query over two stores holding disjoint corpora returns hits from
        both, each carrying the store it came from, in a single ranked list.
      - >
        A phrase that exists only in the second store is returned by a two-store
        query at the same rank it holds when that store is searched alone —
        adding a store does not bury the store that has the answer.
      - >
        `-k 5` over three stores returns five hits in total, not five per store.
    files:
      - src/fleet.rs
      - src/lib.rs
      - src/main.rs
    evidence:
      - "src/fleet.rs holds a Fleet of labelled stores and one loaded model per
         distinct model. Semlith::search_ranked is the existing search with the
         query embed lifted out, so the fleet embeds once per model and no store
         loads weights of its own — the two paths are one body, not a copy."
      - "Chosen: per-store results are merged, not re-ranked. Each store's list
         arrives already ranked and that order survives; across stores the key
         is the fused score, which is a sum of rank reciprocals from the same
         formula at the same depth and therefore the one quantity that is the
         same unit under any model."
      - "cargo test --test fleet -- --ignored: one query over two disjoint
         corpora returned hits from both, every hit carrying its store; -k 5
         over three stores returned five hits, not fifteen."
      - "Store provenance is Option<String>, skipped when serializing if None
         and set only when more than one store was searched, so a single-store
         --json is byte for byte what 0.4.0 emitted — verified against the 0.4.0
         release binary in compat.sh."

  - id: US-SEMLITH-0.5.0-T02
    summary: >
      Make a named store either a real store or an error: read commands refuse a
      path that is not already a store and create nothing, and the same store
      named twice — repeated, relative against absolute, through a symlink — is
      searched once.
    why_required: >
      Both failures are invisible in a multi-store query, which is what makes
      them worth their own task. A mistyped store today becomes an empty store
      that contributes nothing while the other stores still return hits, and a
      store fused with itself doubles every rank contribution it has and takes
      over the result list.
    status: done
    depends_on: [US-SEMLITH-0.5.0-T01]
    acceptance_criteria:
      - >
        A `--store` path that does not exist exits non-zero naming the path, and
        no directory, `store.db` or `index.tv` is created anywhere as a result.
      - >
        Naming the same store twice — the flag repeated, and once by a relative
        and once by an absolute path — produces the same result list as naming it
        once, with no duplicated hits.
    files:
      - src/lib.rs
      - src/fleet.rs
      - tests/fleet.rs
    evidence:
      - "Semlith::open_existing refuses a directory with no store.db rather than
         creating one, and every read command goes through it. cargo test --test
         fleet: the error names the mistyped path and neither the store
         directory nor its parent is created."
      - "Stores are deduplicated by canonical path before they are searched. The
         test drives the release binary with the same store named twice — once
         absolute, once as `.semlith` from the directory holding it — and the
         --json result list is identical to naming it once."
      - "Why it matters rather than being tidy: merging a store with itself
         gives every one of its hits a twin at exactly the same score, so the
         duplicated store takes the whole result list."

  - id: US-SEMLITH-0.5.0-T03
    summary: >
      Filters across every store, stores whose models differ searched together,
      and the measurement that decides whether fusion needs a relevance floor:
      does naming an unrelated store degrade a query the first store answered?
    why_required: >
      A filter that selects nothing in one store must not report an empty
      selection for the query as a whole, or the filter and the multi-store flag
      cannot be used together. Mixed models are the realistic state of a
      developer's stores, since the default model changed in 0.3.0. And the
      no-degradation measurement is the one that can send the fusion design
      back, so it belongs before the release is anywhere near finished.
    status: done
    depends_on: [US-SEMLITH-0.5.0-T02]
    acceptance_criteria:
      - >
        `--ext`/`--path`/`--lang` filter every store, and a filter that matches
        files in only one of two stores returns that store's hits rather than
        reporting that no files match.
      - >
        Two stores built with different embedding models are searched in one
        query and both contribute hits, with each store's own model used to embed
        the query for it.
      - >
        A query answered well by one store is not degraded by also naming an
        unrelated store: the hits that a single-store search returns are still
        present, and still ranked above the unrelated store's best effort.
    files:
      - src/fleet.rs
      - tests/fleet.rs
    evidence:
      - "Answered the contract's open question on a relevance floor: no floor.
         The first run of the no-degradation test found the unrelated store at
         rank 1 — two single-file stores both scored 0.032786883, because every
         store's best hit is dense-rank-1 in its own ranking, and the tie fell
         to the order the stores were named in. Ties now go to the higher
         similarity to the query vector, which reorders among equals rather than
         dropping anything a floor would have dropped."
      - "cargo test --test fleet -- --ignored: a phrase held by only the second
         store comes back at the same rank a search of that store alone gives
         it; every hit a single-store search returned is still present in the
         two-store list with no unrelated hit above it."
      - "Filters reach every store and the empty-selection question is asked of
         the whole selection: --ext rs over a Markdown store and a Rust store
         returns the Rust hits instead of reporting that no files match."
      - "cargo test --test fleet -- --ignored different_models: stores built
         with granite and with BGESmallENV15 both contributed hits to one query,
         each embedding the query with its own model."
      - "Three unit tests in src/fleet.rs pin the merge itself with no model or
         store needed: equal scores decided by similarity rather than argument
         order, a store's own order surviving the merge, and k bounding the
         merged list rather than each store."

  - id: US-SEMLITH-0.5.0-T04
    summary: >
      Serve several stores from one MCP process: store labels in the tool
      results, an optional `store` argument that narrows a query, an unknown
      store name answered in-band with the stores that are open, and
      `semlith_stats` reporting each store.
    why_required: >
      The roadmap outcome is stated for an agent working across repositories.
      Multi-store search that only the CLI can reach delivers the release to the
      wrong caller — the same mistake 0.3.0's and 0.4.0's MCP tasks existed to
      prevent.
    status: done
    depends_on: [US-SEMLITH-0.5.0-T03]
    acceptance_criteria:
      - >
        A single `semlith_search` call against a real `semlith mcp` child process
        opened on two stores returns excerpts from both with their store labels,
        driven over stdio JSON-RPC; the `store` argument restricts the same query
        to one of them; and an unknown store name comes back as an in-band tool
        error naming the stores that are open.
    files:
      - src/mcp.rs
      - src/main.rs
      - tests/fleet.rs
    evidence:
      - "mcp::serve takes a Fleet. The open store names are written into the
         `store` argument's description, because an agent cannot narrow to a
         name it has never seen, and semlith_stats reports one line per store —
         one store still answers in exactly 0.4.0's single line."
      - "cargo test --test fleet -- --ignored: a real `semlith mcp` child
         process opened on two stores, driven over stdio JSON-RPC, returned
         excerpts from both with their labels in one tools/call; `store`:
         [\"rust\"] restricted the same query to that store and dropped the
         other's file; an unknown name came back as isError naming both open
         stores."
      - "Chosen: an unknown store name is an in-band tool error, not an empty
         result. An agent reads no matches as \"the corpus does not discuss
         this\", which is a different and wrong answer."

  - id: US-SEMLITH-0.5.0-T05
    summary: >
      `stats` and `files` per store, and a store that `semlith watch` is holding
      the write lock on searchable inside a multi-store query, freshness
      included.
    why_required: >
      "Is this corpus even indexed" has to stay answerable per store, or an
      empty answer from a fleet is undiagnosable. And a multi-store search that
      takes a store lock, or that misses the generation counter on one of its
      stores, silently turns 0.4.0's freshness guarantee off for anyone using
      both features — which is the same developer.
    status: done
    depends_on: [US-SEMLITH-0.5.0-T04]
    acceptance_criteria:
      - >
        `semlith stats` and `semlith files` over two stores report both, labelled,
        and a single-store invocation prints exactly what 0.4.0 printed.
      - >
        A store being watched by a running `semlith watch` is searchable as part
        of a multi-store query, and an edit the watcher re-embeds is returned by a
        subsequent multi-store search from a long-running reader with no restart.
    files:
      - src/main.rs
      - src/fleet.rs
      - tests/fleet.rs
    evidence:
      - "stats prints one block per store plus a total when several are given,
         files prints one list per store, and both print exactly 0.4.0's output
         for a single store — asserted in the test, not eyeballed."
      - "cargo test --test fleet -- --ignored: with a real `semlith watch`
         holding the write lock on one of two stores, a long-lived fleet reader
         opened before the edit returned the watcher's newly indexed file on a
         later search, with no reopen. A multi-store search takes no store lock,
         and each store keeps its own generation check."
      - "stats reports the store's own directory rather than the flag order, so
         a store named twice is listed once."

  - id: US-SEMLITH-0.5.0-T06
    summary: >
      Measure rather than assert: query embeds per search against distinct
      models, latency for one, two and three stores with the per-store
      increment, resident memory for a three-store reader, cross-version
      compatibility both ways, and the single-store paths unchanged.
    why_required: >
      "One embed per model" and "not three copies of the model" are exactly the
      claims that are true in the design and false in the code. 0.4.0 found a
      measurement bug that had already changed a default before any number was
      reported, so the numbers get their own task and print what they saw.
    status: done
    depends_on: [US-SEMLITH-0.5.0-T05]
    acceptance_criteria:
      - >
        One search embeds the query once per distinct embedding model, not once
        per store — measured as a count, not asserted, over three same-model
        stores.
      - >
        Multi-store search latency is reported on the acceptance fixture for one,
        two and three stores, with the per-store increment stated, so the cost of
        adding a store is a number rather than a claim.
      - >
        Resident memory for a reader open on three same-model stores is reported
        and does not hold three copies of the model.
      - >
        No store schema change and no index format change: a store written by
        0.4.0 is searchable by 0.5.0 with no re-index, and a store written by
        0.5.0 is searchable by the 0.4.0 binary.
      - >
        Single-store behaviour is unchanged: `index`, `watch`, `search`, `stats`,
        `files`, `forget` and both MCP tools behave exactly as in 0.4.0 when one
        store is given, with the existing test suite passing unmodified.
    files:
      - tests/measure.rs
      - tests/roundtrip.rs
    evidence:
      - "Measurements live in tests/measure.rs and print what they saw:
         `cargo test --release --test measure -- --ignored --test-threads 1
         --nocapture`. On three 300-file stores sharing a model, M1: 1 query
         embed per search (counted by the fleet, not inferred); medians over 20
         searches of 3.4ms for one store, 3.7ms for two and 4.0ms for three, so
         +0.3ms per store; and a real `semlith mcp` process holding 137 MB
         whether it was opened on one store or on three."
      - "Two harness bugs were found and fixed before any number was reported.
         The memory measurement first slept 15 seconds and read 17 MB for both
         servers — neither had finished loading its model — so it now drives a
         real search to completion over stdio and measures a process that has
         answered. And the per-store increment used Duration subtraction, which
         panicked the first time three stores came out faster than two; it is
         signed milliseconds now, which is also the honest way to print a
         difference that small."
      - "Cross-version, both directions, through two release binaries (0.4.0
         installed from crates.io): 0.5.0 searched a 0.4.0-written store and a
         following index run reported the file unchanged, so nothing was
         re-embedded; 0.4.0 then searched a 0.5.0-written store and indexed a
         further file into it. Script and output in evidence/0.5.0/compat.sh and
         compat-run.txt."
      - "No schema change: `SELECT name FROM sqlite_master` is identical between
         a 0.4.0-written and a 0.5.0-written store, and the meta keys are still
         fts_built, index_generation and model — nothing added."
      - "Single-store behaviour proven rather than asserted: the same query with
         --json against the same store produced byte-identical output under the
         0.4.0 and 0.5.0 binaries. The existing suites pass unmodified — cargo
         test 45 passed, --test watch --ignored 10 passed, --test roundtrip
         --ignored 2 passed, plus 11 new fleet tests."

  - id: US-SEMLITH-0.5.0-T07
    summary: >
      Document multi-store search where it will be read: the repeatable flag,
      the `SEMLITH_STORE` list, what a store label is, that writes stay
      single-store, an MCP server definition naming several stores, and the
      CHANGELOG 0.5.0 section.
    why_required: >
      The release workflow builds its notes from the CHANGELOG, so a missing
      section ships an empty release. And a feature whose flag is repeatable on
      some commands and not others is undiscoverable from `--help` alone.
    status: done
    depends_on: [US-SEMLITH-0.5.0-T06]
    acceptance_criteria:
      - >
        README documents multi-store search: the repeatable flag, the
        `SEMLITH_STORE` list, what the store labels are, that writes stay
        single-store, and an MCP server definition naming several stores.
      - CHANGELOG has a 0.5.0 section, which is what the release workflow reads
        for its notes.
    files:
      - README.md
      - CHANGELOG.md
      - docs/architecture.md
    evidence:
      - "README gained a 'Searching several stores at once' section with real
         output, the rules that decide what a hit looks like (labels only when
         there is something to tell apart, k global, filters everywhere, models
         may differ), the SEMLITH_STORE list, and the two limits a user meets:
         writes stay single-store, and a store path that is not a store is an
         error rather than a new empty store. The commands table's global note
         says which commands take a repeatable flag and which take one."
      - "The agent section shows an MCP server definition naming two stores, the
         optional store argument, and what an unknown store name comes back as —
         that is the release's own outcome, so it is documented where an agent's
         operator will read it."
      - "CHANGELOG 0.5.0 section present with its compare link, which is what the
         release workflow reads for the GitHub release notes, including the
         behaviour change (a read command refuses a path that is not a store) and
         a Notes paragraph on compatibility in both directions."
      - "Known limits records what the merge does not do: a store with nothing to
         say still offers its best hit, the similarity tiebreak compares two
         vector spaces when two models are involved, and stores are named by path
         with no registry and no discovery."
      - "docs/architecture.md gained 'Several stores, one query' explaining why
         ids never leave their store, why the embedder moved out of Semlith, why
         results are merged rather than re-ranked, and the tie that the first
         test caught — with the numbers that decided the tiebreak over a floor."

  - id: US-SEMLITH-0.5.0-T08
    summary: >
      Bump Cargo.toml to 0.5.0 and ship it: PR `feat/0.5.0` → develop, PR
      develop → main, CI green on both, tag v0.5.0 for the release workflow,
      inspect the packaged tarball, then publish to crates.io on an explicit
      go-ahead.
    why_required: >
      target_mode is published. A crates.io publish is permanent, so the dry run
      and the tarball inspection are the last gate before an irreversible
      action.
    status: done
    depends_on: [US-SEMLITH-0.5.0-T07]
    acceptance_criteria:
      - CI green on develop and on main for the release commit, with every action
        still pinned to a full-length commit SHA.
      - >
        `cargo publish --dry-run` passes and the packaged tarball contains no
        `.env` and no `.ultraship` directory.
      - crates.io serves semlith 0.5.0 and `cargo install semlith` resolves to it.
      - >
        The tagged GitHub release carries the four platform archives and
        SHA256SUMS, all release-workflow jobs green.
      - >
        The release ships through the project's branch flow: `feat/0.5.0` →
        pull request to `develop` → pull request to `main` → tag.
    files:
      - Cargo.toml
      - .github/workflows/release.yml
    evidence:
      - "Shipped through the branch flow: feat/0.5.0 -> PR #13 -> develop -> PR
         #14 -> main -> tag v0.5.0. Started from a freshly pulled develop, and
         no Dependabot PR was open to land first this time."
      - "CI green on develop (PR #13) and on main for the release commit
         7038eb8, on ubuntu-latest and macos-latest, plus CodeQL, with every
         action still pinned to a full-length SHA. Confirmed green on main
         before the tag was pushed, so the release workflow could not fail
         after the tag existed."
      - "cargo publish --dry-run passed and the package list was inspected
         before any upload: 30 files, 403.5 KiB, no .env and no .ultraship. The
         one new file against 0.4.0 is assets/semlith-logo.png."
      - "release.yml — 6 of 6 jobs green: verify, four platform builds,
         release. GitHub release 'Semlith 0.5.0' is public, not a draft, with
         the four platform archives and SHA256SUMS."
      - "Smoke tested from the downloaded archive rather than a local build:
         shasum -a 256 -c OK, ./semlith --version reports 'semlith 0.5.0', two
         stores indexed and one query returned a labelled hit from each with
         the footer 'across 2 stores: api 1, cli 1', stats printed a block per
         store plus a total, and a mistyped store exited 1 naming the path."
      - "Published on explicit go-ahead, since crates.io cannot be undone:
         crates.io reports max_version 0.5.0, rust_version 1.89, not yanked,
         136740 bytes, uploaded 2026-07-30T02:01:13Z. `cargo install semlith
         --version 0.5.0 --locked` on a clean root installs and reports
         'semlith 0.5.0'."
