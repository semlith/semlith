product: semlith
version: 0.8.0
tasks:
  - id: US-SEMLITH-0.8.0-T01
    summary: >
      Dispatch extraction on extension before the binary check, and read `.ipynb`
      as its cells rather than as raw JSON.
    why_required: >
      `chunk::extract` rejects anything with a NUL byte in its first 8 KiB, which
      is every archive format this release adds — so until dispatch happens
      before that check, no document reader can ever be reached. Notebooks are
      the cheapest proof the dispatch works: serde_json is already a dependency,
      the file is already indexed today as unreadable JSON, and the improvement is
      visible in a single search.
    status: todo
    depends_on: []
    acceptance_criteria:
      - >
        A notebook's markdown cell, its code cell and its cell ordering all survive:
        searching for a phrase in a markdown cell and for an identifier defined in a
        code cell each return the notebook, and no chunk of the notebook is mostly
        JSON keys.
      - >
        Indexing a corpus of ordinary source is not measurably slower than 0.7.0 on
        it — the dispatch this release adds is on extension, before any file is
        parsed, so a repository of Rust must not pay for the formats it has none of.
    files:
      - src/chunk.rs
    evidence: []

  - id: US-SEMLITH-0.8.0-T02
    summary: >
      Reduce `.html` and `.htm` to their text, dropping script and style content,
      decoding entities, and keeping the source's newlines so line locators stay
      true.
    why_required: >
      An HTML chunk today is mostly markup, so the 800 characters a chunk is
      allowed carry a fraction of a sentence and the embedding is of the syntax
      rather than of the page. Preserving newlines rather than reflowing is what
      lets the release keep the `file:line` promise that every other format in
      semlith makes.
    status: todo
    depends_on:
      - US-SEMLITH-0.8.0-T01
    acceptance_criteria:
      - >
        An HTML page is indexed as its text: a search for a sentence in its prose
        returns it, a search for a tag or attribute name that appears only in its
        markup returns no hit from that file, and the reported line range covers
        the source lines where that sentence lives — checked against the file on
        disk, not against the extracted text.
    files:
      - src/chunk.rs
    evidence: []

  - id: US-SEMLITH-0.8.0-T03
    summary: >
      Read the archive formats — `.docx`, `.pptx`, `.xlsx`, `.odt`, `.odp`,
      `.ods` — through one bounded ZIP reader and one paragraph-aware XML text
      pass.
    why_required: >
      These six are the formats the release outcome names and the ones a
      developer's corpus actually holds; all six are ZIP archives of XML, so they
      share one reader and one text pass. Without them the release is its
      fallback scope.
    status: todo
    depends_on:
      - US-SEMLITH-0.8.0-T02
    acceptance_criteria:
      - >
        For each of `.docx`, `.pptx`, `.xlsx`, `.odt`, `.odp`, `.ods` and `.ipynb`,
        a file produced by real software and containing a phrase that appears
        nowhere else in the corpus is indexed by `semlith index`, and
        `semlith search` for that phrase returns that file as the top hit with a
        line range. The identical corpus indexed by a 0.7.0 release binary returns
        no hit for any of them.
      - >
        A spreadsheet with more than one sheet returns text from a named sheet
        other than the first, and the excerpt says which sheet. A deck with more
        than ten slides returns text from slide 11 with the slide named, which is
        also what proves slide order is numeric rather than lexicographic.
    files:
      - src/chunk.rs
      - Cargo.toml
    evidence: []

  - id: US-SEMLITH-0.8.0-T04
    summary: >
      Make every new path survive hostile input: a decompression cap, no
      reachable panic, and a skipped file that never ends a run.
    why_required: >
      A ZIP reader is an attack surface aimed at whatever a user indexes. A small
      archive that expands without bound decides how much memory the run uses,
      and a panic from a malformed document ends the process rather than the
      file. This is the task that decides whether the release is safe to publish.
    status: todo
    depends_on:
      - US-SEMLITH-0.8.0-T03
    acceptance_criteria:
      - >
        A corrupt archive, a truncated archive, a password-protected `.docx` and a
        zero-length file placed among good files are each counted as skipped, the
        run exits zero, and every good file in the same run is indexed.
      - >
        An archive whose entries expand beyond the documented cap is skipped, and
        peak RSS for a run containing it stays within a stated margin of the same
        run without it. The number is measured, not asserted from the constant.
      - >
        No panic and no `unwrap` reachable from a hostile file: the whole extraction
        surface is exercised against malformed input for every format added, and
        `catch_unwind` protects any dependency that can panic, as it already does
        for PDF.
    files:
      - src/chunk.rs
      - tests/formats.rs
    evidence: []

  - id: US-SEMLITH-0.8.0-T05
    summary: >
      `semlith watch` and re-indexing handle documents the way they handle source.
    why_required: >
      Watching is how a store stays current, and a document that is only read on
      a first index is a document whose store goes stale the moment someone edits
      it. The path is shared, so this is confirmation rather than construction —
      and confirmation is exactly what an acceptance criterion is for.
    status: todo
    depends_on:
      - US-SEMLITH-0.8.0-T03
    acceptance_criteria:
      - >
        `semlith watch` picks up a saved `.docx` and a saved `.ipynb` the same way
        it picks up a saved `.rs`, and a store re-indexed after a document changes
        returns the new text and not the old.
    files:
      - tests/formats.rs
    evidence: []

  - id: US-SEMLITH-0.8.0-T06
    summary: >
      Documentation: the README format table, the CHANGELOG entry that states the
      HTML and notebook change as a change, and the compatibility note placing
      extracted text outside the covered contract.
    why_required: >
      Two behaviours change for files that are already indexable, and a store
      that already holds them keeps its old chunks until those files change.
      Without the CHANGELOG line saying so, the release looks like it did nothing
      to the person most likely to try it first.
    status: todo
    depends_on:
      - US-SEMLITH-0.8.0-T04
    acceptance_criteria:
      - >
        The CHANGELOG has a 0.8.0 section — which is what the release workflow reads
        for its notes — stating both what is newly readable and what now reads
        differently, with what to do about a store that already indexed HTML or
        notebooks.
      - >
        The README's "What gets indexed" section lists every format and what is
        taken from it, including the size and decompression caps and what happens
        to a file that fails them.
      - >
        `docs/compatibility.md` says that which formats are extracted is documented
        and grows additively, and that the text extracted from a given file is not
        a covered surface — the same footing as ranking scores.
    files:
      - README.md
      - CHANGELOG.md
      - docs/compatibility.md
      - Cargo.toml
    evidence: []

  - id: US-SEMLITH-0.8.0-T07
    summary: >
      Measure the release: the before-and-after against a real 0.7.0 binary on a
      corpus of genuine documents, and the extraction-efficiency numbers.
    why_required: >
      The contract's evidence of value is comparative — "the same corpus under
      0.7.0 finds none of them" — and a comparison needs the older binary run,
      not remembered. The efficiency numbers are what distinguish "the file is
      read" from "the file is read usefully".
    status: todo
    depends_on:
      - US-SEMLITH-0.8.0-T05
    acceptance_criteria:
      - >
        Extraction efficiency, measured on the same files before and after: the
        share of a notebook's and an HTML page's extracted characters that are
        content rather than syntax, reported as two numbers per format.
      - >
        The existing suite passes unmodified: no test that shipped in 0.7.0 is
        edited to accommodate this release.
    files:
      - .ultraship/products/semlith/evidence/0.8.0/formats.sh
    evidence: []

  - id: US-SEMLITH-0.8.0-T08
    summary: >
      The release gates: fmt, clippy, the full suite including ignored
      integration tests, and a clean `cargo publish --dry-run`.
    why_required: >
      This release adds a dependency and a parser surface, which are the two
      things a packaging check catches and a unit test does not. Nothing ships
      until the gates are green on a clean tree.
    status: todo
    depends_on:
      - US-SEMLITH-0.8.0-T07
    acceptance_criteria:
      - >
        `cargo fmt --check`, `cargo clippy --all-targets --all-features -- -D
        warnings`, and the full test suite including the ignored integration tests
        are green.
      - >
        `cargo publish --dry-run` passes on a clean tree, and `cargo package
        --list` carries no `.env`, no `.ultraship` and no `.github`. The added
        dependency is a released crates.io version with a licence compatible with
        Apache-2.0, and it is named in the CHANGELOG.
    files:
      - Cargo.toml
    evidence: []
