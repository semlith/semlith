product: semlith
version: 0.5.0
tasks:
  - id: US-SEMLITH-0.5.0-T01
    summary: >
      Search several stores from one query: a repeatable `--store` on the read
      commands, a `SEMLITH_STORE` list, one query vector per distinct model
      computed outside the store and handed in, per-store rankings merged by the
      reciprocal-rank scores they already carry, and the store on every hit.
    why_required: >
      This is the release. Everything else either protects it from a way it
      looks right and is wrong, proves a number about it, or ships it.
    status: todo
    depends_on: []
    acceptance_criteria:
      - >
        One query over two stores holding disjoint corpora returns hits from
        both, each carrying the store it came from, in a single ranked list.
      - >
        A phrase that exists only in the second store is returned by a two-store
        query at the same rank it holds when that store is searched alone —
        adding a store does not bury the store that has the answer.
      - >
        `-k 5` over three stores returns five hits in total, not five per store.
    files:
      - src/fleet.rs
      - src/lib.rs
      - src/main.rs
    evidence: []

  - id: US-SEMLITH-0.5.0-T02
    summary: >
      Make a named store either a real store or an error: read commands refuse a
      path that is not already a store and create nothing, and the same store
      named twice — repeated, relative against absolute, through a symlink — is
      searched once.
    why_required: >
      Both failures are invisible in a multi-store query, which is what makes
      them worth their own task. A mistyped store today becomes an empty store
      that contributes nothing while the other stores still return hits, and a
      store fused with itself doubles every rank contribution it has and takes
      over the result list.
    status: todo
    depends_on: [US-SEMLITH-0.5.0-T01]
    acceptance_criteria:
      - >
        A `--store` path that does not exist exits non-zero naming the path, and
        no directory, `store.db` or `index.tv` is created anywhere as a result.
      - >
        Naming the same store twice — the flag repeated, and once by a relative
        and once by an absolute path — produces the same result list as naming it
        once, with no duplicated hits.
    files:
      - src/lib.rs
      - src/fleet.rs
      - tests/fleet.rs
    evidence: []

  - id: US-SEMLITH-0.5.0-T03
    summary: >
      Filters across every store, stores whose models differ searched together,
      and the measurement that decides whether fusion needs a relevance floor:
      does naming an unrelated store degrade a query the first store answered?
    why_required: >
      A filter that selects nothing in one store must not report an empty
      selection for the query as a whole, or the filter and the multi-store flag
      cannot be used together. Mixed models are the realistic state of a
      developer's stores, since the default model changed in 0.3.0. And the
      no-degradation measurement is the one that can send the fusion design
      back, so it belongs before the release is anywhere near finished.
    status: todo
    depends_on: [US-SEMLITH-0.5.0-T02]
    acceptance_criteria:
      - >
        `--ext`/`--path`/`--lang` filter every store, and a filter that matches
        files in only one of two stores returns that store's hits rather than
        reporting that no files match.
      - >
        Two stores built with different embedding models are searched in one
        query and both contribute hits, with each store's own model used to embed
        the query for it.
      - >
        A query answered well by one store is not degraded by also naming an
        unrelated store: the hits that a single-store search returns are still
        present, and still ranked above the unrelated store's best effort.
    files:
      - src/fleet.rs
      - tests/fleet.rs
    evidence: []

  - id: US-SEMLITH-0.5.0-T04
    summary: >
      Serve several stores from one MCP process: store labels in the tool
      results, an optional `store` argument that narrows a query, an unknown
      store name answered in-band with the stores that are open, and
      `semlith_stats` reporting each store.
    why_required: >
      The roadmap outcome is stated for an agent working across repositories.
      Multi-store search that only the CLI can reach delivers the release to the
      wrong caller — the same mistake 0.3.0's and 0.4.0's MCP tasks existed to
      prevent.
    status: todo
    depends_on: [US-SEMLITH-0.5.0-T03]
    acceptance_criteria:
      - >
        A single `semlith_search` call against a real `semlith mcp` child process
        opened on two stores returns excerpts from both with their store labels,
        driven over stdio JSON-RPC; the `store` argument restricts the same query
        to one of them; and an unknown store name comes back as an in-band tool
        error naming the stores that are open.
    files:
      - src/mcp.rs
      - src/main.rs
      - tests/fleet.rs
    evidence: []

  - id: US-SEMLITH-0.5.0-T05
    summary: >
      `stats` and `files` per store, and a store that `semlith watch` is holding
      the write lock on searchable inside a multi-store query, freshness
      included.
    why_required: >
      "Is this corpus even indexed" has to stay answerable per store, or an
      empty answer from a fleet is undiagnosable. And a multi-store search that
      takes a store lock, or that misses the generation counter on one of its
      stores, silently turns 0.4.0's freshness guarantee off for anyone using
      both features — which is the same developer.
    status: todo
    depends_on: [US-SEMLITH-0.5.0-T04]
    acceptance_criteria:
      - >
        `semlith stats` and `semlith files` over two stores report both, labelled,
        and a single-store invocation prints exactly what 0.4.0 printed.
      - >
        A store being watched by a running `semlith watch` is searchable as part
        of a multi-store query, and an edit the watcher re-embeds is returned by a
        subsequent multi-store search from a long-running reader with no restart.
    files:
      - src/main.rs
      - src/fleet.rs
      - tests/fleet.rs
    evidence: []

  - id: US-SEMLITH-0.5.0-T06
    summary: >
      Measure rather than assert: query embeds per search against distinct
      models, latency for one, two and three stores with the per-store
      increment, resident memory for a three-store reader, cross-version
      compatibility both ways, and the single-store paths unchanged.
    why_required: >
      "One embed per model" and "not three copies of the model" are exactly the
      claims that are true in the design and false in the code. 0.4.0 found a
      measurement bug that had already changed a default before any number was
      reported, so the numbers get their own task and print what they saw.
    status: todo
    depends_on: [US-SEMLITH-0.5.0-T05]
    acceptance_criteria:
      - >
        One search embeds the query once per distinct embedding model, not once
        per store — measured as a count, not asserted, over three same-model
        stores.
      - >
        Multi-store search latency is reported on the acceptance fixture for one,
        two and three stores, with the per-store increment stated, so the cost of
        adding a store is a number rather than a claim.
      - >
        Resident memory for a reader open on three same-model stores is reported
        and does not hold three copies of the model.
      - >
        No store schema change and no index format change: a store written by
        0.4.0 is searchable by 0.5.0 with no re-index, and a store written by
        0.5.0 is searchable by the 0.4.0 binary.
      - >
        Single-store behaviour is unchanged: `index`, `watch`, `search`, `stats`,
        `files`, `forget` and both MCP tools behave exactly as in 0.4.0 when one
        store is given, with the existing test suite passing unmodified.
    files:
      - tests/measure.rs
      - tests/roundtrip.rs
    evidence: []

  - id: US-SEMLITH-0.5.0-T07
    summary: >
      Document multi-store search where it will be read: the repeatable flag,
      the `SEMLITH_STORE` list, what a store label is, that writes stay
      single-store, an MCP server definition naming several stores, and the
      CHANGELOG 0.5.0 section.
    why_required: >
      The release workflow builds its notes from the CHANGELOG, so a missing
      section ships an empty release. And a feature whose flag is repeatable on
      some commands and not others is undiscoverable from `--help` alone.
    status: todo
    depends_on: [US-SEMLITH-0.5.0-T06]
    acceptance_criteria:
      - >
        README documents multi-store search: the repeatable flag, the
        `SEMLITH_STORE` list, what the store labels are, that writes stay
        single-store, and an MCP server definition naming several stores.
      - CHANGELOG has a 0.5.0 section, which is what the release workflow reads
        for its notes.
    files:
      - README.md
      - CHANGELOG.md
      - docs/architecture.md
    evidence: []

  - id: US-SEMLITH-0.5.0-T08
    summary: >
      Bump Cargo.toml to 0.5.0 and ship it: PR `feat/0.5.0` → develop, PR
      develop → main, CI green on both, tag v0.5.0 for the release workflow,
      inspect the packaged tarball, then publish to crates.io on an explicit
      go-ahead.
    why_required: >
      target_mode is published. A crates.io publish is permanent, so the dry run
      and the tarball inspection are the last gate before an irreversible
      action.
    status: todo
    depends_on: [US-SEMLITH-0.5.0-T07]
    acceptance_criteria:
      - CI green on develop and on main for the release commit, with every action
        still pinned to a full-length commit SHA.
      - >
        `cargo publish --dry-run` passes and the packaged tarball contains no
        `.env` and no `.ultraship` directory.
      - crates.io serves semlith 0.5.0 and `cargo install semlith` resolves to it.
      - >
        The tagged GitHub release carries the four platform archives and
        SHA256SUMS, all release-workflow jobs green.
      - >
        The release ships through the project's branch flow: `feat/0.5.0` →
        pull request to `develop` → pull request to `main` → tag.
    files:
      - Cargo.toml
      - .github/workflows/release.yml
    evidence: []
