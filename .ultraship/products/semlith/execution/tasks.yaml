product: semlith
version: 0.4.0
tasks:
  - id: US-SEMLITH-0.4.0-T01
    summary: >
      Add `semlith watch [paths]`: a `notify` watcher over the same roots
      `index` accepts, a debounce window that coalesces an event burst into one
      re-embed per file, the existing content-hash re-index path behind it, and
      the store lock held for the watcher's lifetime.
    why_required: >
      This is the release. Everything else either refines what this task
      produces or proves it. It is also the task that decides the shape of the
      lock story: a long-running holder is a behaviour change, and taking the
      lock for the process lifetime is what stops a concurrent `index` from
      writing rows the watcher's in-memory index then overwrites.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        With `semlith watch` running over a corpus, saving a new sentence into an
        indexed file makes a search for that sentence return that file's chunk,
        with no `index` run in between.
      - >
        While `watch` is running, `semlith index` against the same store exits
        non-zero with the existing lock error naming the watcher's pid, and the
        store is intact afterwards.
    files:
      - src/watch.rs
      - src/lib.rs
      - src/main.rs
      - Cargo.toml
    evidence:
      - "The watcher feeds the existing indexer rather than duplicating it:
         index_paths now takes the lock and delegates to index_walk, and
         index_changed re-indexes an explicit path set with no walk and no
         orphan sweep. Both share index_set, so the hash short-circuit, chunk
         eviction and the atomic index.tv write are one code path."
      - "Chosen: the store lock is held for the watcher's whole life. Semlith
         keeps its index in memory and save() writes all of it, so a second
         writer's rows would be overwritten from a stale copy. The refusal
         reuses the 0.2.0 lock error, which already names the holder."
      - "Chosen: an event is acted on only if the path is one walk() would have
         yielded, so ignore rules have one definition rather than two that must
         agree. Recorded as a ponytail comment with the upgrade path (a
         prebuilt gitignore matcher) if the per-batch walk ever costs."
      - "cargo test — 40 passed, 0 failed, including three new watch unit tests
         covering deleted-path canonicalization, a deletions-only batch needing
         no walk, and the store's own directory being inadmissible."
      - "cargo test --test watch -- --ignored — 2 passed, 0 failed: an edit
         becomes searchable with no index run, and indexing a watched store is
         refused by name."
      - "End-to-end through the release binary: watch started over a corpus,
         `semlith index` against the same store exited non-zero with 'is being
         indexed by pid 32108', a newly saved rust.md was returned by a search
         issued from a separate process, and deleting bread.md dropped it from
         `semlith files`."

  - id: US-SEMLITH-0.4.0-T02
    summary: >
      Classify events into what actually happened on disk: create, delete,
      rename, and the write-temp-then-rename save that arrives as remove
      followed by create. Re-embed, evict or move accordingly.
    why_required: >
      A watcher that treats every remove as "forget this file" evicts files the
      user just saved from Vim, and one that ignores creates never picks up a
      new file. This is the most likely way the release ships broken while
      passing a hand-written test, so it is its own task with its own evidence.
    status: done
    depends_on: [US-SEMLITH-0.4.0-T01]
    acceptance_criteria:
      - >
        A file created under a watched root becomes searchable, and a file
        deleted from disk stops appearing in results and is gone from
        `semlith files`.
      - >
        A file renamed on disk is searchable under its new path and no longer
        returned under its old one.
      - >
        An editor's atomic save (write to a temp file, rename over the original)
        is handled as an edit: the file remains indexed with its new contents,
        and is not left evicted by the intervening remove event.
    files:
      - src/watch.rs
      - tests/watch.rs
    evidence:
      - "Chosen: classify by what is on disk when the batch is indexed, not by
         the event kind. A path in the batch that exists is re-embedded; one
         that does not is evicted. Rename and atomic save then need no special
         case — both are one gone path and one present path — and the
         platform differences in how notify labels them stop mattering."
      - "cargo test --test watch -- --ignored — 5 passed, 0 failed: a new file
         reaches the store and a deleted one loses its vectors, a rename moves
         the file and leaves nothing under the old path, and a write-temp-then-
         rename save leaves the file indexed with its new contents while the
         editor's temp file is never indexed."
      - "Deletion is proven at both levels: gone from `all_paths`, and gone
         from search results rather than merely unlisted."

  - id: US-SEMLITH-0.4.0-T03
    summary: >
      Apply the same ignore rules the indexing walk uses (`.gitignore`, hidden
      files, the `.semlith` directory) to events, and prove the debounce and the
      content-hash short-circuit: a burst of saves costs one re-embed, an
      unchanged file costs none.
    why_required: >
      Without the ignore rules the watcher re-embeds its own store writes and
      every build artefact, which is a loop, not a feature. Without the
      hash short-circuit an editor that touches mtime on every keystroke pins a
      CPU core. Both turn "leave it running" into "do not leave it running".
    status: done
    depends_on: [US-SEMLITH-0.4.0-T02]
    acceptance_criteria:
      - >
        A path excluded by `.gitignore`, a hidden file, and anything inside the
        `.semlith` store directory itself produce no re-embed, verified by the
        watcher's own output over a burst of writes to such files.
      - >
        Ten rapid successive saves of one file inside the debounce window produce
        exactly one re-embed of that file, not ten.
      - >
        An event on a file whose contents are unchanged (`touch`) re-embeds
        nothing.
    files:
      - src/watch.rs
      - tests/watch.rs
    evidence:
      - "The watcher reports what it did through a Progress callback rather
         than printing from inside the library, so the CLI owns its output and
         a test can count re-embeds. That is what makes the debounce claim
         checkable instead of asserted."
      - "cargo test --test watch -- --ignored — 8 passed, 0 failed. Ten saves
         of one file inside a one-second window produced exactly 1 re-embed;
         three rewrites of a file with its own bytes produced 0; a gitignored
         path, a dotfile and a write into the store's own .semlith directory
         produced 0, with the store's file list confirming none of them was
         indexed."
      - "The ignore test puts the store inside the watched tree, which is the
         default `.semlith` layout — the loop where the watcher's own index
         write queues the next re-embed is only reachable that way."

  - id: US-SEMLITH-0.4.0-T04
    summary: >
      Make a long-running reader see what the watcher wrote: detect that
      `index.tv` changed and reload it before the next search, without
      discarding the loaded ONNX model, and wire it into the MCP server.
    why_required: >
      The roadmap outcome is stated for an agent. An agent connects once and
      keeps the server for the session, so without this the watcher keeps a
      store fresh that the agent never reads — the release would be delivered
      to the wrong caller, which is the same mistake 0.3.0's MCP task existed
      to prevent.
    status: done
    depends_on: [US-SEMLITH-0.4.0-T03]
    acceptance_criteria:
      - >
        An MCP server started before an edit returns the edited chunk on a search
        issued after the watcher re-embedded it, in the same server process,
        driven over real stdio JSON-RPC.
    files:
      - src/lib.rs
      - src/mcp.rs
    evidence:
      - "Answered the contract's open question: freshness is signalled by an
         `index_generation` counter in the store's meta table, bumped after the
         index.tv rename, not by mtime. Re-embedding one file can leave both
         the size and a second-granularity mtime unchanged, and a reader would
         then keep answering from vectors that no longer exist. Bumped after
         the rename, so a reader that sees the new generation is guaranteed to
         find the new index behind it, and read back from the store rather than
         incremented in memory so a writer that predates another writer's run
         cannot reuse a generation."
      - "search_filtered calls refresh() — one SQLite read when nothing has
         changed. mcp.rs needed no change at all: stats and the filter count
         read SQLite, which WAL already makes fresh across processes."
      - "cargo test --test watch -- --ignored — 9 passed, 0 failed, including a
         real `semlith mcp` child process driven over stdio JSON-RPC: it
         answers before the edit exists, the watcher indexes the edit, and the
         same process — no restart, no re-initialize — returns it."
      - "The test was proven to fail without the fix: with refresh() removed it
         reports 'the running server is still answering from the index it
         started with' and returns only the pre-edit file."
      - "Two false passes were found and fixed while proving it. The first
         query shared terms with the edited file, so FTS5 — which is fresh
         across processes for free — answered it and the dense half was never
         exercised; the query now shares no term with the file it must find.
         The second waited on `all_paths`, which lists a file as soon as its
         row is written, before its vectors are durable; it now waits on the
         vector count."

  - id: US-SEMLITH-0.4.0-T05
    summary: >
      Handle Ctrl-C and SIGTERM: finish or abandon the in-flight batch
      atomically, leave `index.tv` durable, leave no `index.tv.tmp`, and leave
      no file recorded with the PENDING hash that is not re-indexed next run.
    why_required: >
      A watcher is killed every single day — that is how a foreground process
      ends. If the ordinary exit path can corrupt a store or strand a file at
      the PENDING sentinel, the release makes stores less trustworthy than not
      running it at all.
    status: todo
    depends_on: [US-SEMLITH-0.4.0-T04]
    acceptance_criteria:
      - >
        Ctrl-C during idle and Ctrl-C during an in-flight re-embed both exit
        without leaving `index.tv.tmp` behind, and a store reopened afterwards
        reports a chunk count consistent with its index — with any file left
        mid-flight re-indexed on the next run rather than silently half-present.
    files:
      - src/watch.rs
      - tests/watch.rs
    evidence: []

  - id: US-SEMLITH-0.4.0-T06
    summary: >
      Measure the contract's non-functional numbers rather than asserting them:
      idle CPU over 60 seconds, edit-to-searchable latency, index writes per
      debounce window and their cost, memory across at least 100 events, plus
      cross-version store compatibility and that the non-watch paths are
      untouched.
    why_required: >
      "Event-driven, not polling" and "does not grow across events" are exactly
      the claims that are true in design and false in code. Claiming them
      unmeasured is the manufactured completion the framework exists to
      prevent, and 0.3.0 already showed that a measurement can come back
      inconclusive and have to be reported as such.
    status: todo
    depends_on: [US-SEMLITH-0.4.0-T05]
    acceptance_criteria:
      - >
        An idle watcher over a repository-scale tree consumes no measurable CPU
        over a 60-second idle window (event-driven, not polling), measured and
        reported as a number rather than asserted.
      - >
        A single-file edit is searchable within 5 seconds of the save on the
        acceptance fixture with the model already warm, measured end to end from
        file write to the hit appearing in a search.
      - >
        Watching does not rewrite `index.tv` more than once per debounce window,
        so a burst of saves costs one index write; the per-write cost on the
        acceptance fixture is reported.
      - >
        Resident memory of an idle watcher is bounded and reported; it holds one
        loaded model and does not grow across at least 100 successive edit events.
      - >
        No store schema change. A 0.3.0 store is watchable without re-indexing,
        and a store written by 0.4.0 opens and searches under 0.3.0.
      - >
        The non-watch code paths are unchanged: `index`, `search`, `stats`,
        `files`, `forget` and the MCP tools behave exactly as in 0.3.0 for a
        store nobody is watching, with the existing test suite passing unmodified.
    files:
      - tests/watch.rs
      - tests/roundtrip.rs
    evidence: []

  - id: US-SEMLITH-0.4.0-T07
    summary: >
      Document `watch` in the README — what it catches, what it does not
      (events missed while it was down, network filesystems), that it holds the
      store lock, and how freshness reaches a running MCP server — and add the
      CHANGELOG 0.4.0 section.
    why_required: >
      The release workflow builds its notes from the CHANGELOG, so a missing
      section ships an empty release. The limits are the documentation that
      matters most here: a watcher that silently missed the hour it was not
      running is indistinguishable from one that is broken.
    status: todo
    depends_on: [US-SEMLITH-0.4.0-T06]
    acceptance_criteria:
      - >
        README documents `semlith watch`, what it does not catch (events missed
        while it was down, network filesystems), that it holds the store lock,
        and how freshness reaches a running MCP server.
      - CHANGELOG has a 0.4.0 section, which is what the release workflow reads
        for its notes.
    files:
      - README.md
      - CHANGELOG.md
      - docs/architecture.md
    evidence: []

  - id: US-SEMLITH-0.4.0-T08
    summary: >
      Bump Cargo.toml to 0.4.0 and ship it through the branch flow: PR
      `feat/0.4.0` → develop, PR develop → main, CI green on both, tag v0.4.0
      for the release workflow, verify the packaged tarball, then publish to
      crates.io.
    why_required: >
      target_mode is published. A crates.io publish is permanent, so the dry run
      and the tarball inspection are the last gate before an irreversible
      action. 0.3.0 shipped straight from main and recorded that as a
      limitation; doing it properly is an acceptance criterion this time.
    status: todo
    depends_on: [US-SEMLITH-0.4.0-T07]
    acceptance_criteria:
      - CI green on develop and on main for the release commit, with every action
        still pinned to a full-length commit SHA.
      - >
        `cargo publish --dry-run` passes and the packaged tarball contains no
        `.env` and no `.ultraship` directory.
      - crates.io serves semlith 0.4.0 and `cargo install semlith` resolves to it.
      - >
        The tagged GitHub release carries the four platform archives and
        SHA256SUMS, all release-workflow jobs green.
      - >
        The release ships through the project's branch flow: `feat/0.4.0` →
        pull request to `develop` → pull request to `main` → tag, which 0.3.0
        did not do and recorded as a limitation.
    files:
      - Cargo.toml
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
    evidence: []
