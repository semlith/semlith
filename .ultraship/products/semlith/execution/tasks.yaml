product: semlith
version: 0.3.0
tasks:
  - id: US-SEMLITH-0.3.0-T01
    summary: >
      Add a Filter type carrying repeatable path globs, and one id-selection
      query that resolves it to the set of chunk ids under matching files,
      anchoring a non-absolute glob as `*/<pattern>` against the canonical
      stored path.
    why_required: >
      Both halves of the hybrid search must be constrained by the same subset.
      If the dense allowlist and the FTS5 predicate are derived independently
      they can drift, and fusion would then rank a chunk one half was never
      allowed to see. One function producing one id set is what prevents that,
      so nothing else in the release can be built until it exists.
    status: todo
    depends_on: []
    acceptance_criteria:
      - >
        A non-absolute glob matches regardless of the directory the search is run
        from, and an absolute glob matches only the paths it literally covers.
    files:
      - src/filter.rs
      - src/store.rs
      - src/lib.rs
    evidence: []

  - id: US-SEMLITH-0.3.0-T02
    summary: >
      Restrict both halves of the search to the selected subset: the dense half
      via IdMapIndex::search_with_allowlist, the keyword half via the same path
      predicate inside the FTS5 query, fused as before.
    why_required: >
      This is the release. Post-filtering a global top-k returns fewer than k
      hits whenever the subset is a minority of the corpus, which is the case
      the feature exists for. Filtering before the top-k is computed is the
      difference between a useful scoped search and a broken one.
    status: todo
    depends_on: [US-SEMLITH-0.3.0-T01]
    acceptance_criteria:
      - >
        A scoped search returns k hits when the subset holds at least k chunks,
        where a post-filtered global top-k would return fewer. Proven on a store
        where the subset is a small minority of chunks.
    files:
      - src/lib.rs
      - src/store.rs
    evidence: []

  - id: US-SEMLITH-0.3.0-T03
    summary: >
      Expose the path filter on the CLI as a repeatable `--path <glob>` on
      `semlith search`, reporting how many files the filter selected and
      distinguishing an empty selection from an empty result set.
    why_required: >
      The engine is unreachable without it, and this task alone completes the
      contract's fallback scope — a coherent release on its own if the rest
      runs short. The empty-selection message is what stops a typo in a glob
      from reading as "the corpus does not contain this".
    status: todo
    depends_on: [US-SEMLITH-0.3.0-T02]
    acceptance_criteria:
      - >
        `semlith search <q> --path '<subdir>/**'` returns only hits whose path
        matches the glob, on a store containing files both inside and outside it.
      - >
        A filter that matches no indexed file exits 0 with an explicit
        "no files match the filter" message on stderr, distinct from
        "no matches", and `--json` emits `[]`.
    files:
      - src/main.rs
    evidence: []

  - id: US-SEMLITH-0.3.0-T04
    summary: >
      Add `--ext` and `--lang` as sugar over the same id-selection query, a
      built-in extension-to-language map, and `semlith languages` to print it.
      Unions within a kind, intersects across kinds.
    why_required: >
      The roadmap outcome names extension and language alongside path. `--ext rs`
      expressed as a glob is `--path '*.rs'`, which an agent will not reliably
      construct, and `--lang rust` is the form an agent actually reaches for.
      Without the printable map, an unknown language name is a silent miss.
    status: todo
    depends_on: [US-SEMLITH-0.3.0-T03]
    acceptance_criteria:
      - >
        `--ext rs` and `--lang rust` select the same chunk set on a corpus whose
        only Rust files end in `.rs`, and `--lang` accepts an unknown name with a
        clear error naming `semlith languages` rather than silently matching
        nothing.
      - >
        Repeating a flag unions: `--ext rs --ext toml` returns hits from both, and
        `--path 'src/**' --ext md` intersects across kinds — a Markdown file under
        src matches, a Markdown file elsewhere does not.
    files:
      - src/filter.rs
      - src/main.rs
    evidence: []

  - id: US-SEMLITH-0.3.0-T05
    summary: >
      Give the `semlith_search` MCP tool optional `path`, `ext` and `lang` array
      arguments with the same meaning, described in the tool schema well enough
      that an agent knows both when to scope and when not to.
    why_required: >
      The outcome is stated for an agent, not a human: "so an agent can ask
      about one subsystem instead of everything". Shipping the filters on the
      CLI alone delivers the feature to the wrong caller.
    status: todo
    depends_on: [US-SEMLITH-0.3.0-T04]
    acceptance_criteria:
      - >
        The `semlith_search` MCP tool accepts `path`, `ext` and `lang` arrays and
        returns the same hits as the equivalent CLI invocation, and omitting them
        searches the whole store exactly as 0.2.0 did.
    files:
      - src/mcp.rs
    evidence: []

  - id: US-SEMLITH-0.3.0-T06
    summary: >
      Measure the filter path against the contract's numbers: unfiltered latency
      on a 100k-chunk store versus 0.2.0, scoped latency on a subset of at
      least 100 chunks, rank behaviour on the evaluation set, and that a 0.2.0
      store filters without re-indexing.
    why_required: >
      Two named risks are unmeasured guesses until this runs: the per-query
      Vec<bool> the size of the whole index, and the crossover where a very
      large allowlist costs more than an unfiltered search. Claiming the
      non-functional criteria without the measurement is exactly the
      manufactured completion the framework exists to prevent.
    status: todo
    depends_on: [US-SEMLITH-0.3.0-T05]
    acceptance_criteria:
      - >
        An unfiltered search on a 100k-chunk store is no slower than 0.2.0 on the
        same store and machine, within 10 percent — the filter path must not tax
        the common case.
      - >
        A scoped search over a subset of at least 100 chunks completes in under
        250 ms on the recorded benchmark corpus, model already warm.
      - >
        Retrieval quality improves where it should: on the recorded evaluation
        set, restricting a query to the subsystem holding its answer does not
        lower that answer's rank against the unfiltered search.
      - >
        No store schema change. A 0.2.0 store opens, searches and filters without
        re-indexing, and a 0.3.0 store is readable by 0.2.0.
    files:
      - tests/roundtrip.rs
    evidence: []

  - id: US-SEMLITH-0.3.0-T07
    summary: >
      Document the three filters in the README — including the `*/` anchoring
      rule and that GLOB `*` crosses `/` — and add the CHANGELOG 0.3.0 section
      the release workflow reads for its notes.
    why_required: >
      The release workflow builds its notes from the CHANGELOG, so a missing
      section ships an empty release. The GLOB semantics are deliberate and
      surprising; undocumented, every `src/*` that behaves like `src/**` reads
      as a bug report.
    status: todo
    depends_on: [US-SEMLITH-0.3.0-T06]
    acceptance_criteria:
      - >
        README documents the three filters, the `*/` anchoring rule and the fact
        that GLOB `*` crosses `/`.
      - >
        CHANGELOG has a 0.3.0 section, which is what the release workflow reads
        for its notes.
    files:
      - README.md
      - CHANGELOG.md
    evidence: []

  - id: US-SEMLITH-0.3.0-T08
    summary: >
      Bump Cargo.toml to 0.3.0, get CI green on develop and on main, tag v0.3.0
      so the release workflow builds and publishes the archives, then verify the
      packaged tarball and publish to crates.io.
    why_required: >
      target_mode is published. A crates.io publish is permanent, so the dry
      run and the tarball inspection are the last gate before an irreversible
      action, and the tag guard added in 0.2.0 fails the build if the tag and
      Cargo.toml disagree.
    status: todo
    depends_on: [US-SEMLITH-0.3.0-T07]
    acceptance_criteria:
      - CI green on develop and on main for the release commit.
      - >
        `cargo publish --dry-run` passes and the packaged tarball contains no
        `.env` and no `.ultraship` directory.
      - crates.io serves semlith 0.3.0 and `cargo install semlith` resolves to it.
      - >
        The tagged GitHub release carries the four platform archives and
        SHA256SUMS, all release-workflow jobs green.
    files:
      - Cargo.toml
    evidence: []
