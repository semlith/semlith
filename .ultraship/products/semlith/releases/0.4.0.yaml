product: semlith
version: 0.4.0
status: released
release_type: minor

outcome:
  user_can: >
    Leave `semlith watch` running over a repository and keep working: a file
    saved in an editor is re-embedded within seconds, a new file is picked up,
    a deleted file drops out of results — and an agent already connected to
    that store over MCP sees the change on its next search, without anyone
    re-running `semlith index` and without restarting the agent's server.
  business_value: >
    Today a store is a snapshot of the moment `index` last ran. The developer
    it serves is editing the same code all day, so the store is wrong within
    minutes of being built, and an agent confidently answers from the version
    of a function that no longer exists. Re-running `index` by hand is not the
    fix — the developer has to notice the staleness first, which is exactly
    what they cannot do from the agent's answers. Making freshness automatic
    is what turns semlith from a thing you index into a thing you leave on.
  evidence_of_value: >
    On a store being watched, a search for text that exists only in an edit
    made seconds earlier returns that chunk — issued through a long-running MCP
    server that was started before the edit, with no `index` run and no server
    restart in between.

scope:
  included:
    - >
      `semlith watch [paths]`: a long-running, event-driven watcher over the
      same roots `index` accepts, honouring the same `.gitignore`/hidden-file
      walk rules so a watched tree and an indexed tree are the same set of
      files.
    - >
      Native filesystem events via the `notify` crate (FSEvents, inotify,
      ReadDirectoryChangesW) rather than a polling rescan, so an idle watcher
      costs nothing and a large repository is not re-hashed on a timer.
    - >
      A debounce window that coalesces the burst of events one editor save
      produces into a single re-embed of that file, and that handles the
      write-temp-then-rename save pattern (which arrives as create/remove, not
      modify) as an edit rather than as a delete.
    - >
      Incremental re-embedding through the existing content-hash path, so an
      event on a file whose bytes did not change costs a hash and nothing more.
    - >
      Deletions and renames: a file removed from disk has its chunks and
      vectors evicted; a renamed file is indexed under its new path and dropped
      from the old one.
    - >
      The store's single-writer rule extended honestly to a long-running
      process: `watch` holds the store lock for its lifetime, so a concurrent
      `semlith index` exits non-zero naming the watcher rather than silently
      interleaving writes into a store the watcher then overwrites from memory.
    - >
      Freshness for readers: a running `semlith mcp` server and any in-process
      reader picks up vectors written by the watcher — detected from `index.tv`
      changing on disk and reloaded before the next search — so an agent's
      answers track the working tree without a restart.
    - >
      Clean shutdown on Ctrl-C/SIGTERM: the in-flight batch is finished or
      abandoned atomically, `index.tv` is left durable, no `.tv.tmp` is left
      behind, and no file is left recorded with the PENDING hash.
    - >
      Per-event stderr output naming the file and what happened, quiet enough
      to leave in a terminal all day and loud enough to prove it is working.
    - README section, CHANGELOG 0.4.0 section, and MCP documentation of the
      freshness behaviour.
    - Publication to crates.io and a tagged GitHub release with binaries.
  excluded:
    - >
      Installing the watcher as a background service (launchd, systemd, Windows
      service). It is a foreground process the developer starts.
    - >
      Watching several stores from one process, or watching a store whose roots
      are not on a local filesystem — network mounts do not deliver reliable
      events and are not supported.
    - >
      Folding the watcher into the MCP server (`semlith mcp --watch`) as one
      process. The reader half of that story is in scope; running both in one
      process is not.
    - >
      A rescan/reconcile pass to catch events missed while the watcher was down
      or while the event queue overflowed. Documented instead: run `index` once
      after starting, which is already incremental.
    - Any change to the store schema, to `index.tv`, or to how chunks are cut.
    - Configuration files. The debounce window is a flag with a default.
    - Watching for changes in embedding model or store settings.
  fallback_scope:
    - >
      `semlith watch [paths]` alone: event-driven re-embed on save, create,
      delete and rename, with the lock held for its lifetime and clean
      shutdown. Readers pick up changes when they next open the store, so an
      already-running MCP server needs a restart — recorded as a known
      limitation rather than left as a surprise. Still coherent: a developer
      stops re-running `index` by hand, which is the roadmap outcome.

acceptance:
  functional:
    - >
      With `semlith watch` running over a corpus, saving a new sentence into an
      indexed file makes a search for that sentence return that file's chunk,
      with no `index` run in between.
    - >
      A file created under a watched root becomes searchable, and a file
      deleted from disk stops appearing in results and is gone from
      `semlith files`.
    - >
      A file renamed on disk is searchable under its new path and no longer
      returned under its old one.
    - >
      An editor's atomic save (write to a temp file, rename over the original)
      is handled as an edit: the file remains indexed with its new contents,
      and is not left evicted by the intervening remove event.
    - >
      A path excluded by `.gitignore`, a hidden file, and anything inside the
      `.semlith` store directory itself produce no re-embed, verified by the
      watcher's own output over a burst of writes to such files.
    - >
      Ten rapid successive saves of one file inside the debounce window produce
      exactly one re-embed of that file, not ten.
    - >
      An event on a file whose contents are unchanged (`touch`) re-embeds
      nothing.
    - >
      While `watch` is running, `semlith index` against the same store exits
      non-zero with the existing lock error naming the watcher's pid, and the
      store is intact afterwards.
    - >
      An MCP server started before an edit returns the edited chunk on a search
      issued after the watcher re-embedded it, in the same server process,
      driven over real stdio JSON-RPC.
    - >
      Ctrl-C during idle and Ctrl-C during an in-flight re-embed both exit
      without leaving `index.tv.tmp` behind, and a store reopened afterwards
      reports a chunk count consistent with its index — with any file left
      mid-flight re-indexed on the next run rather than silently half-present.
  non_functional:
    - >
      An idle watcher over a repository-scale tree consumes no measurable CPU
      over a 60-second idle window (event-driven, not polling), measured and
      reported as a number rather than asserted.
    - >
      A single-file edit is searchable within 5 seconds of the save on the
      acceptance fixture with the model already warm, measured end to end from
      file write to the hit appearing in a search.
    - >
      Watching does not rewrite `index.tv` more than once per debounce window,
      so a burst of saves costs one index write; the per-write cost on the
      acceptance fixture is reported.
    - >
      Resident memory of an idle watcher is bounded and reported; it holds one
      loaded model and does not grow across at least 100 successive edit events.
    - >
      No store schema change. A 0.3.0 store is watchable without re-indexing,
      and a store written by 0.4.0 opens and searches under 0.3.0.
    - >
      The non-watch code paths are unchanged: `index`, `search`, `stats`,
      `files`, `forget` and the MCP tools behave exactly as in 0.3.0 for a
      store nobody is watching, with the existing test suite passing unmodified.
  operational:
    - CI green on develop and on main for the release commit, with every action
      still pinned to a full-length commit SHA.
    - >
      README documents `semlith watch`, what it does not catch (events missed
      while it was down, network filesystems), that it holds the store lock,
      and how freshness reaches a running MCP server.
    - CHANGELOG has a 0.4.0 section, which is what the release workflow reads
      for its notes.
    - >
      `cargo publish --dry-run` passes and the packaged tarball contains no
      `.env` and no `.ultraship` directory.
    - crates.io serves semlith 0.4.0 and `cargo install semlith` resolves to it.
    - >
      The tagged GitHub release carries the four platform archives and
      SHA256SUMS, all release-workflow jobs green.
    - >
      The release ships through the project's branch flow: `feat/0.4.0` →
      pull request to `develop` → pull request to `main` → tag, which 0.3.0
      did not do and recorded as a limitation.

delivery:
  target_mode: published
  environment: >
    A developer workstation. Distributed via crates.io and prebuilt archives on
    GitHub Releases; there is no server to deploy to.
  deployment_method: >
    Merge to main, push the `v0.4.0` tag to trigger the release workflow, which
    verifies the tag against Cargo.toml, builds four platform archives and
    publishes the GitHub release. `cargo publish` is a deliberate manual step
    after the tagged release, never from CI.
  migrations:
    - >
      None. The watcher writes through the same chunk/file/vector path `index`
      already uses. No new table, no new column, no `index.tv` format change.
  observability:
    - >
      The watcher prints one line per acted-upon event to stderr — path, what
      happened, chunks re-embedded, elapsed — so a store that has quietly
      stopped updating is visible without a separate health check.
    - >
      Watcher startup states the roots it is watching and how many files they
      cover, so a mistyped root is caught at the start rather than by an
      absence of events an hour later.
    - >
      Backend errors (inotify watch-limit exhaustion, an unreadable root) are
      reported on stderr and are not swallowed into a watcher that is running
      but no longer watching anything.
  rollback: >
    A crates.io publish is permanent. Rollback is `cargo yank 0.4.0` plus a
    0.4.1 fix; 0.3.0 stays installable and is unaffected, since no store
    written by 0.4.0 is unreadable by it. The GitHub release can be deleted
    outright. Because `watch` is a new command and the existing commands are
    unchanged, a user's rollback path is simply not running it.

dependencies:
  products: []
  services:
    - crates.io — publish token must be present locally.
    - GitHub Actions — release workflow builds the platform archives.
  human_approvals:
    - >
      Explicit go-ahead before `cargo publish`, since it cannot be undone.
    - >
      Adding `notify` as a runtime dependency: the first new dependency since
      0.1.0 and one that pulls in a platform backend per OS, so it is the
      user's call, not an implementation detail.

resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
    - >
      Filesystem event semantics differ per platform and per editor. Proving
      the atomic-save case, the rename case and the debounce case needs a real
      editor-shaped test harness, not a unit test that calls the handler
      directly.
    - >
      The freshness path for a running MCP server: detecting that `index.tv`
      changed and reloading it without tearing down the server's warm model,
      and proving it over real stdio JSON-RPC rather than in-process.
    - >
      Measuring the non-functional criteria honestly — idle CPU, edit-to-
      searchable latency, memory across many events — which is measurement
      work, not implementation work.
  preferred_tools:
    - cargo test for unit coverage of debounce and event classification.
    - >
      A test that writes real files on a real filesystem and waits for real
      events; an event pipeline mocked at the boundary proves nothing about
      the backends this release exists to use.
    - >
      The release binary and a real stdio MCP server for the end-to-end
      acceptance criteria, as in 0.2.0 and 0.3.0.
  constraints:
    - >
      One writer per store is a product-level constraint. A long-running
      watcher makes the lock's blast radius bigger — it is now held for hours,
      not seconds — so the lock error has to read as an explanation, not a
      failure.
    - >
      `Semlith` holds `IdMapIndex` in memory and `save()` writes the whole
      index. Two processes holding the same store in memory means the last
      `save()` wins; only one process may write.
    - >
      Reloading the index in a reader must not discard the loaded ONNX model —
      re-warming it costs a second or more and would land on an agent's query.
    - >
      Linux inotify has a per-user watch limit that a large tree can exhaust.
      Local only, single machine, single user, no network at query time —
      unchanged by this release.

risks:
  - >
    `notify` is the first new runtime dependency since 0.1.0 and brings a
    different backend per platform. CI runs Ubuntu and macOS; the Windows
    backend would ship unexercised, exactly as the Windows path-separator
    branch did in 0.3.0. Either it gets a test that runs on Windows in CI or
    the gap is recorded as a known limitation before release, not after.
  - >
    Editors do not emit the events a naive implementation expects. Vim writes a
    temp file and renames it over the target; that arrives as remove-then-
    create, and a watcher that treats remove as "forget this file" will evict
    a file the user just saved. This is the single most likely way the release
    ships broken while passing a hand-written test.
  - >
    Holding the store lock for the watcher's lifetime means a developer with
    `watch` running in one terminal cannot `index` in another. That is correct
    — the alternative is two processes overwriting each other's `index.tv` —
    but it is a behaviour change for anyone who scripted `index`, and the error
    message is what decides whether it reads as a bug.
  - >
    A reader that reloads `index.tv` when it changes can read the file
    mid-write. The existing write is temp-file-plus-rename, which makes the
    swap atomic, but the reader must key off something that changes only after
    the rename, or an agent's search will hit a truncated index.
  - >
    Rewriting the whole `index.tv` on every debounce window is O(store) work
    per edit. On a repository-scale store that could turn one keystroke-save
    into a multi-megabyte write every few seconds. If the measurement says so,
    the mitigation is a minimum interval between index writes, and that choice
    belongs in this release rather than as a 0.4.1 emergency.
  - >
    An event storm — a `git checkout` of a large branch, a build directory that
    is not gitignored — can queue thousands of files. The watcher must stay
    responsive and bounded rather than embedding for ten minutes with no
    output, and must not lose events it has already accepted.
  - >
    The `watch` process keeps the ONNX model resident for its whole life.
    Leaving it running all day is the point of the release, so its idle
    footprint is a feature-level property, not an implementation detail.

open_questions:
  - >
    Debounce window default. Long enough to coalesce an editor's save burst and
    a formatter's rewrite, short enough that the edit is searchable while the
    developer still cares. Starting hypothesis: 500 ms, settled by measurement
    against the 5-second criterion during development.
  - >
    How a reader detects that `index.tv` changed: mtime, size, or a generation
    counter in the store's meta table. mtime is free but has filesystem
    granularity; a meta counter is exact but is a write the reader must not
    miss. Decide during development, favouring whichever cannot show a reader
    a torn index.
  - >
    Whether `watch` should perform a full `index` pass at startup before
    watching. It closes the "changes made while the watcher was down" gap for
    free, but makes `watch` on a cold store a long silent wait. Leaning: yes,
    with the same per-file output `index` prints, so it is a visible catch-up
    rather than a hang.
  - >
    Whether an event storm should fall back to a single batched pass rather
    than per-file re-embeds. Deferred to the measurement in development.

released_at: 2026-07-29T18:30:54Z
mode: published
delivered: >
  A developer leaves `semlith watch` running over a repository and keeps
  working: a saved file is re-embedded about a second later, a new file is
  picked up, a deleted file loses its vectors, and a rename moves the file
  rather than duplicating it — with no `index` run. An agent already connected
  to that store over MCP sees the change on its next search, because the store
  counts index rewrites and a search reloads the vector index when the count
  has moved.
evidence:
  tests:
    - "cargo test — 40 passed, 0 failed, including three new watcher unit tests
       (deleted-path canonicalization, a deletions-only batch needing no walk,
       and the store's own directory being inadmissible)"
    - "cargo test --test watch -- --ignored — 10 passed, 0 failed: an edit
       searchable with no index run; create and delete; rename; write-temp-
       then-rename save; ten saves costing one re-embed; unchanged contents
       costing none; gitignored, hidden and store-internal paths costing none;
       `index` refused by pid while watching; a real `semlith mcp` child
       process seeing an edit without restart; Ctrl-C idle and mid-embed"
    - "cargo test --test roundtrip -- --ignored — 2 passed, 0 failed,
       unmodified from 0.3.0"
    - "cargo test --test measure -- --ignored, 1000-file corpus, M1: idle CPU
       0.00s over a 60-second window; edit to searchable 1.04s against the 5s
       budget; a ten-save burst costing exactly 1 index write; RSS 13 MB idle
       and lower after 100 successive edits than before them"
    - "Cross-version through both release binaries: a 0.3.0 store watched by
       0.4.0 reported '0 indexed at startup, 2 unchanged' — no re-index — and
       0.3.0 then read, searched and indexed the store 0.4.0 had written"
  builds:
    - "cargo fmt --all -- --check — clean"
    - "cargo clippy --all-targets -- -D warnings — exit 0"
    - "cargo publish --dry-run — passed; 27 files, 321.2 KiB, verified to hold
       no .env and no .ultraship before upload"
    - "CI green on develop (PR #9) and on main (release commit 1eff5af), both
       ubuntu-latest and macos-latest, plus CodeQL"
    - "release.yml — 6 of 6 jobs green: verify, four platform builds, release"
  reviews:
    - "Self-review of the diff found and fixed one defect before release:
       refresh() advanced the cached index generation before loading the new
       index, so a failed reload left a reader stuck on a stale index forever
       instead of retrying on its next search. Now recorded after a successful
       load, still from the value read before it, so a write landing mid-load
       is not skipped either."
    - "Two false passes in the freshness test were found and fixed while
       proving it, not after. The first query shared terms with the edited
       file, so FTS5 — fresh across processes for free — answered it and the
       vector index was never exercised. The second waited on the file list,
       which lists a file before its vectors are durable. With both fixed, the
       test was confirmed to fail when refresh() is removed."
    - "A measurement bug was caught before any number was published: the first
       run reported a burst costing 2 index writes because the baseline was
       taken before the previous phase had settled. The debounce default had
       been raised to 1s on the strength of that number; with the methodology
       fixed, 500 ms and 1s both cost one write, so the change was reverted."
  deployments:
    - "GitHub release 'Semlith 0.4.0', not a draft, carrying
       aarch64-apple-darwin, aarch64-unknown-linux-gnu, x86_64-unknown-linux-gnu,
       x86_64-pc-windows-msvc and SHA256SUMS"
    - "crates.io reports semlith max_version 0.4.0, rust_version 1.89, not
       yanked, uploaded 2026-07-29T18:30:54Z, 101020 bytes"
    - "Shipped through the branch flow 0.3.0 skipped: feat/0.4.0 → PR #9 →
       develop → PR #10 → main → tag v0.4.0"
  health_checks:
    - "Post-publication smoke test against the downloaded release archive, not
       a local build: shasum -a 256 -c SHA256SUMS OK, ./semlith --version
       reports 'semlith 0.4.0', the watcher indexed a corpus and re-embedded a
       newly saved file, a search from a separate process returned it,
       `semlith index` against the watched store was refused naming pid 17233,
       and Ctrl-C exited 0 leaving index.tv with no index.tv.tmp beside it"
    - "cargo install semlith --version 0.4.0 --locked from crates.io on a clean
       root: installed, reports 'semlith 0.4.0', and `semlith watch --help`
       shows the command with its 500 ms debounce default"
known_limitations:
  - >
    The Windows `notify` backend has never run. CI is Ubuntu and macOS only, so
    the platform that gets an archive built for it is the one platform whose
    filesystem-event path is unexercised — the same gap 0.3.0 recorded for its
    Windows path-separator branch, now covering a whole feature.
  - >
    Ctrl-C is not clean on Windows. The signal handler is Unix-only, because
    Windows console handlers are a different mechanism, so an interrupted
    watcher there can leave a file to be re-indexed on the next run and can
    strand an index.tv.tmp until the next indexing pass clears it.
  - >
    A watcher only sees what happens while it runs. Changes made while it was
    down are caught by its next startup pass, not reconstructed, and there is
    no reconcile for events lost to a backend queue overflow — a `git checkout`
    of a very large branch during a busy moment is the realistic case.
  - >
    `watch` holds the store's write lock for its whole life, so `semlith index`
    against that store is refused for as long as it runs. Correct, and a
    behaviour change for anyone who scripted `index`.
  - >
    Every batch that changes anything rewrites the whole index.tv. Measured at
    202 KB for a 1000-file corpus, which is nothing; on a 100k-chunk store it
    is a multi-megabyte write per edit, and that crossover was not measured.
    The same untested-at-scale caveat 0.3.0 recorded for filtering applies
    here.
  - >
    Each batch walks the watched tree to decide which event paths the indexer
    would have accepted. That keeps one definition of "which files count"
    instead of two, at the cost of a directory walk per batch, unmeasured on a
    tree with hundreds of thousands of entries.
  - >
    Network filesystems are unsupported: they do not deliver reliable events.
    Nothing detects that a root is on one, so the failure mode is a watcher
    that runs and silently sees nothing.
  - >
    A reader picks up new vectors only when it searches. `semlith stats` over a
    long-lived library handle still reports the vector count from when the
    process opened the store.
supersedes: "0.3.0"
next_recommended_version: "0.5.0"
immutable: true
