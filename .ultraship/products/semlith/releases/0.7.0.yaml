product: semlith
version: 0.7.0
status: planned
release_type: minor

outcome:
  user_can: >
    Point semlith at a corpus far larger than one repository — a notes archive,
    a monorepo, several repositories indexed into one store — and watch the
    first index tell them where it is: how many files of how many, how fast, and
    roughly how much is left. Interrupt it — Ctrl-C, a closed laptop, a crash —
    and re-run the same command: it continues from its last checkpoint instead
    of re-embedding everything, and it says how many files it skipped because
    they were already done. Search that store on the machine they own rather
    than the machine they wish they owned: the resident cost of searching is
    bounded by a budget they can read and change, not by how large the corpus
    grew. And keep every store they already have: a store written by 0.6.0 or
    earlier opens, searches and indexes exactly as it does today, unmigrated and
    unrewritten.
  business_value: >
    semlith's whole claim is that an agent asks a local store instead of reading
    whole files, and the corpora that make that claim valuable are the large
    ones: the monorepo, the decade of notes, the four repositories an agent works
    across. Two things in 0.6.0 fail exactly there, and both fail quietly.

    The first is that a long index run is all-or-nothing. File hashes are
    committed in one transaction after `index.tv` is written, and `index.tv` is
    written once at the end of the run — so a run killed at 95% leaves a store
    with chunks, no vectors, and no committed hashes, and the next run starts
    from zero. The code says so itself: `src/lib.rs` carries a `ponytail:` note
    reading "a crash mid-run re-indexes the whole batch; add periodic
    checkpointing when someone indexes a corpus big enough to care". A corpus big
    enough to care is what this release is for. An hours-long wait that a
    stray Ctrl-C throws away is not a wait a developer takes twice; they index
    less, and then the answers are worse.

    The second is that resident memory grows with the corpus and there is no
    ceiling anywhere. Opening a store loads the whole quantized index into a
    `Vec<u8>`, and turbovec's `prepare()` builds a second, repacked copy of those
    same codes for its SIMD kernel — so a store costs roughly two copies of its
    packed codes plus an eight-byte slot table and a `HashMap` entry per chunk,
    resident, before a single query is answered. It is paid on open, not on
    search, so `semlith stats` and `semlith files` pay it in full, and an MCP
    server holding four stores open for an agent pays it four times over while
    idle. turbovec 0.9.0 offers no memory-mapped or borrowed-slice loader, so the
    bound cannot come from mapping the file; it has to come from holding less at
    once. Sharding the index and searching it under a resident budget is what
    makes a corpus bigger than RAM a corpus semlith can serve — and it makes two
    other things cheap on the way: a save after one changed file rewrites one
    shard instead of the entire index, which is what `semlith watch` does on
    every save of every file, and a checkpoint is just a shard that has already
    landed.
  evidence_of_value: >
    All three claims are measurements, taken at a corpus at least an order of
    magnitude larger than the benchmark repository, and each has a failing
    counterpart in 0.6.0 to compare against.

    Resumability: a first index interrupted partway, then re-run, re-embeds only
    the files that were in flight at the interrupt — the second run reports the
    rest as unchanged, and a search finds the files completed before the
    interrupt. The same interrupt under 0.6.0 leaves nothing.

    Bounded memory: peak RSS while searching, measured at three corpus sizes an
    order of magnitude apart, stays inside the configured budget plus a stated
    fixed overhead instead of tracking chunk count. Opening a store and asking
    `stats` holds no vectors at all, so an idle MCP server with several large
    stores open is flat.

    Cheap incremental save: bytes written and wall-clock for a save after one
    changed file, measured on a small store and a large one, do not grow with the
    store — against 0.6.0, where both are the whole index every time.

    And the cost side, reported rather than promised: search latency on a store
    that fits its budget against 0.6.0 on the same corpus, and on a store that
    exceeds it, where shards are loaded and repacked per query.

scope:
  included:
    - >
      A sharded vector index for stores created by 0.7.0: fixed-size shards under
      the store directory, each written atomically, each independently loadable,
      searched and merged into one ranking. Recorded as `format_version` 2, which
      is what makes a 0.6.0 binary refuse such a store cleanly rather than read
      it as empty.
    - >
      A resident-memory budget for the vector index, with a documented default
      and an environment override, plus eviction of the least recently used
      prepared shards to stay inside it.
    - >
      Opening a store loads no vectors. `stats`, `files` and `forget` cost no
      vector memory, and an MCP server holding several stores open is idle at
      near-zero resident vector cost until something is searched.
    - >
      Checkpointed indexing: shards land and the hashes of the files they
      completed are committed as the run proceeds, in that order, so an
      interrupted run resumes from the last checkpoint and never records a file
      as indexed whose vectors are not durable.
    - >
      Incremental save: indexing or forgetting one file rewrites only the shards
      holding its chunks, not the whole index.
    - >
      Progress that predicts: files done out of total, chunks per second, an
      estimate of what remains, and on a resumed run how many files were skipped
      as already indexed.
    - >
      Existing stores are untouched. A format-1 store — everything written by
      0.6.0 and earlier — opens, searches and indexes on the single `index.tv`
      path exactly as it does today, with no migration and nothing rewritten, and
      its `format_version` is not bumped.
    - >
      Documentation: the store format section of `docs/compatibility.md`, a
      CHANGELOG entry stating the format change as a break with why and what to
      do, and the memory budget in the README.
    - >
      Measurement at a corpus at least an order of magnitude larger than the
      benchmark repository, with the measurement scripts kept as evidence.
  excluded:
    - >
      Automatic migration of a format-1 store onto shards. The vectors in an
      `index.tv` are quantized and cannot be split back out, so the only honest
      path is re-indexing, and a dedicated reindex command remains a product
      non-goal.
    - >
      Memory-mapping the vector index. turbovec 0.9.0 exposes no borrowed-slice
      or mmap loader, and semlith is not going to reimplement its SIMD kernels to
      get one.
    - >
      Approximate or graph indexes (HNSW, IVF). Shards are still scanned
      exhaustively; this release bounds memory, not comparisons.
    - >
      Reading a 0.7.0 sharded store from a 0.6.0 binary. `format_version` 2 makes
      it refuse, which is the designed behaviour, not a gap to close.
    - >
      Concurrent shard writers, parallel index runs, or any change to one writer
      per store.
    - Any change to the embedding model, chunking, ranking or fusion.
  fallback_scope:
    - >
      Checkpointed, resumable indexing on the existing single `index.tv` path,
      with the progress that predicts and the measurement that proves an
      interrupted run resumes. No format change, no shards, no memory budget —
      a smaller release that still delivers the half of the outcome a developer
      feels first, and leaves every store readable in both directions.

acceptance:
  functional:
    - >
      A first index of a large corpus interrupted with SIGINT partway through,
      then re-run with the same command, re-embeds only what was in flight: the
      second run reports the already-indexed files as unchanged, and a search
      returns a file that was completed before the interrupt. The same sequence
      against a 0.6.0 binary re-indexes the corpus from zero, which is what makes
      this a change rather than a claim.
    - >
      A store created by 0.7.0 records `format_version` 2, holds its vectors in
      more than one shard for a corpus large enough to need them, and answers a
      set of queries with a ranking whose overlap with an unsharded index over
      the same corpus meets a recall floor agreed in development and recorded with
      the number, not with the word "similar".
    - >
      A store written by 0.5.0 or 0.6.0 is opened, searched and indexed into by
      0.7.0 with no shard written, nothing re-embedded, and `format_version` left
      exactly as it was — absent stays absent, 1 stays 1.
    - >
      A 0.6.0 release binary pointed at a store 0.7.0 created refuses it with an
      error naming both format numbers, rather than reporting an empty corpus.
    - >
      In a large sharded store, `forget` of one file removes exactly that file's
      chunks — a later search no longer returns it, every other file still
      searches, and only the shards holding those chunks were rewritten.
      Re-indexing one changed file behaves the same way.
    - >
      `semlith index` reports files done out of total, a rate, and an estimate of
      what remains; a resumed run states how many files it skipped as already
      indexed.
  non_functional:
    - >
      Peak RSS while searching a sharded store stays inside the configured budget
      plus a stated fixed overhead, measured at three corpus sizes an order of
      magnitude apart, the largest at least ten times the benchmark corpus's
      chunk count. The same three sizes under 0.6.0 are measured alongside, so
      the flat line has a rising one next to it.
    - >
      Opening a store and running `stats` holds no vectors: resident memory for
      an opened-but-unsearched store is independent of its chunk count, and an
      MCP server holding several large stores open at rest is measured to show it.
    - >
      Search latency on a store that fits inside its budget is within a stated
      multiple of 0.6.0's on the same corpus. For a store that exceeds its
      budget the per-query shard load and repack cost is reported as a number,
      not smoothed over.
    - >
      A save after one changed file writes bytes and takes time that do not grow
      with the store: measured on a small store and on the largest one, against
      0.6.0 where both are the whole index.
    - >
      Peak indexing memory stays flat as corpus size grows — the product's
      existing success measure, re-verified under sharding rather than assumed to
      survive it.
    - >
      The existing suite passes unmodified: nothing in the 0.6.0 tests is edited
      to accommodate this release.
  operational:
    - >
      `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings` and the
      full test suite including the ignored integration tests are green.
    - >
      `cargo publish --dry-run` passes and the packaged tarball carries no
      `.env`, no `.ultraship` and no `.github`.
    - >
      The CHANGELOG has a 0.7.0 section — which is what the release workflow
      reads for its notes — and it states the store format change the way
      `docs/compatibility.md` says a break is stated: as a break, with why, and
      with what to do about an existing store.
    - >
      `docs/compatibility.md` is updated: format 2 and what it holds, what a
      0.6.0 binary does when it meets one, that format-1 stores are unchanged in
      both directions, and the memory budget environment variable added to the
      covered environment list.
    - >
      Published to crates.io, and the published crate verified from the registry
      rather than from the working tree: install it and index and search a real
      corpus with the binary that came out of crates.io.

delivery:
  target_mode: published
  environment: >
    A developer workstation — macOS arm64, Linux x86_64 and arm64. Installed by
    the user with `cargo install semlith` or a prebuilt binary from the GitHub
    release. No server component and no hosted environment to deploy to.
  deployment_method: >
    `feat/0.7.0` → PR to `develop` → PR to `main`, then the `v0.7.0` tag drives
    the GitHub release workflow, then `cargo publish` run from the machine. The
    registry publish is never done from CI, because it cannot be undone.
  migrations:
    - >
      None for an existing store. A format-1 store stays format 1, stays on the
      single `index.tv` path, and is never rewritten — which is what makes this
      release safe to install over an existing setup.
    - >
      A store created by 0.7.0 is `format_version` 2 and sharded. Moving an
      existing store onto shards means deleting the store directory and indexing
      again; the CHANGELOG says so and says what it costs, because for a large
      corpus it costs hours.
    - >
      No SQLite migration that rewrites data: whatever bookkeeping the shard
      mapping needs is added additively, and a store opened by an older binary
      keeps working from the columns it already knows.
  observability:
    - >
      Index progress on stderr: files done out of total, chunks per second, an
      estimate of what remains, and files skipped as already indexed on a resumed
      run.
    - >
      `stats` reports how many shards a store holds and what the resident budget
      is, so the memory cost is legible before a search rather than after.
    - >
      A line on stderr when shards were evicted to stay inside the budget — the
      signal that a store has outgrown its budget and searches are paying reload
      cost per query.
  rollback: >
    For every store that exists before this release, rollback is free: 0.7.0
    leaves format-1 stores untouched, so reinstalling 0.6.0 keeps them working
    exactly as they did. For a store 0.7.0 created, 0.6.0 refuses it by design —
    rollback for that store means indexing it again under the older binary, which
    is the cost the CHANGELOG states up front. crates.io cannot be unpublished, so
    a bad 0.7.0 is yanked and followed by 0.7.1; the GitHub release can be
    deleted and the tag re-cut.

dependencies:
  products: []
  services:
    - crates.io — the registry this release is published to, from the machine.
    - GitHub Actions — CI on every push and pull request, and the tagged release build.
  human_approvals: []

resource_profile:
  complexity: large
  uncertainty: medium
  likely_cost_drivers:
    - >
      Building and re-embedding a corpus an order of magnitude larger than the
      benchmark repository. Every memory measurement is a real embedding pass,
      and there are several to take, before and after, at three sizes.
    - >
      The shard reader, its budget and its eviction sit on the hot path of every
      search, so they need both correctness tests and a latency measurement
      rather than one or the other.
    - >
      Verifying recall did not move. turbovec fits its TQ+ calibration from the
      first batch added to an index, so per-shard fits are not the single
      whole-index fit, and the difference has to be measured on a real corpus.
    - >
      Two index paths — legacy single file and sharded — both exercised by the
      suite, including the cross-version compatibility runs against real 0.6.0
      and 0.5.0 release binaries.
  preferred_tools:
    - Rust 1.89, edition 2024, cargo test / clippy / fmt
    - The existing tests/measure.rs harness, which already measures a store and an idle MCP server
    - The existing evidence scripts under .ultraship/products/semlith/evidence for cross-version compatibility
    - /usr/bin/time -l and getrusage for peak RSS
    - Installed 0.5.0 and 0.6.0 release binaries as the comparison baseline
  constraints:
    - >
      turbovec 0.9.0 has no memory-mapped or borrowed-slice loader, and
      `prepare()` builds a second repacked copy of the codes. The bound must come
      from holding fewer vectors at once, not from mapping the file.
    - One writer per store, unchanged. Shards introduce no concurrency.
    - Local only — no network at query time, no API keys, nothing leaves the machine.
    - >
      The store layout is a covered surface in docs/compatibility.md, so the
      format change is a break and has to be announced as one.
    - crates.io publishes are permanent; a mistake is yanked, never removed.

risks:
  - >
    Per-shard TQ+ calibration is not the single whole-index fit, so scores from
    two shards are estimates made in slightly different coordinate systems and
    the merged ranking may not equal the unsharded one. This is the risk most
    likely to force /ultraship:iterate: if recall falls below the floor, either
    the shard size grows, the calibration is shared across shards, or the release
    falls back to its fallback scope.
  - >
    A store larger than its budget pays a shard load and a `prepare()` repack per
    query, and repack is linear in the shard's vector count. The release trades
    memory for latency on exactly the corpora it is aimed at, and the temptation
    will be to report the trade generously. The measurement has to be the number
    on the store that exceeds the budget, not the one that fits.
  - >
    Changing the store format breaks a covered surface. A 0.6.0 binary refusing a
    0.7.0 store is the correct behaviour and still a downgrade break, and the way
    it goes wrong is being folded into a list of improvements instead of being
    stated.
  - >
    Checkpointing writes vectors mid-run, so the commit order is load-bearing: a
    file's hash written before its shard is durable leaves a store that believes
    a file is indexed and holds no vectors for it. That is precisely the failure
    the PENDING sentinel exists to prevent, and periodic checkpoints multiply the
    number of moments it can happen at.
  - >
    Measuring at scale takes a corpus and hours of embedding. The failure mode is
    a rushed measurement at a corpus too small to distinguish a bounded curve from
    a linear one, leaving the release's central claim unfounded while looking
    evidenced.
  - >
    Two index paths is more surface than one. A bug fixed on the sharded path and
    left on the legacy path — or a legacy store quietly nudged onto shards — turns
    a compatibility promise into a compatibility claim.

open_questions:
  - >
    Shard size, as a fixed vector count. Small shards bound memory tightly and
    multiply per-query load and repack; large shards do the reverse. To be settled
    by measurement during development and recorded with the numbers that settled
    it, not guessed here.
  - >
    The default resident budget, and whether it is expressed in megabytes or in
    shards. It has to be generous on a 16 GB laptop and safe on an 8 GB one, which
    are the machines product.yaml names.
  - >
    Where the shard a chunk lives in is recorded. SQLite already owns the
    bookkeeping and is explicitly not a covered surface, which makes it the
    obvious home; a manifest file beside the shards is the alternative and would
    keep the vector side self-describing.
  - >
    Whether `stats` should report a store's estimated resident cost, and not only
    its shard count — the number that would let a developer predict whether their
    corpus fits before they spend hours indexing it.
