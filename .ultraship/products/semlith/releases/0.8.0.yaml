product: semlith
version: 0.8.0
status: released
release_type: minor

outcome:
  user_can: >
    Point `semlith index` at a directory that is not all code — a folder of Word
    documents, a deck, a spreadsheet of notes, a directory of Jupyter notebooks,
    a saved HTML page or a site's rendered docs — and get the same thing back
    that code and Markdown give today: ranked excerpts with a file and a line
    range, from the same command, with nothing converted by hand first. Ask an
    agent over MCP about a phrase that only exists inside a `.docx` paragraph, a
    slide's bullet, a spreadsheet cell, a notebook's markdown cell or the prose
    of an HTML page, and the excerpt comes back naming the file it came from.
    Files semlith cannot read — a legacy `.doc`, an encrypted document, a
    corrupt archive — are skipped exactly as they are today, counted, and never
    take a run down with them.
  business_value: >
    semlith's pitch is that an agent asks a local store rather than reading whole
    files, and the corpus a developer actually has is not all source. It is
    source plus the specification someone wrote in Word, plus the deck that
    explains the architecture, plus the notebook where the analysis lives, plus a
    directory of rendered documentation. Today all of that is invisible: `.docx`,
    `.pptx`, `.xlsx` and their OpenDocument equivalents are ZIP archives, so the
    NUL-byte check in `chunk::extract` classifies them as binary and skips them
    without a word. A `.ipynb` is indexed, but as its raw JSON — so a chunk is
    mostly `"cell_type"`, `"metadata"`, `"outputs"` and escaped newlines, and the
    prose an agent is searching for is buried in punctuation that costs it tokens
    and costs the ranking precision. An `.html` file is indexed as its markup, so
    a chunk of a rendered doc page is `<div class="...">` and its actual sentence
    is a fraction of the 800 characters the chunk was allowed.

    PDF is already handled, which is the proof this is worth doing and the shape
    to follow: the same `extract` hook, one format at a time, no new command and
    no new flag. The gap is that PDF was the only non-text format anyone reached
    for in 0.1.0, and the corpora 0.7.0 made viable — a notes archive, a
    monorepo, several repositories at once — are exactly the corpora where the
    other formats are sitting.

    The cost of not doing it is silent: a developer indexes a directory, semlith
    reports how many files it skipped, and nothing says the twelve documents that
    held the answer were among them. An agent then answers from what it could
    see, confidently and incompletely, which is worse than answering from
    nothing.
  evidence_of_value: >
    Two things have to be true and both are checkable on real files rather than
    on fixtures written to pass.

    The first is that the formats are actually read. Documents produced by real
    software — not hand-written XML — are indexed, and a phrase that exists only
    inside a paragraph, a slide, a cell, a notebook cell or an HTML page's prose
    is found by `semlith search` with a locator that points at it. The same
    corpus under 0.7.0 finds none of them, which is what makes this a change
    rather than a claim.

    The second is that the text is worth embedding. A chunk from a notebook is
    the cell's source and prose rather than JSON scaffolding, and a chunk from an
    HTML page is the page's sentences rather than its markup — measured as the
    share of extracted characters that survive, on the same files, before and
    after.

    And the failure side, which is the part that decides whether this is safe to
    ship: a corrupt archive, a truncated document, an encrypted one and a
    deliberately over-compressible archive are all indexed alongside the good
    files, and the run completes, skips them, and stays inside a bounded amount
    of memory while doing it.

scope:
  included:
    - >
      Office Open XML: `.docx`, `.pptx` and `.xlsx` are read as the ZIP archives
      they are, and the text a person would see comes out — Word paragraphs in
      document order, PowerPoint slide text in slide order, Excel cell values
      resolved through the shared-string table, sheet by sheet.
    - >
      OpenDocument: `.odt`, `.odp` and `.ods`, through the same archive path and
      the same paragraph-aware text extraction over `content.xml`. They cost one
      more match arm, not a second implementation, which is why they are in
      rather than deferred.
    - >
      Jupyter notebooks: `.ipynb` is parsed as the JSON it is, and what is
      embedded is the cells — markdown as prose, code as code, in notebook order,
      each marked with which cell it came from — instead of the raw JSON that is
      indexed today.
    - >
      HTML: `.html` and `.htm` are reduced to their text. Script and style
      contents are dropped, tags are removed, character entities are decoded, and
      the source's newlines are preserved so that the `file:line` locator on a
      hit still points at the line of the file it came from.
    - >
      A decompression bound. An archive is read under a cap on total extracted
      bytes and on any single entry, so a small file that expands enormously is
      skipped like any other unreadable file rather than deciding how much memory
      the run uses. The cap is a named constant, documented with its number.
    - >
      Every new path is fallible in the same way the PDF path already is: a
      malformed, truncated, encrypted or simply strange file is `None` —
      "deliberately skipped", counted in the run's `skipped` total — and never an
      error that ends the run or a panic that ends the process.
    - >
      Structural markers in the extracted text, so a locator into a format with
      no natural lines is still usable: which slide, which sheet, which notebook
      cell. Enough for a person or an agent to find the passage in the original
      application.
    - >
      Documentation: the README's "What gets indexed" section rewritten around a
      table of formats, a CHANGELOG entry that states the HTML and notebook
      change in behaviour as a change rather than only as an addition, and a line
      in `docs/compatibility.md` placing the text extracted from a given file
      outside the covered contract — the way ranking scores already are.
    - >
      Tests over documents produced by real software, kept as evidence, plus the
      hostile cases: a corrupt archive, a truncated one, an encrypted one, and an
      archive whose entries expand far beyond the cap.
  excluded:
    - >
      The legacy binary Microsoft formats `.doc`, `.xls` and `.ppt`. They are
      OLE2 compound files, not archives, they share nothing with the code this
      release adds, and the crates that read them are a different order of
      dependency. Converting one is a one-line LibreOffice invocation the user
      can run.
    - >
      RTF, EPUB, `.pages`/`.numbers`/`.key`, and mail archives. Each is its own
      parser for a smaller audience than the six formats above.
    - >
      Anything requiring OCR or image understanding: images in documents, scanned
      PDFs, chart contents, `alt` text is taken where it is text and nothing is
      inferred from a picture.
    - >
      Formula evaluation in spreadsheets. A cell's cached value is what a
      spreadsheet stores and what gets indexed; semlith is not a calculation
      engine.
    - >
      Document structure beyond what makes text readable: styles, tracked
      changes, comments, speaker notes, headers and footers, and cell formatting
      are not preserved, and revision history is not mined.
    - >
      A `semlith formats` command. `languages` and `models` exist because the
      values they list are arguments to a flag; the format list is documentation,
      and a README table is where documentation goes.
    - >
      Re-extracting files an existing store already indexed. A file whose bytes
      have not changed has an unchanged hash and is left alone, which is the
      incremental-index promise; the CHANGELOG says how to re-index an HTML or
      notebook corpus that should be re-read.
    - Any change to chunking, the embedding model, ranking, fusion or the store format.
  fallback_scope:
    - >
      Jupyter notebooks and HTML, without the archive formats. Both are text
      files that are already indexed badly rather than not at all, both are one
      self-contained function, neither needs a new dependency, and the pair is a
      coherent release: the two formats a developer's own repository is most
      likely to already contain, read as their content instead of as their
      syntax.

acceptance:
  functional:
    - >
      For each of `.docx`, `.pptx`, `.xlsx`, `.odt`, `.odp`, `.ods` and `.ipynb`,
      a file produced by real software and containing a phrase that appears
      nowhere else in the corpus is indexed by `semlith index`, and
      `semlith search` for that phrase returns that file as the top hit with a
      line range. The identical corpus indexed by a 0.7.0 release binary returns
      no hit for any of them.
    - >
      An HTML page is indexed as its text: a search for a sentence in its prose
      returns it, a search for a tag or attribute name that appears only in its
      markup returns no hit from that file, and the reported line range covers
      the source lines where that sentence lives — checked against the file on
      disk, not against the extracted text.
    - >
      A notebook's markdown cell, its code cell and its cell ordering all survive:
      searching for a phrase in a markdown cell and for an identifier defined in a
      code cell each return the notebook, and no chunk of the notebook is mostly
      JSON keys.
    - >
      A spreadsheet with more than one sheet returns text from a named sheet
      other than the first, and the excerpt says which sheet. A deck with more
      than ten slides returns text from slide 11 with the slide named, which is
      also what proves slide order is numeric rather than lexicographic.
    - >
      A corrupt archive, a truncated archive, a password-protected `.docx` and a
      zero-length file placed among good files are each counted as skipped, the
      run exits zero, and every good file in the same run is indexed.
    - >
      `semlith watch` picks up a saved `.docx` and a saved `.ipynb` the same way
      it picks up a saved `.rs`, and a store re-indexed after a document changes
      returns the new text and not the old.
  non_functional:
    - >
      An archive whose entries expand beyond the documented cap is skipped, and
      peak RSS for a run containing it stays within a stated margin of the same
      run without it. The number is measured, not asserted from the constant.
    - >
      No panic and no `unwrap` reachable from a hostile file: the whole extraction
      surface is exercised against malformed input for every format added, and
      `catch_unwind` protects any dependency that can panic, as it already does
      for PDF.
    - >
      Extraction efficiency, measured on the same files before and after: the
      share of a notebook's and an HTML page's extracted characters that are
      content rather than syntax, reported as two numbers per format.
    - >
      Indexing a corpus of ordinary source is not measurably slower than 0.7.0 on
      it — the dispatch this release adds is on extension, before any file is
      parsed, so a repository of Rust must not pay for the formats it has none of.
    - >
      The existing suite passes unmodified: no test that shipped in 0.7.0 is
      edited to accommodate this release.
  operational:
    - >
      `cargo fmt --check`, `cargo clippy --all-targets --all-features -- -D
      warnings`, and the full test suite including the ignored integration tests
      are green.
    - >
      `cargo publish --dry-run` passes on a clean tree, and `cargo package
      --list` carries no `.env`, no `.ultraship` and no `.github`. The added
      dependency is a released crates.io version with a licence compatible with
      Apache-2.0, and it is named in the CHANGELOG.
    - >
      The CHANGELOG has a 0.8.0 section — which is what the release workflow reads
      for its notes — stating both what is newly readable and what now reads
      differently, with what to do about a store that already indexed HTML or
      notebooks.
    - >
      The README's "What gets indexed" section lists every format and what is
      taken from it, including the size and decompression caps and what happens
      to a file that fails them.
    - >
      `docs/compatibility.md` says that which formats are extracted is documented
      and grows additively, and that the text extracted from a given file is not
      a covered surface — the same footing as ranking scores.
    - >
      Published to crates.io, and verified from the registry rather than from the
      working tree: install the published crate and index and search a real mixed
      corpus with the binary that came out of it.

delivery:
  target_mode: published
  environment: >
    A developer workstation — macOS arm64, Linux x86_64 and arm64. Installed by
    the user with `cargo install semlith` or a prebuilt binary from the GitHub
    release. No server component and no hosted environment to deploy to.
  deployment_method: >
    `feat/0.8.0` → PR to `develop` → PR to `main`, then the `v0.8.0` tag drives
    the GitHub release workflow, then `cargo publish` run from the machine. The
    registry publish is never done from CI, because it cannot be undone.
  migrations:
    - >
      None. No store format change, no schema change, and nothing rewritten. A
      store written by any earlier release opens, searches and indexes exactly as
      it does today.
    - >
      Files an existing store already indexed are not re-read, because their
      hashes have not changed. A corpus of HTML or notebooks indexed before 0.8.0
      keeps the chunks it has until those files change or the store is indexed
      again from an empty directory; the CHANGELOG states this and states the
      command that fixes it.
  observability:
    - >
      Skipped files stay visible in the run's `skipped` count, which is what
      already reports an unreadable PDF, and the count is the signal that a
      document was not readable.
    - >
      A file rejected for exceeding the decompression cap is distinguishable from
      one that is simply not a document, on stderr, so "my deck is missing" has an
      answer that is not a guess.
  rollback: >
    Rollback is free: 0.8.0 adds no format version, no schema column and no store
    layout change, so a store it wrote is a store 0.7.0 reads, and reinstalling
    0.7.0 loses the new formats and nothing else. The chunks 0.8.0 extracted from
    a document remain in the store and remain searchable under the older binary.
    crates.io cannot be unpublished, so a bad 0.8.0 is yanked and followed by
    0.8.1; the GitHub release can be deleted and the tag re-cut.

dependencies:
  products: []
  services:
    - crates.io — the registry this release is published to, from the machine.
    - GitHub Actions — CI on every push and pull request, and the tagged release build.
  human_approvals: []

resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
    - >
      Six new formats behind one hook. Each is small, and there are enough of
      them that the shared parts — the archive reader, the XML text pass, the
      caps — have to be right once rather than nearly right six times.
    - >
      Producing genuine test documents. Hand-written OOXML proves the parser
      reads what the test wrote; only a file from real software proves it reads
      what a developer has. Generating those needs a tool on the machine and the
      files kept as fixtures.
    - >
      The hostile cases are where the time goes: decompression bounds, truncated
      archives, encrypted documents, and confirming no panic path exists.
    - >
      A new dependency on a published crate has to be justified, pinned, its
      licence checked and its feature set trimmed, because every dependency is
      permanent once a version carrying it is on crates.io.
  preferred_tools:
    - Rust 1.89, edition 2024, cargo test / clippy / fmt
    - serde_json, already a dependency, for notebooks
    - A minimal-feature ZIP reader from crates.io for the archive formats
    - LibreOffice in headless mode, or an equivalent, to produce genuine test documents
    - The existing tests/roundtrip.rs and tests/watch.rs harnesses
    - Installed 0.7.0 release binary as the before-and-after comparison
  constraints:
    - >
      One `extract` hook. Formats are dispatched on extension before any parsing,
      so a corpus without documents pays nothing, and the binary check that
      currently rejects archives has to be bypassed only for extensions that have
      a reader.
    - >
      Memory stays bounded: extraction happens per file, inside the same 8 MiB
      file cap that governs everything else, plus a decompression cap that keeps
      a small archive from becoming a large allocation.
    - >
      A bad file must never end a run. Skipping is the established behaviour for
      an unreadable PDF and it is the behaviour every new format inherits.
    - Local only — no network, no service, nothing leaves the machine.
    - >
      crates.io publishes are permanent, and so is a dependency added in one. A
      mistake is yanked, never removed.

risks:
  - >
    HTML changes for the worse in one case: a repository of templates. Stripping
    tags is right for a rendered documentation page and wrong for a Handlebars or
    Jinja file where the markup is the code being searched for. The mitigation is
    that expressions inside the markup survive the strip and line numbers stay
    true, but a developer searching for `class="btn-primary"` in their templates
    will find that it no longer matches. This is the change most likely to need a
    way back, and the most likely to be discovered by a user rather than by a
    test.
  - >
    A ZIP reader is an attack surface pointed at whatever a user indexes. The
    failure mode is not a wrong answer, it is a run that allocates until the
    machine swaps, and the bound has to be a cap that is tested rather than a
    constant that is documented.
  - >
    Six formats, one release, is the shape that produces five good extractors and
    one that returns something plausible and wrong — a spreadsheet whose inline
    strings bypass the shared-string table, a deck whose slides come back in
    lexicographic order, a document whose table cells vanish. Each needs its own
    real file, not a variation of one fixture.
  - >
    Any file already in a store keeps the chunks it has. So the release will look
    like it did nothing to the person most likely to try it — the one who already
    indexed their notes — until they re-index, and the CHANGELOG line saying so is
    the only thing standing between that and a bug report.
  - >
    The new dependency is permanent. Choosing a heavy one, or one with a
    default feature set that pulls in compression backends this release does not
    need, costs every future version's build and package size.

open_questions:
  - >
    Whether the 8 MiB file cap should be higher for compressed formats. A deck
    with images passes 8 MiB easily while holding very little text, and it would
    be skipped for its pictures. The alternative is a per-format cap, which is
    more surface. To be settled by looking at real files during development.
  - >
    What a structural marker looks like in the extracted text. `# Slide 11` and
    `## Sheet: Q3` read well to a person and become part of an embedded chunk,
    which means they also become part of what is matched against. To be decided by
    measuring whether they help or dilute a search.
  - >
    Whether a spreadsheet should be extracted row-wise as delimited cells or one
    cell per line. Row-wise keeps a record together in a chunk; cell-wise gives a
    precise locator. This depends on what a spreadsheet in a developer's notes
    corpus actually is, and there will be real files to look at.
  - >
    Whether an HTML page should keep its `title` and heading structure as text
    ahead of the body, given that a rendered page's own headings are usually the
    best summary of it that exists.

released_at: 2026-07-30T17:45:00Z
mode: published
delivered: >
  The documents a corpus is actually made of. `semlith index` now reads
  `.docx`, `.pptx`, `.xlsx`, `.odt`, `.odp`, `.ods`, `.ipynb`, `.html` and
  `.htm` as the text a person opening them would see, through the same
  `chunk::extract` hook PDF has used since 0.1.0 — no new command, no new flag,
  no store format change.

  The comparison is the release. The same directory of eight documents,
  indexed by the real 0.7.0 binary from crates.io and by this build, asked the
  same eight questions: 0.8.0 answers all eight with the file that holds the
  phrase. 0.7.0 answers two, and the other six are not misses but confident
  wrong answers — it hands back the notebook or the HTML page, the only two
  files it could read at all, for a phrase sitting inside an archive it skipped
  as binary.

  What gets embedded is the content and not the syntax: a notebook went from
  1319 characters in the store to 454, an HTML page from 699 to 292, on the
  same files. Structure that a line number cannot express is named — `# Slide
  11`, `## Sheet: Q3 Notes`, `# Cell 2 (code)` — and an HTML hit still points
  at the line of the file on disk, because every newline in the source survives
  extraction, including the ones inside the tags that were removed.

  A file semlith cannot read is a file it walks past, as an unreadable PDF
  always has been: corrupt, truncated, encrypted, or expanding past the new 32
  MiB decompression cap. An archive whose single entry inflates to 64 MiB costs
  a run nothing — 271 MB peak RSS with it in the corpus, 271 MB without — and a
  corpus of ordinary Rust pays nothing either, at 18.98 s against 0.7.0's 18.66
  s on the same tree.
evidence:
  tests:
    - "cargo test — 65 unit tests and every default integration test pass, 0
       failed. Ten of the 65 are new, in src/formats.rs."
    - "cargo test --release -- --ignored, the full slow suite: clients 1, fleet
       10, formats 1, mcp 11, measure 5, roundtrip 3, shards 2, watch 11 — all
       pass, 0 failed. Every count except watch is what 0.7.0 shipped; watch
       gained one test and no existing test was edited."
    - "tests/formats.rs every_document_format_yields_the_text_a_person_would_see
       — eight fixtures written by python-docx 1.2.0, python-pptx 1.0.2,
       openpyxl 3.1.5 and odfpy 1.4.1, each checked for the phrases a person
       would see and against the syntax that carried them."
    - "tests/formats.rs an_html_hit_points_at_the_line_of_the_file_on_disk — the
       sentence is on line 15 of page.html and the chunk carrying it claims a
       range containing 15, checked against the file on disk rather than against
       the extracted text."
    - "tests/formats.rs slides_sheets_and_cells_are_named_and_in_order — slide
       11's phrase under its own marker with all twelve in ascending order,
       which is what proves the ordering is numeric: sorted as names, slide11
       precedes slide2."
    - "tests/formats.rs an_unreadable_document_is_skipped_rather_than_fatal —
       corrupt, truncated, empty, random bytes, broken JSON, a non-archive, a
       CFB header (what a password-protected Office file is on disk), a
       ZipCrypto-protected .docx and a 66 KB archive that expands to 64 MiB, all
       skipped, none read, none panicking."
    - "tests/formats.rs a_mixed_corpus_indexes_and_answers — ten files indexed
       in one run: eight documents indexed, two unreadable ones skipped, all
       eight questions answered by the right file with a locator, and an edit to
       the notebook re-indexes exactly one file and leaves none of the replaced
       text in the store."
    - "tests/watch.rs a_saved_document_is_searchable_like_a_saved_source_file —
       a .docx and a .ipynb saved into a watched directory become searchable
       through a real watcher."
  builds:
    - "cargo fmt --check — exit 0."
    - "cargo clippy --all-targets --all-features -- -D warnings — exit 0."
    - "cargo build --release — exit 0."
    - "cargo publish --dry-run on a clean tree — passed; 48 files, 772.1 KiB
       (272.5 KiB compressed), verify build clean. cargo package --list carries
       no .env, no .ultraship and no .github."
    - "git grep for committed tokens, api keys and private-key headers — none."
  reviews:
    - "The dependency was chosen to be the smallest thing that does the job:
       zip 8.6.0 (MIT) with default-features = false and only deflate-flate2 —
       the decompressor, none of the compressors, none of the ciphers. Six of
       the nine formats are ZIP archives of XML, so they share one bounded
       archive reader and one tag scanner rather than carrying six parsers;
       notebooks reuse serde_json, already a dependency, and HTML is a character
       scan with no dependency at all."
    - "Two bugs only a file written by real software could have exposed, both
       found by the fixtures and fixed: openpyxl writes relationship targets
       absolute (/xl/worksheets/sheet1.xml) where Excel writes them relative, so
       every sheet failed to open; and it writes inline strings rather than a
       shared-string table, which a shared-table-only reader would have returned
       as empty cells."
    - "The first ODF and Word output flattened tables into one cell per line,
       which loses the pairing a row carries. Rows and cells are now assembled
       by one shared Lines builder used by the Word, ODF and slide readers, so
       the three cannot drift into three different answers."
    - "The first bound on decompression buffered up to the cap before rejecting,
       which measured 13 MB of peak RSS for a file that was going to be refused.
       An entry declares its uncompressed size, so that is checked before a byte
       is inflated; the bounded read stays for the archive that lies. Re-measured
       at no difference at all."
    - "The evidence script's first timing run reported 33.9 s against 18.4 s and
       the second 14.70 against 14.59, on the same two binaries — the machine
       drifting, not the release. Runs are now interleaved within a round with a
       discarded warm-up, which is the same lesson 0.7.0 learned about its scale
       measurements."
  deployments:
    - "Not yet performed at seal time. cargo publish follows the feat/0.8.0 →
       develop → main merges and the tagged GitHub release, run from this
       machine rather than from CI, because a registry publish cannot be undone."
  health_checks:
    - "Real documents off this machine, not fixtures: a 1 MB sample .docx, a
       genuine Word job specification and a real .xlsx data dictionary indexed
       through the release binary — 3 files, 55 chunks, 2.7 s. `semlith search`
       for a question about the role returned the specification's own
       paragraphs at lines 8-11, and a question about column definitions
       returned the spreadsheet's rows as tab-separated cells with their
       comments."
    - "A 24 MB PowerPoint deck in the same directory was skipped, as designed:
       the 8 MiB per-file cap is unchanged and an image-heavy deck exceeds it.
       Reported in the run's skipped count."
    - "evidence/0.8.0/formats.sh and formats-run.txt — the four measurements
       through the real 0.7.0 binary installed from crates.io: 8 of 8 questions
       answered against 2 of 8, characters embedded per file, peak RSS with and
       without an over-cap archive across three interleaved rounds, and indexing
       time on ordinary source."
known_limitations:
  - "This record was sealed before the crates.io upload. delivery.target_mode is
     `published` and the remaining steps make it true: the feat/0.8.0 → develop
     → main merges, the v0.8.0 tag and its GitHub release, then cargo publish
     from this machine. The record states the authorised target rather than
     quoting a registry timestamp."
  - "HTML is now read as text for every .html file, including template files.
     A repository of Handlebars or Jinja templates loses its markup from the
     index: a search for `class=\"btn-primary\"` no longer matches, though the
     expressions inside the markup survive and line numbers stay true. There is
     no flag to opt out, and this is the change most likely to be discovered by
     a user rather than by a test."
  - "A file already in a store is not re-read while its bytes are unchanged, so
     a corpus of HTML or notebooks indexed before 0.8.0 keeps its old markup and
     JSON chunks until those files change. `semlith forget <PATH>` converts one
     file; a corpus means deleting the store and indexing again. The CHANGELOG
     says so."
  - "Line numbers for the archive formats and notebooks are positions in the
     extracted text, not in the file on disk — the same as PDF has always been.
     Only HTML keeps file-true lines. The markers exist because of this: `#
     Slide 11` is what makes such a locator usable."
  - "The markers are text in the chunk, so they are embedded with it and appear
     in excerpts. Whether they help retrieval or dilute it was not measured;
     they were chosen for legibility."
  - "The 8 MiB per-file cap is unchanged, so a deck or document that is large
     because of its images is skipped for its pictures — measured on a real 24
     MB PowerPoint file, which is skipped despite holding little text. The
     contract left this as an open question and the answer is a deliberate no
     change, not an oversight."
  - "Not read: legacy binary .doc, .xls and .ppt, RTF, EPUB, Pages/Numbers/Keynote
     and mail archives. A password-protected Office document is skipped, not
     decrypted. Speaker notes, comments, tracked changes, headers and footers are
     not extracted, and spreadsheet formulas are not evaluated — a cell's cached
     value is what is indexed."
  - "Nothing images or infers: no OCR, no scanned PDF, no chart contents. Alt
     text is taken only where it is already text."
  - "The committed fixtures were written by python-docx, python-pptx, openpyxl
     and odfpy — real libraries, not hand-written XML, and they found two real
     bugs. Files written by Word, PowerPoint and Excel themselves were exercised
     as health checks off this machine and deliberately not committed, so the
     suite that runs in CI is the library-written set."
  - "Notebook outputs are truncated at 2000 characters each and only a stream's
     text or a result's text/plain is kept. A cell whose interesting output is a
     widget or an image contributes nothing but its source."
  - "The XML scan is a scanner, not a parser: it does not resolve namespaces, so
     a document using unusual prefixes for the Word or ODF elements would come
     back thinner than it should. Every file tested uses the conventional
     prefixes, which is what the writing tools emit."
  - "All numbers here are from one machine, an Apple Silicon laptop. CI runs the
     suite on ubuntu-latest and macos-latest, but the RSS and timing figures are
     from the one machine, and RSS moves by a few MB run to run regardless of
     what is being measured."
