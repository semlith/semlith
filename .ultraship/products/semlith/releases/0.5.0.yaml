product: semlith
version: 0.5.0
status: planned
release_type: minor

outcome:
  user_can: >
    Point one search at several stores at once — `semlith search "how is the
    lock taken" -s ../api/.semlith -s ../cli/.semlith` — and get one ranked
    list back that says which store each excerpt came from. An agent gets the
    same thing over MCP: one `semlith mcp` process opened on several stores,
    one `semlith_search` call, excerpts from whichever repositories hold the
    answer.
  business_value: >
    A developer's work is not one repository. The service, the client, the
    shared library and the notes about all three sit in separate trees, and
    since 0.1.0 each one has needed its own store, its own search and — for an
    agent — its own MCP server. So the agent either asks the same question
    three times and merges the answers itself, burning the context this
    product exists to save, or it asks the one store it happens to be pointed
    at and confidently answers from a third of the corpus. Neither is a
    limitation the developer can see: an answer sourced from one repository
    looks exactly like an answer from all of them. Making one query span the
    stores is what turns semlith from a per-repository index into the thing an
    agent asks about the codebase.
  evidence_of_value: >
    One query over two stores of disjoint corpora returns excerpts from both,
    each labelled with the store it came from — and the excerpt that only the
    second store holds is ranked where a search of that store alone ranks it,
    not buried by the first. Proven through a real `semlith mcp` child process
    over stdio JSON-RPC, opened on both stores, in one tool call.

scope:
  included:
    - >
      `--store` is repeatable on the read commands (`search`, `stats`, `files`,
      `mcp`). One occurrence behaves exactly as it does in 0.4.0, so no
      existing invocation changes meaning. `SEMLITH_STORE` accepts a list
      separated by the platform's path separator, so an agent's MCP config can
      name several stores without a wrapper script.
    - >
      Multi-store search: every named store is searched, and the per-store
      rankings are fused into one list by the same reciprocal-rank fusion the
      dense and keyword halves already use. Rank fusion is what makes this
      honest — scores from two stores are not comparable in any other way, and
      with different models they are not even the same unit.
    - >
      Provenance on every hit: which store an excerpt came from, in the CLI
      output, in `--json`, and in the MCP tool result, so an agent can tell a
      match in the client from a match in the service.
    - >
      `k` stays global. Ten results over three stores means ten results, not
      thirty; each store is searched deeper than `k` so fusion has something to
      work with.
    - >
      Filters (`--path`, `--ext`, `--lang`) apply to every store, and a filter
      that selects nothing in one store still returns the stores where it
      selects something rather than reporting an empty filter.
    - >
      Stores built with different embedding models can be searched together.
      Each store embeds the query with its own model, which is the only correct
      way to query it, and fusion never compares the two models' numbers.
    - >
      A store path that does not exist is an error naming the path, and nothing
      is written. Today `open` creates the directory it is given, which for a
      read command means a mistyped store silently becomes an empty store that
      answers every question with nothing.
    - >
      The same store named twice — repeated flag, a relative and an absolute
      path, a symlink — is searched once. Fusing a store with itself doubles
      every one of its rank contributions and hands it the whole result list.
    - >
      `semlith stats` and `semlith files` report per store when several are
      given, so "is this corpus even indexed" stays answerable for each one.
    - >
      MCP: `semlith_search` accepts an optional `store` argument to narrow a
      query to a subset of the open stores, and `semlith_stats` reports each
      store. The tool descriptions say what the store labels mean, since an
      agent that cannot name a store cannot narrow to one.
    - >
      A store that `semlith watch` is holding the write lock on is searchable
      in a multi-store query, and picks up the watcher's writes on the same
      generation counter 0.4.0 added.
    - README section, CHANGELOG 0.5.0 section, MCP documentation of the store
      argument and the labels.
    - Publication to crates.io and a tagged GitHub release with binaries.
  excluded:
    - >
      Writing to several stores from one command. `index` and `watch` stay
      single-store: one writer per store is a product constraint, and a command
      that writes four stores is four lock acquisitions with four failure modes.
    - >
      A registry or config file of named stores. Stores are named by path;
      configuration files are a product-level non-goal, and `SEMLITH_STORE`
      plus a repeatable flag already fit an MCP server definition.
    - >
      Merging stores into one, or any tool for doing so. This release searches
      several stores; it does not consolidate them.
    - >
      Cross-store deduplication of the same file indexed into two stores. It is
      reported twice with two store labels, which is the truth about what is
      indexed.
    - >
      Searching stores concurrently on several threads. Sequential unless a
      measurement says otherwise — ONNX Runtime already sizes its own pool to
      the performance cores, and outer parallelism is a recorded non-goal.
    - Remote or network stores, and stores on network filesystems.
    - >
      Any change to the store schema, to `index.tv`, or to how chunks are cut.
      A 0.4.0 store must be searchable by 0.5.0 with no migration.
    - >
      Automatic discovery of stores by walking upward or scanning the disk for
      `.semlith` directories. The stores searched are the stores named.
  fallback_scope:
    - >
      Multi-store `search` and multi-store `mcp` over stores that share one
      embedding model, with provenance on every hit and `k` global. Mixed-model
      stores are refused with an error naming both models rather than searched,
      and `stats`/`files` stay single-store. Still coherent: an agent asks one
      question across its repositories, which is the roadmap outcome; the
      developer whose stores disagree about the model is told so instead of
      being handed a wrong answer.

acceptance:
  functional:
    - >
      One query over two stores holding disjoint corpora returns hits from
      both, each carrying the store it came from, in a single ranked list.
    - >
      A phrase that exists only in the second store is returned by a two-store
      query at the same rank it holds when that store is searched alone —
      adding a store does not bury the store that has the answer.
    - >
      A query answered well by one store is not degraded by also naming an
      unrelated store: the hits that a single-store search returns are still
      present, and still ranked above the unrelated store's best effort.
    - >
      `-k 5` over three stores returns five hits in total, not five per store.
    - >
      `--ext`/`--path`/`--lang` filter every store, and a filter that matches
      files in only one of two stores returns that store's hits rather than
      reporting that no files match.
    - >
      A `--store` path that does not exist exits non-zero naming the path, and
      no directory, `store.db` or `index.tv` is created anywhere as a result.
    - >
      Two stores built with different embedding models are searched in one
      query and both contribute hits, with each store's own model used to embed
      the query for it.
    - >
      Naming the same store twice — the flag repeated, and once by a relative
      and once by an absolute path — produces the same result list as naming it
      once, with no duplicated hits.
    - >
      A single `semlith_search` call against a real `semlith mcp` child process
      opened on two stores returns excerpts from both with their store labels,
      driven over stdio JSON-RPC; the `store` argument restricts the same query
      to one of them; and an unknown store name comes back as an in-band tool
      error naming the stores that are open.
    - >
      `semlith stats` and `semlith files` over two stores report both, labelled,
      and a single-store invocation prints exactly what 0.4.0 printed.
    - >
      A store being watched by a running `semlith watch` is searchable as part
      of a multi-store query, and an edit the watcher re-embeds is returned by a
      subsequent multi-store search from a long-running reader with no restart.
  non_functional:
    - >
      One search embeds the query once per distinct embedding model, not once
      per store — measured as a count, not asserted, over three same-model
      stores.
    - >
      Multi-store search latency is reported on the acceptance fixture for one,
      two and three stores, with the per-store increment stated, so the cost of
      adding a store is a number rather than a claim.
    - >
      Resident memory for a reader open on three same-model stores is reported
      and does not hold three copies of the model.
    - >
      No store schema change and no index format change: a store written by
      0.4.0 is searchable by 0.5.0 with no re-index, and a store written by
      0.5.0 is searchable by the 0.4.0 binary.
    - >
      Single-store behaviour is unchanged: `index`, `watch`, `search`, `stats`,
      `files`, `forget` and both MCP tools behave exactly as in 0.4.0 when one
      store is given, with the existing test suite passing unmodified.
  operational:
    - CI green on develop and on main for the release commit, with every action
      still pinned to a full-length commit SHA.
    - >
      README documents multi-store search: the repeatable flag, the
      `SEMLITH_STORE` list, what the store labels are, that writes stay
      single-store, and an MCP server definition naming several stores.
    - CHANGELOG has a 0.5.0 section, which is what the release workflow reads
      for its notes.
    - >
      `cargo publish --dry-run` passes and the packaged tarball contains no
      `.env` and no `.ultraship` directory.
    - crates.io serves semlith 0.5.0 and `cargo install semlith` resolves to it.
    - >
      The tagged GitHub release carries the four platform archives and
      SHA256SUMS, all release-workflow jobs green.
    - >
      The release ships through the project's branch flow: `feat/0.5.0` →
      pull request to `develop` → pull request to `main` → tag.

delivery:
  target_mode: published
  environment: >
    A developer workstation. Distributed via crates.io and prebuilt archives on
    GitHub Releases; there is no server to deploy to.
  deployment_method: >
    Merge to main, push the `v0.5.0` tag to trigger the release workflow, which
    verifies the tag against Cargo.toml, builds four platform archives and
    publishes the GitHub release. `cargo publish` is a deliberate manual step
    after the tagged release, never from CI.
  migrations:
    - >
      None. Multi-store search opens existing stores read-only and reads them
      through the paths 0.4.0 already uses. No new table, no new column, no
      `index.tv` change.
  observability:
    - >
      The result footer says how many stores were searched and how many hits
      came from each, so a store that contributed nothing is visible rather
      than indistinguishable from a store that was never opened.
    - >
      A store that cannot be opened — missing, unreadable, a dimension
      mismatch — is named in the error. In a multi-store query the failure says
      which store failed, because "store is corrupt" is useless when four were
      given.
    - >
      `semlith stats` over several stores prints one block per store plus a
      total, which is the check an agent's operator runs before believing an
      empty answer.
  rollback: >
    A crates.io publish is permanent. Rollback is `cargo yank 0.5.0` plus a
    0.5.1 fix; 0.4.0 stays installable and is unaffected, since no store
    written by 0.5.0 differs in format from one written by 0.4.0. The GitHub
    release can be deleted outright. For a user, rollback is passing one
    `--store` again — every single-store invocation is unchanged.

dependencies:
  products: []
  services:
    - crates.io — publish token must be present locally.
    - GitHub Actions — release workflow builds the platform archives.
  human_approvals:
    - >
      Explicit go-ahead before `cargo publish`, since it cannot be undone.
    - >
      Any new runtime dependency. None is expected: this release is a change to
      how existing stores are opened and how rankings are fused, and both use
      what is already in the tree.

resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
    - >
      Fusing across stores without letting an irrelevant store into the answer.
      Reciprocal-rank fusion gives every store's best hit the same weight, so a
      store with nothing to say still contributes a rank-1 result. Proving that
      adding a store does not degrade a query the original store answered is
      measurement work, and it is the criterion most likely to send the design
      back.
    - >
      Chunk ids are per store, so every id that leaves a store has to carry its
      store with it. Getting that wrong resolves a hit against the wrong
      SQLite database and returns text from the wrong repository, which reads
      as a plausible answer rather than as a bug.
    - >
      One embedder per distinct model rather than one per store. `Semlith` owns
      its embedder today; sharing one across several open stores is the change
      the memory criterion demands, and it touches the type every command uses.
    - >
      `Semlith::open` creates its directory. Making read commands refuse a
      path that is not already a store, without breaking `index`'s ability to
      create one, is a small change in a place every command goes through.
  preferred_tools:
    - cargo test for fusion, deduplication and store-label unit coverage.
    - >
      Real stores on a real filesystem for the cross-store tests: two temp
      corpora with disjoint vocabularies is what makes "the answer came from
      the right store" checkable.
    - >
      The release binary and a real stdio MCP server for the agent-facing
      acceptance criteria, as in 0.2.0, 0.3.0 and 0.4.0.
    - >
      tests/measure.rs for the latency, embed-count and memory numbers, which
      print what they saw rather than asserting a bound.
  constraints:
    - >
      One writer per store, unchanged. Multi-store is a read feature; a
      multi-store search must take no store lock, so a store being watched
      stays searchable.
    - >
      Vectors from two models are not comparable, and neither are cosine
      similarity and BM25. Everything crossing a store boundary has to be a
      rank, not a score.
    - >
      Each open store holds a SQLite connection and a loaded index; memory is a
      per-store cost that the model must not be part of.
    - Local only, single machine, single user. No network at query time.
    - >
      The CLI is the public contract. `--store` becoming repeatable must leave
      every 0.4.0 invocation, including a bare `SEMLITH_STORE`, meaning exactly
      what it meant.

risks:
    - >
      An unrelated store poisoning the top of the list. With rank fusion, the
      best hit from a store that does not discuss the query lands at rank 1 of
      its own ranking and is fused as though it were an answer. If the
      measurement shows this, the mitigation belongs in this release — a
      relevance floor, or weighting a store's contribution by its own ranking's
      agreement — not in a 0.5.1 after someone notices bad answers.
    - >
      A hit resolved against the wrong store. The dense index returns bare
      chunk ids, and ids collide across stores by construction: id 42 exists in
      every store. Any place a fused id loses its store returns the right
      excerpt from the wrong repository.
    - >
      Model-load cost multiplying. Three stores that each lazily load their own
      copy of the model is three model loads and three resident copies, turning
      a one-second cold start into three and the MCP server's footprint into
      something a developer notices.
    - >
      `SEMLITH_STORE` list parsing. Splitting on a separator breaks a path that
      contains it, and the separator differs between Unix and Windows. Using
      the platform's own path-list splitting is the only version of this that
      is not a bug on someone's machine.
    - >
      A mistyped store silently becoming an empty one. Because `open` creates
      directories, `-s ../ap/.semlith` today produces a store with no chunks
      that answers every query with nothing — and in a multi-store query it is
      invisible, because the other stores still return hits.
    - >
      Provenance costing an agent tokens. Every hit gains a store label; if it
      is the full absolute store path on every line, the release spends the
      context it exists to save.
    - >
      Windows is still unexercised by CI, as recorded for 0.4.0's watcher and
      0.3.0's path handling. Path-list splitting and case-insensitive path
      deduplication are both places this release could ship broken there.
open_questions:
    - >
      Whether one embedder is shared across stores with the same model or each
      store keeps its own. Sharing is what the memory criterion wants and
      requires lifting the embedder out of `Semlith`; per-store is no work at
      all. Decide by measuring three same-model stores, not by preference.
    - >
      What a store is called in output. The directory basename is `.semlith`
      for nearly every store, so it says nothing; the parent directory name is
      what a developer would say out loud; the full path is unambiguous and
      long. Leaning: parent directory name, disambiguated by more of the path
      only when two stores collide.
    - >
      Whether an irrelevant store's hits need a floor before fusion, and if so
      whether the floor is a rank cutoff or a score threshold within that
      store's own ranking. Settled by the no-degradation measurement during
      development.
    - >
      How deep each store is searched before fusion. `k * RANK_DEPTH` per store
      is the existing rule and is probably right, but the total work now scales
      with the number of stores; whether depth should shrink as stores are added
      is a measurement, not a guess.
    - >
      Whether `stats` over several stores should print one block per store, a
      single aggregate, or both. Leaning both — per store is the diagnostic, the
      total is the answer to "how much is indexed".
