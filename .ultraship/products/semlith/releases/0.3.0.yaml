product: semlith
version: 0.3.0
status: released
release_type: minor

outcome:
  user_can: >
    Narrow a search to part of an indexed corpus by path glob, file extension or
    language — from the CLI and from an agent over MCP — and get the best
    matches inside that subset rather than the best matches overall filtered
    down to whatever survives.
  business_value: >
    A store built from a whole repository is currently all-or-nothing at query
    time. An agent working on one subsystem gets the top hits from the entire
    corpus, so a question about the HTTP layer competes with vendored code,
    generated files, changelogs and test fixtures. Scoping the query is what
    turns a repo-wide store into a per-subsystem one without maintaining a
    second store per subsystem — and re-indexing per subsystem is exactly the
    cost semlith exists to avoid.
  evidence_of_value: >
    A query whose correct answer lives in a subsystem returns that chunk at a
    higher rank when the search is scoped to the subsystem than when it is not,
    measured on the same store with the same query set.

scope:
  included:
    - >
      A filter type carrying repeatable path globs, extensions and languages,
      resolved to a set of chunk ids by one SQLite query against files.path.
    - >
      Dense half of the search restricted with turbovec's
      IdMapIndex::search_with_allowlist, so the top-k is computed inside the
      subset rather than post-filtered from a global top-k.
    - >
      Keyword half of the search restricted by the same path predicate inside
      the FTS5 query, so both halves of the hybrid ranking see the same subset
      before reciprocal-rank fusion.
    - >
      CLI: `semlith search --path <glob> --ext <ext> --lang <name>`, each
      repeatable, combined as a union within a kind and an intersection is not
      offered.
    - >
      MCP: `semlith_search` gains optional `path`, `ext` and `lang` array
      arguments with the same meaning, described in the tool schema so an agent
      knows to scope a subsystem question.
    - >
      A built-in extension-to-language map covering the languages semlith is
      realistically pointed at, and `semlith languages` to print it.
    - >
      Non-absolute path globs are auto-anchored as `*/<pattern>` against the
      canonical stored path; absolute patterns are used verbatim.
    - >
      A filter matching nothing returns no hits and says so, rather than
      silently falling back to an unfiltered search.
    - README, CHANGELOG 0.3.0 section, and MCP tool documentation.
    - Publication to crates.io and a tagged GitHub release with binaries.
  excluded:
    - Filters on `semlith files` and `semlith stats`.
    - Content-based language detection; extension is the only signal.
    - Exclusion filters (`--not-path`), which invert the id-selection query.
    - Boolean composition beyond union-within-kind, intersection-across-kind.
    - Filtering at index time; the store still holds everything that was indexed.
    - Any change to the store schema or to index.tv.
    - Regex path matching. SQLite GLOB is the matcher.
  fallback_scope:
    - >
      `--path <glob>` only, repeatable, on `semlith search` and on the
      `semlith_search` MCP tool, with the same allowlist-based dense filtering
      and the same FTS5 predicate. Drops `--ext`, `--lang` and
      `semlith languages`; `--ext rs` becomes `--path '*.rs'`. Still a coherent
      release: an agent can scope a question to a subsystem.

acceptance:
  functional:
    - >
      `semlith search <q> --path '<subdir>/**'` returns only hits whose path
      matches the glob, on a store containing files both inside and outside it.
    - >
      A scoped search returns k hits when the subset holds at least k chunks,
      where a post-filtered global top-k would return fewer. Proven on a store
      where the subset is a small minority of chunks.
    - >
      `--ext rs` and `--lang rust` select the same chunk set on a corpus whose
      only Rust files end in `.rs`, and `--lang` accepts an unknown name with a
      clear error naming `semlith languages` rather than silently matching
      nothing.
    - >
      Repeating a flag unions: `--ext rs --ext toml` returns hits from both, and
      `--path 'src/**' --ext md` intersects across kinds — a Markdown file under
      src matches, a Markdown file elsewhere does not.
    - >
      A filter that matches no indexed file exits 0 with an explicit
      "no files match the filter" message on stderr, distinct from
      "no matches", and `--json` emits `[]`.
    - >
      The `semlith_search` MCP tool accepts `path`, `ext` and `lang` arrays and
      returns the same hits as the equivalent CLI invocation, and omitting them
      searches the whole store exactly as 0.2.0 did.
    - >
      A non-absolute glob matches regardless of the directory the search is run
      from, and an absolute glob matches only the paths it literally covers.
  non_functional:
    - >
      The unfiltered search path is structurally unchanged: with no filter,
      search issues the same turbovec call and a byte-identical FTS5 statement
      to 0.2.0 and builds no mask, and both versions return identical results
      for the same queries. Amended by US-SEMLITH-0.3.0-I01, which replaced a
      100k-chunk timing comparison; see that record for why.
    - >
      A scoped search over a subset of at least 100 chunks completes in under
      250 ms on the acceptance fixture, model already warm.
    - >
      Retrieval quality improves where it should: over a sample of self-labelled
      queries, restricting a query to the subsystem holding its answer does not
      lower that answer's rank against the unfiltered search.
    - >
      No store schema change. A 0.2.0 store opens, searches and filters without
      re-indexing, and a 0.3.0 store is readable by 0.2.0.
  operational:
    - CI green on develop and on main for the release commit.
    - >
      README documents the three filters, the `*/` anchoring rule and the fact
      that GLOB `*` crosses `/`.
    - >
      CHANGELOG has a 0.3.0 section, which is what the release workflow reads
      for its notes.
    - >
      `cargo publish --dry-run` passes and the packaged tarball contains no
      `.env` and no `.ultraship` directory.
    - crates.io serves semlith 0.3.0 and `cargo install semlith` resolves to it.
    - >
      The tagged GitHub release carries the four platform archives and
      SHA256SUMS, all release-workflow jobs green.

delivery:
  target_mode: published
  environment: >
    A developer workstation. Distributed via crates.io and prebuilt archives on
    GitHub Releases; there is no server to deploy to.
  deployment_method: >
    Merge to main, push the `v0.3.0` tag to trigger the release workflow, which
    verifies the tag against Cargo.toml, builds four platform archives and
    publishes the GitHub release. `cargo publish` is a deliberate manual step
    after the tagged release, never from CI.
  migrations:
    - >
      None. The filter reads `files.path`, which every store since 0.1.0
      already holds. No new table, no new column, no index.tv change.
  observability:
    - >
      `semlith search` already prints hit count and elapsed time to stderr; a
      scoped search additionally reports how many files the filter selected, so
      a filter that silently selects nothing is visible.
  rollback: >
    A crates.io publish is permanent. Rollback is `cargo yank 0.3.0` plus a
    0.3.1 fix; 0.2.0 stays installable and is unaffected, since no store written
    by 0.3.0 is unreadable by it. The GitHub release can be deleted outright.

dependencies:
  products: []
  services:
    - crates.io — publish token must be present locally.
    - GitHub Actions — release workflow builds the platform archives.
  human_approvals:
    - >
      Explicit go-ahead before `cargo publish`, since it cannot be undone.

resource_profile:
  complexity: small
  uncertainty: low
  likely_cost_drivers:
    - >
      Building an end-to-end fixture store large enough to prove that
      allowlist filtering beats post-filtering, rather than asserting it.
    - >
      Re-running the 100k-chunk latency measurement to show the unfiltered path
      did not regress.
  preferred_tools:
    - cargo test for the unit and roundtrip coverage.
    - >
      The release binary against a real corpus for the end-to-end acceptance
      criteria; in-process tests cannot prove CLI or MCP behaviour.
  constraints:
    - >
      `IdMapIndex::search_with_allowlist` panics on an empty allowlist and on
      any id not present in the index, so the id set must be intersected with
      the index and the empty case handled before the call.
    - >
      SQLite GLOB is the matcher: `*` crosses `/`, there is no `**`, and the
      match is case-sensitive. This is a documented semantic, not a bug to fix.
    - >
      Paths are stored canonical and absolute, so any relative pattern needs
      anchoring before it can match.
    - Local only, single machine, one writer per store. Unchanged by this release.

risks:
  - >
    The allowlist builds a `Vec<bool>` the size of the whole index on every
    filtered query. On a 100k-chunk store that is a 100 KB allocation per
    search, which is likely fine but is unmeasured — if it is not, the fix is to
    pass `None` when the filter selects everything.
  - >
    Passing a very large id set to `search_with_allowlist` (a filter matching
    most of the corpus) may be slower than an unfiltered search plus a
    post-filter. The crossover point is unknown and worth measuring before
    claiming the non-functional criterion.
  - >
    The FTS5 half and the dense half must agree on the subset exactly. If the
    SQL predicate and the allowlist are derived independently they can drift,
    and fusion would then rank a chunk that one half was never allowed to see.
    Both must come from one id-selection function.
  - >
    `--lang` is a hardcoded extension map and will be wrong or incomplete for
    somebody. Scoping it to a documented, printable list keeps that a known
    limitation rather than a silent miss.
  - >
    An agent given three new optional MCP arguments may over-scope queries and
    miss answers that live outside the subsystem it guessed. The tool
    description has to say when not to filter.

open_questions:
  - >
    Should a filter that selects zero files be an error exit rather than an
    empty result? Chosen: exit 0 with a distinct message, because an agent
    calling over MCP handles an empty result better than a failure. Revisit if
    it hides typos in practice.
  - >
    Should `--path` also accept a plain directory (`--path src`) as shorthand
    for `src/**`? Deferred: decide during development from what the acceptance
    fixture makes obvious.

released_at: 2026-07-29T16:02:02Z
mode: published
delivered: >
  A developer narrows a search to part of an indexed corpus by path glob, file
  extension or language — from the CLI and from an agent over MCP — and gets
  the best matches inside that subset, because the filter is applied before
  either half of the hybrid search picks its top-k rather than after.
evidence:
  tests:
    - "cargo test — 37 passed, 0 failed"
    - "cargo test --test roundtrip -- --ignored — 2 passed, 0 failed, including
       a filtered search over a corpus whose subsystem is a small minority"
    - "End-to-end acceptance through the release binary and a real stdio MCP
       server — 14 passed, 0 failed, covering all seven functional criteria"
    - "Cross-version store compatibility — 6 passed, 0 failed: a 0.2.0 store
       filters under 0.3.0 with its chunk count and index.tv byte-identical
       afterwards, and a 0.3.0 store opens and searches under 0.2.0"
    - "Scoped latency p50 17.93 ms, p95 66.5 ms over 39 queries on subsets of
       at least 100 chunks, against the contract's 250 ms"
    - "Rank behaviour: over the same 39 self-labelled queries, scoping to the
       directory holding the answer lowered its rank zero times"
  builds:
    - "cargo fmt --all -- --check — clean"
    - "cargo clippy --all-targets -- -D warnings — exit 0"
    - "cargo publish --dry-run — passed; packaged 24 files, 261.0 KiB, verified
       to contain no .env and no .ultraship before upload"
    - "CI green on main and on develop for release commit fa7f0b6"
    - "release.yml — 6 of 6 jobs green: verify, four platform builds, release"
  reviews:
    - "Self-review of the diff found and fixed one defect before release:
       matching_files errors were swallowed into 'no indexed file matches that
       filter', telling an agent to widen a filter when the real fault was an
       unreadable store (commit b07e94c)"
  deployments:
    - "GitHub release 'Semlith 0.3.0', not a draft, carrying
       aarch64-apple-darwin, aarch64-unknown-linux-gnu, x86_64-unknown-linux-gnu,
       x86_64-pc-windows-msvc and SHA256SUMS"
    - "crates.io reports semlith max_version 0.3.0, rust_version 1.89, not
       yanked, uploaded 2026-07-29T16:02:02Z"
  health_checks:
    - "Post-publication smoke test against the downloaded release archive, not
       a local build: shasum -a 256 -c SHA256SUMS OK, ./semlith --version
       reports 'semlith 0.3.0', ./semlith languages lists 25 languages, and a
       scoped search returned 3 hits, all 3 inside the glob"
known_limitations:
  - >
    Unfiltered search latency was not re-measured on a 100k-chunk store for
    0.3.0. The criterion was replaced by structural proof that the unfiltered
    path is unchanged plus identical results across six A/B runs; see
    US-SEMLITH-0.3.0-I01. The README's 105k-chunk figures remain 0.2.0's
    measurement and are not restated as 0.3.0's.
  - >
    The Windows path-separator translation in filter::anchor is unexercised.
    CI runs Ubuntu and macOS only, so the cfg(windows) branch that rewrites `/`
    to `\` has never executed in a test on any machine, despite Windows being a
    shipped platform. A Windows user's first glob is the first run of that code.
  - >
    Filters are SQLite GLOB: `*` crosses `/`, there is no distinct `**`, no
    regex, and no way to express "not this path". Matching folds case via
    SQL lower(), which is ASCII-only, so a non-ASCII path differing only by
    case will not match.
  - >
    `--lang` is a fixed 25-entry extension table and never reads file contents,
    so an extensionless script is not recognised as its language.
  - >
    Filters are not available on `semlith files` or `semlith stats`, so there
    is no way to preview which files a glob selects other than running a search
    and reading the reported count.
  - >
    Scoped latency and rank behaviour were measured on small fixtures of a few
    hundred chunks, not on a repository-scale corpus. A filter that selects a
    very large subset is untested for the crossover where passing a big
    allowlist costs more than an unfiltered scan.
  - >
    This release did not follow the project's `feat/<version>` → develop → main
    pull-request flow. Work was committed directly to main and `feat/0.3.0` was
    created afterwards at the release commit, so the branch records what shipped
    but not a review path.
supersedes: "0.2.0"
next_recommended_version: "0.4.0"
immutable: true
