product: semlith
status: active
versions:
  - version: 0.1.0
    outcome: >
      A developer indexes their docs and code locally and gets ranked excerpts with file:line
      locators back, from the CLI or from an agent over MCP.
    detail: outline
    status: released
  - version: 0.2.0
    outcome: >
      A developer indexes a repository on an ordinary laptop without watching memory or fearing a
      second terminal, and one search finds both an exact identifier and a plain-English question.
    detail: specified
    status: released
  - version: 0.3.0
    outcome: >
      A developer narrows a search to part of a corpus by path, extension or language, so an agent
      can ask about one subsystem instead of everything.
    detail: specified
    status: released
  - version: 0.4.0
    outcome: >
      A developer leaves a store current without re-running index by hand; edited files are
      re-embedded as they are saved, and an agent already connected over MCP searches the new
      contents without restarting its server.
    detail: specified
    status: released
  - version: 0.5.0
    outcome: >
      A developer searches several stores at once from a single query, so an agent working across
      repositories asks one question instead of many.
    detail: specified
    status: released
  - version: 0.6.0
    outcome: >
      A developer wires semlith into whichever agent they use — Claude Code, Codex, Copilot, Cursor,
      Zed, Gemini CLI, JetBrains — from a documented config for that client, gets a tool surface
      that covers what the CLI does rather than a fifth of it, and can read exactly which parts of
      semlith are covered by SemVer and which are not.
    detail: specified
    status: released
  - version: 0.7.0
    outcome: >
      A developer runs one semlith against a corpus far larger than a repository — the store is
      searched without loading every vector into memory, and a first index of it is resumable.
    detail: hypothesis
    status: planned
  - version: 0.8.0
    outcome: >
      A developer hands an agent a corpus of mixed formats — office documents, notebooks, HTML — and
      gets the same excerpts back as from code and Markdown today.
    detail: hypothesis
    status: planned
